<style>
:root{
  /* Layout: one phone-width column. A pinned status bar says whose pick it is; under it,
     rows of blind prospect cards. DELTA's dark world, single theme by choice. */
  color-scheme:dark;
  --ink:#0A0F1A; --ink-2:#0D1420; --panel:#111A28; --line:#1E2A3A;
  --paper:#EAF0F4; --fog:#8CA0B3; --fog-2:#748A9C;
  --teal-br:#2DD4BF; --teal:#14B8A6; --emerald:#10B981; --emerald-deep:#047857; --mint:#CCFBF1;
  --coral:#E05745; --sky:#6BB6E0; --topaz:#E0B34D;
  --t-g:var(--emerald); --t-b:var(--sky); --t-r:var(--coral);
  --teal-tint:color-mix(in srgb,var(--teal-br) 14%,var(--panel));
  --sans:"Nunito Sans","Avenir Next",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --geo:"Josefin Sans","Century Gothic",Futura,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--sans);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{min-height:100%}
button,select{font:inherit;color:inherit}
s{text-decoration:none}
a{color:var(--teal-br)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
:focus-visible{outline:2px solid var(--teal-br);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--paper)}
.brand svg{width:30px;height:30px;flex:none}
.brand span{font-family:var(--geo);font-weight:700;font-size:16px;letter-spacing:.22em;padding-top:3px}
.tag{font-size:12px;font-weight:700;color:var(--fog);white-space:nowrap}

.hero h1{font-size:28px;line-height:1.15;font-weight:800;margin:6px 0 8px;text-wrap:balance}
.lede{font-size:15px;line-height:1.5;color:var(--fog);margin:0;max-width:44ch}
h2{font-size:17px;font-weight:800;margin:6px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.cap{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fog-2)}
.note{font-size:13px;line-height:1.45;color:var(--fog);margin:0}
.tally{font-size:13px;color:var(--fog);margin:0;text-align:center}
.tally b{font-family:var(--mono);font-weight:500;color:var(--paper)}

.btn{height:52px;border:0;border-radius:var(--r);background:var(--teal-br);color:var(--ink);font-size:16px;font-weight:800;cursor:pointer;width:100%}
.btn:active{transform:scale(.99)}
.btn.ghost{background:var(--ink-2);color:var(--paper);border:1px solid var(--line)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;min-width:38px;padding:0 12px;border-radius:19px;border:1px solid var(--line);background:var(--ink-2);color:var(--fog);font-size:13px;font-weight:700;cursor:pointer}
.chip.num{font-family:var(--mono);font-weight:500;padding:0}
.chip.on{background:var(--teal-tint);border-color:var(--teal-br);color:var(--teal-br)}

/* a blind prospect row */
.row{display:grid;grid-template-columns:36px minmax(0,1fr) auto 64px;column-gap:10px;row-gap:1px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row.demo{grid-template-columns:36px minmax(0,1fr) auto}
.row .pos{grid-column:1;grid-row:1/span 2}
.row .ttl{grid-column:2;grid-row:1;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .fx{grid-column:2/span 2;grid-row:2;font-size:12.5px;color:var(--fog);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.demo .fx{grid-column:2}
.row .mk{grid-column:3;grid-row:1}
.row .mk s{display:none}
.row.demo .mk{grid-row:1/span 2}
.row.demo .mk s{display:block}
.row .dr{grid-column:4;grid-row:1/span 2;width:64px;padding:0}
.row .cs{grid-column:2/span 3;grid-row:3;display:flex;flex-direction:column;gap:5px;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
.row.demo .cs{grid-column:2/span 2}
.csc{font-size:11px;line-height:1.35;color:var(--fog-2)}
.cst{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cst div{min-width:0}
.cst s{display:block;font-size:10px;font-weight:700;color:var(--fog-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cst b{display:block;font-family:var(--mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;margin-top:1px}
.bwrap{display:flex;flex-direction:column}
.bhead{display:grid;grid-template-columns:36px minmax(0,1fr) auto 64px;column-gap:10px;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--fog-2);padding-bottom:6px;border-bottom:1px solid var(--line)}
.bhead span:nth-child(3){text-align:right}
.card .row{padding:4px 0;border-bottom:0}
.pos{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--paper);background:var(--ink-2);border:1px solid var(--line);border-radius:8px;width:36px;text-align:center;padding:5px 0;flex:none}
.mk{text-align:right}
.mk s{display:block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--fog-2)}
.mk b{font-family:var(--mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.dr{height:44px;padding:0 14px;border-radius:12px;border:0;background:var(--teal-br);color:var(--ink);font-size:14px;font-weight:800;cursor:pointer}
.dr[disabled]{background:transparent;border:1px solid var(--line);color:var(--fog-2);cursor:default}
.none{padding:18px 0;color:var(--fog);font-size:13px}

/* draft screen */
.status{position:sticky;top:0;z-index:5;background:var(--ink);border-bottom:1px solid var(--line);padding:10px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.status .pk b{font-family:var(--mono);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-right:8px}
.status .pk s{font-size:12px;color:var(--fog)}
.status .msg{font-size:14px;font-weight:800;color:var(--fog);text-align:right}
.status.on .msg{color:var(--teal-br)}
.mine{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{border:1px dashed var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-height:64px}
.slot.got{border-style:solid;border-color:var(--teal-br);background:var(--teal-tint)}
.slot s{font-family:var(--mono);font-size:11px;color:var(--fog)}
.slot b{font-size:15px;font-weight:800}
.slot i{font-style:normal;font-size:11.5px;color:var(--fog);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tick{display:flex;flex-direction:column;gap:4px;min-height:96px}
.trow{display:grid;grid-template-columns:42px 36px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px;color:var(--fog)}
.trow .tp{font-family:var(--mono);color:var(--paper)}
.trow .pos{font-size:11px;padding:3px 0}
.trow .tn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow.me{color:var(--teal-br)}
.trow.me .tp{color:var(--teal-br)}
.trow.none{display:block}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ctl2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:21px;background:var(--ink-2);padding:2px;flex:none}
.seg button{min-height:38px;padding:0 12px;border:0;border-radius:19px;background:transparent;color:var(--fog);font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--teal-tint);color:var(--teal-br)}
.hint{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:4px 12px}
.hint[hidden]{display:none}
.hint summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--teal-br);min-height:36px;display:flex;align-items:center}
.hint p{margin:0 0 8px;font-size:12px;line-height:1.5;color:var(--fog)}
.hint p b{color:var(--paper)}
.sortl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--fog)}
.sortl select{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--ink-2);padding:0 10px;font-size:13px;font-weight:700}
.board{display:flex;flex-direction:column}

/* reveal */
.year{text-align:center;padding:6px 0 2px}
.year s{display:block;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--fog)}
.year b{display:block;font-family:var(--mono);font-size:64px;line-height:1.05;font-weight:700;color:var(--teal-br);font-variant-numeric:tabular-nums}
.grade h2{font-size:22px;line-height:1.2;margin:0;text-wrap:balance}
.grade.up h2{color:var(--teal-br)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiles div{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:10px}
.tiles s{display:block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--fog-2)}
.tiles b{display:block;font-family:var(--mono);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.bar{height:8px;border-radius:4px;background:var(--ink-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal-br);border-radius:4px}
.pc{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--fog-2);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pc.t-g{border-left-color:var(--t-g)} .pc.t-b{border-left-color:var(--t-b)} .pc.t-r{border-left-color:var(--t-r)}
.pch{display:flex;gap:10px;align-items:baseline;font-size:12px;color:var(--fog)}
.pch .tp{font-family:var(--mono);color:var(--paper);font-weight:700}
.pch .blind{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcm{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pcn{min-width:0}
.nm{display:block;white-space:nowrap;overflow:hidden}
.pcn .nm{font-size:21px;font-weight:800;line-height:1.2}
.pcn s{display:block;font-size:12.5px;color:var(--fog);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcv{text-align:right;flex:none}
.pcv b{display:block;font-family:var(--mono);font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.pcv s{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fog-2);margin-top:4px}
.t-g .pcv b,.t-g .tw{color:var(--t-g)} .t-b .pcv b,.t-b .tw{color:var(--t-b)} .t-r .pcv b,.t-r .tw{color:var(--t-r)}
.pcs{display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.tw{font-weight:800}
.ys{font-family:var(--mono);font-size:11.5px;color:var(--fog)}
.pcc{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.pcc div{min-width:0}
.pcc s{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fog-2)}
.pcc b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;margin-top:2px}
.away p{font-size:14.5px;line-height:1.5;margin:0;color:var(--fog)}
.away p b{color:var(--paper)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--fog)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.t-g{background:var(--t-g)} .dot.t-b{background:var(--t-b)} .dot.t-r{background:var(--t-r)}
.brow{display:grid;grid-template-columns:42px 9px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.brow .tp{font-family:var(--mono);font-size:12.5px;color:var(--fog)}
.brow .nm{font-size:14.5px;font-weight:700}
.brow .bn s{display:block;font-size:11.5px;color:var(--fog);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .bv{font-family:var(--mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.brow.me{background:var(--teal-tint);margin:0 -8px;padding:9px 8px;border-radius:10px;border-bottom-color:transparent}
.brow.me .tp{color:var(--teal-br)}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.srow .sr{font-family:var(--mono);font-size:13px;color:var(--fog)}
.srow .st{font-family:var(--mono);font-variant-numeric:tabular-nums}
.srow .sp{font-size:12px;font-weight:400;color:var(--fog)}
.pg{font-size:12.5px;color:var(--fog);margin-top:2px}
.pg b{font-family:var(--mono);font-weight:700;color:var(--paper)}
.srow.me{background:var(--teal-tint);margin:0 -8px;padding:8px;border-radius:10px;border-bottom-color:transparent;font-weight:800}
.srow.me .sr{color:var(--teal-br)}
.copybox{width:100%;min-height:92px;border-radius:12px;border:1px solid var(--line);background:var(--ink-2);color:var(--paper);font-family:var(--mono);font-size:12px;padding:10px}
footer{font-size:11.5px;line-height:1.55;color:var(--fog-2);margin-top:6px}
.stg{opacity:0;transform:translateY(10px);transition:opacity .45s ease,transform .45s ease}
.stg.in{opacity:1;transform:none}
#selfcheck{font-size:11px;color:var(--fog);white-space:pre-wrap;padding:0 16px}
@media (prefers-reduced-motion:reduce){.stg{transition:none}.btn:active{transform:none}}
@media (min-width:480px){.hero h1{font-size:32px}}
</style>

  var k=Math.min(S.k,TOTAL-1),team=k%TEAMS+1,rd=Math.floor(k/TEAMS)+1,until=((S.slot-team)+TEAMS)%TEAMS;
  var left=S.mine.length<ROUNDS;
  var msg=S.wait?'You’re On The Clock':!left?'Finishing The Round':(until===1?'You Pick Next':'Your Pick In '+until);
  st.className='status'+(S.wait?' on':'');
  st.innerHTML='<span class="pk"><b>'+pickLabel(k)+'</b><s>Round '+rd+' Of '+ROUNDS+'</s></span><span class="msg">'+msg+'</span>';
  var h='';
  for(var r=0;r<ROUNDS;r++){var x=S.mine[r];
    h+=x?'<div class="slot got"><s>'+pickLabel(x.k)+'</s><b>'+x.p.pos+'</b><i>'+shortNfl(x.p)+'</i></div>'
        :'<div class="slot"><s>'+pickLabel(r*TEAMS+S.slot-1)+'</s><b>—</b><i>Your Pick</i></div>';}
  document.getElementById('mine').innerHTML=h;
  var last=S.log.slice(-3).reverse();
  document.getElementById('tick').innerHTML='<div class="cap">Latest Picks</div>'+(last.length?last.map(function(p){
    var me=p.taken.team===S.slot;
    return '<div class="trow'+(me?' me':'')+'"><span class="tp">'+pickLabel(p.taken.k)+'</span><span class="pos">'+p.pos+'</span><span class="tn">'+nflLabel(p)+'</span><span class="tm">'+(me?'You':'Team '+p.taken.team)+'</span></div>';
  }).join(''):'<div class="trow none">The draft opens at 1.01. You hold pick '+S.slot+' in every round.</div>');
  updateBoard();
}
function updateBoard(){
  var b=document.getElementById('board');if(!b)return;
  var a=avail().filter(function(p){return S.pos==='ALL'||p.pos===S.pos;});
  a.sort(S.sort==='dd'?function(x,y){return ddv(y)-ddv(x)||x.mr-y.mr;}
        :S.sort==='cy'?function(x,y){return collegeYards(y)-collegeYards(x)||x.mr-y.mr;}
        :S.sort==='pk'?function(x,y){return (x.pk||999)-(y.pk||999)||x.mr-y.mr;}
        :S.sort==='age'?function(x,y){return (x.age==null?99:x.age)-(y.age==null?99:y.age)||x.mr-y.mr;}
        :function(x,y){return x.mr-y.mr;});
  b.innerHTML=a.length?a.map(function(p){return rowHTML(p,S.wait,false,null,null,false,S.view);}).join(''):'<div class="none">No one left at this position.</div>';
}

/* ---------- finish and reveal ---------- */
function finish(){
  var mine=0,mkt=0,best=0;
  S.mine.forEach(function(x){mine+=x.p.v;mkt+=x.m.v;best+=x.b.v;});
  S.tot={mine:mine,mkt:mkt,best:best};S.done=true;S.wait=false;
  var md=S.usedDelta?'d':'b';stats.n++;stats[md].n++;if(mine>mkt){stats.w++;stats[md].w++;}saveStats();
  var tt={},tg={},i;for(i=1;i<=TEAMS;i++){tt[i]=0;tg[i]=0;}
  S.log.forEach(function(p){tt[p.taken.team]+=p.v;tg[p.taken.team]+=p.taken.g/ROUNDS;});
  var rows=[];for(i=1;i<=TEAMS;i++)rows.push({team:i,v:tt[i],g:g0(tg[i])});
  rows.sort(function(a,b){return b.g-a.g||b.v-a.v||(a.team===S.slot?-1:b.team===S.slot?1:a.team-b.team);});
  rows.forEach(function(r){r.rank=1+rows.filter(function(x){return x.g>r.g;}).length;});
  var me=rows.filter(function(r){return r.team===S.slot;})[0];
  S.room={rows:rows,rank:me.rank,tied:rows.filter(function(r){return r.g===me.g;}).length>1,top:rows[0].g,g:me.g};
  room[md].n++;room[md].f+=me.g;try{localStorage.setItem('tmd-grade',JSON.stringify(room));}catch(e){}
  if(AUTO&&HASH!=='autodone'){renderReveal(true);
    setTimeout(selfCheck,3500);}else renderDone();
}
function renderDone(){
  app.innerHTML=head('Time Machine Draft')+
    '<section class="hero"><h1>Draft Complete</h1><p class="lede">Three picks, made on the facts alone. Ready to see who they were?</p></section>'+
    '<section class="card"><div class="cap">Your Picks</div>'+S.mine.map(function(x){return rowHTML(x.p,false,true,'Pick',pickLabel(x.k),true);}).join('')+'</section>'+
    '<button class="btn" type="button" data-act="reveal">Reveal The Class</button>'+foot();
  window.scrollTo(0,0);
}
function pickCard(x){
  var p=x.p,t=tier(p);
  return '<article class="pc stg t-'+t+'">'+
    '<div class="pch"><span class="tp">'+pickLabel(x.k)+'</span><span class="blind">'+nflLabel(p)+(p.age!=null?' · Age '+p.age.toFixed(1):'')+'</span></div>'+
    '<div class="pcm"><div class="pcn"><b class="nm">'+esc(p.n)+'</b><s>'+sub(p)+'</s></div><div class="pcv"><b>'+p.v+'</b><s>Over A Starter</s></div></div>'+
    '<div class="pcs"><span class="tw">'+tierWord(p)+'</span><span class="ys">'+seasons(p)+'</span><span class="pg">Pick Grade <b>'+g0(p.taken.g)+'%</b></span></div>'+
    '<div class="pcc"><div><s>Market’s Pick Here'+(x.m===p?'':' · '+x.m.v)+'</s><b class="nm">'+(x.m===p?'Same Player':esc(x.m.n))+'</b></div>'+
    '<div><s>Best Available'+(x.b===p?'':' · '+x.b.v)+'</s><b class="nm">'+(x.b===p?'You Got Him':esc(x.b.n))+'</b></div></div></article>';
}
function boardRow(p,label){
  var me=p.taken&&p.taken.team===S.slot;
  return '<div class="brow'+(me?' me':'')+'"><span class="tp">'+label+'</span><span class="dot t-'+tier(p)+'"></span>'+
    '<span class="bn"><b class="nm">'+esc(p.n)+'</b><s>'+p.pos+' · '+shortNfl(p)+' · Market '+mktLabel(p)+(me?' · You':'')+'</s></span>'+
    '<span class="bv">'+p.v+'</span></div>';
}
function renderReveal(instant){
  var T=S.tot,d=T.mine-T.mkt,RM=S.room;
  var hl=RM.rank===1?(RM.tied?'Your Picks Tied For Best In The Room':'Best Picks In The Room'):(RM.tied?'Your Picks Tied For ':'Your Picks Ranked ')+ord(RM.rank)+' Of 12';
  var pct=T.best>0?Math.round(100*T.mine/T.best):0;
  var mineSet=S.mine.map(function(x){return x.p;}),away=null;
  S.mine.forEach(function(x){if(x.b!==x.p&&mineSet.indexOf(x.b)<0&&x.b.v>0&&(!away||x.b.v>away.b.v))away=x;});
  var left=avail().sort(function(a,b){return b.v-a.v||a.mr-b.mr;});
  app.innerHTML=head('Time Machine Draft')+
    '<div class="year stg"><s>The Class Of</s><b>'+S.year+'</b></div>'+
    S.mine.map(pickCard).join('')+
    '<section class="card grade stg'+(RM.rank<=3?' up':'')+'"><h2>'+hl+'</h2>'+
      '<p class="note">Each pick is graded against the players still on the board when it was made. 100% means you took the best one left; 50% means half of them did better. Every team is graded the same way, so an early slot is no advantage.</p>'+
      '<div class="tiles"><div><s>Your Pick Grade</s><b>'+RM.g+'%</b></div><div><s>Best In The Room</s><b>'+RM.top+'%</b></div><div><s>Your Points</s><b>'+T.mine+'</b></div></div>'+
      '<div class="bar" role="img" aria-label="Pick grade '+RM.g+' percent"><i style="width:'+Math.max(0,Math.min(100,RM.g))+'%"></i></div>'+
      '<p class="note">'+(S.usedDelta?'Drafted with DELTA Read.':'Drafted on the box score alone.')+' Points are value above a starting-level player over his first three seasons. The market’s picks at your spots would have scored '+T.mkt+'; the best available, '+T.best+'.</p></section>'+
    '<section class="card stg"><div class="cap">The Room, By Pick Grade</div>'+RM.rows.map(function(r){var me=r.team===S.slot;
      return '<div class="srow'+(me?' me':'')+'"><span class="sr">'+ord(r.rank)+'</span><span>'+(me?'You':'Team '+r.team)+'<s class="sp"> \u00b7 '+r.v+' Points</s></span><span class="st">'+r.g+'%</span></div>';}).join('')+'</section>'+
    (away?'<section class="card away stg"><div class="cap">The One That Got Away</div><p>At <b>'+pickLabel(away.k)+'</b> you passed on <b>'+esc(away.b.n)+'</b>, worth <b>'+away.b.v+'</b>. '+(away.b.taken?'He went at '+pickLabel(away.b.taken.k)+'.':'Nobody in this room drafted him.')+'</p></section>':'')+
    '<div class="acts stg"><button class="btn" type="button" data-act="again">Draft Again</button><button class="btn ghost" type="button" data-act="copy">Copy Result</button></div>'+
    '<div id="copyslot"></div>'+
    '<section class="stg"><h2>The Full Board</h2></section>'+
    '<div class="legend stg"><span><i class="dot t-r"></i>No Starter Seasons</span><span><i class="dot t-b"></i>One</span><span><i class="dot t-g"></i>Two Or More</span></div>'+
    '<section class="board stg">'+S.log.map(function(p){return boardRow(p,pickLabel(p.taken.k));}).join('')+'</section>'+
    (left.length?'<section class="stg"><h2>Not Drafted In This Room</h2></section><section class="board stg">'+left.map(function(p){return boardRow(p,'—');}).join('')+'</section>':'')+
    foot();
  window.scrollTo(0,0);fitNames();[150,600,1500,3000].forEach(function(t){setTimeout(fitNames,t);});
  var els=app.querySelectorAll('.stg'),i;
  if(instant||reduce){for(i=0;i<els.length;i++)els[i].classList.add('in');return;}
  for(i=0;i<els.length;i++){(function(el,n){setTimeout(function(){el.classList.add('in');},n<5?250+n*650:3500+(n-5)*120);})(els[i],i);}
}
/* Names never wrap or cut off (DELTA rule, 25 Oct 2026): shrink the font until the name fits on one line. */
function fitNames(){
  var a=app.querySelectorAll('.nm'),i,el,fs,min;
  for(i=0;i<a.length;i++){el=a[i];el.style.fontSize='';fs=parseFloat(getComputedStyle(el).fontSize);min=fs*0.6;
    while(el.scrollWidth>el.clientWidth+1&&fs>min){fs-=0.5;el.style.fontSize=fs+'px';}}
}
try{if(document.fonts&&document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',function(){if(S&&S.room)fitNames();});}catch(e){}
var fitT=null;window.addEventListener('resize',function(){clearTimeout(fitT);fitT=setTimeout(function(){if(S&&S.room)fitNames();},150);});
function resultText(){
  var T=S.tot,d=T.mine-T.mkt;
  return 'DELTA Time Machine Draft · Class Of '+S.year+' · Slot '+S.slot+' · '+(S.usedDelta?'With DELTA Read':'Box Score Only')+'\n'+
    'Pick grade '+S.room.g+'% ('+(S.room.tied?'tied ':'')+ord(S.room.rank)+' of 12) \u00b7 '+T.mine+' points (market’s picks at my spots: '+T.mkt+')\n'+
    S.mine.map(function(x){return pickLabel(x.k)+' '+x.p.n+' ('+x.p.v+')';}).join(' · ');
}
function copyResult(btn){
  var txt=resultText();
  function fallback(){
    var slot=document.getElementById('copyslot');if(!slot)return;
    slot.innerHTML='<label class="cap" for="copybox">Press And Hold To Copy</label><textarea class="copybox" id="copybox" readonly></textarea>';
    var ta=document.getElementById('copybox');ta.value=txt;try{ta.focus();ta.select();}catch(e){}
  }
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){btn.textContent='Copied';setTimeout(function(){btn.textContent='Copy Result';},1800);},fallback);
    }else fallback();
  }catch(e){fallback();}
}
function selfCheck(){
  var t=S.players.filter(function(p){return p.taken;}),per={},ok=true,msg=[],i,m=0;
  t.forEach(function(p){per[p.taken.team]=(per[p.taken.team]||0)+1;});
  if(t.length!==TOTAL){ok=false;msg.push('taken '+t.length);}
  for(i=1;i<=TEAMS;i++)if(per[i]!==ROUNDS){ok=false;msg.push('team '+i+' has '+per[i]);}
  if(S.mine.length!==ROUNDS){ok=false;msg.push('mine '+S.mine.length);}
  S.mine.forEach(function(x){m+=x.p.v;if(x.p.taken.team!==S.slot){ok=false;msg.push('wrong team');}});
  if(m!==S.tot.mine){ok=false;msg.push('sum');}
  var rs=0;S.room.rows.forEach(function(r){rs+=r.v;});
  if(rs!==t.reduce(function(a,p){return a+p.v;},0)){ok=false;msg.push('room sum');}
  if(S.room.rows.filter(function(r){return r.team===S.slot;})[0].v!==S.tot.mine){ok=false;msg.push('room mine');}
  if(t.some(function(p){return !(p.taken.g>=0&&p.taken.g<=100);})){ok=false;msg.push('grade range');}
  if(HASH==='autobest'&&S.room.rank!==1){ok=false;msg.push('best-available drafter not ranked 1st');}
  if(S.room.rank<1||S.room.rank>TEAMS||S.room.rows.length!==TEAMS){ok=false;msg.push('rank');}
  var nms=app.querySelectorAll('.nm'),cut=0,shr=0;for(var j=0;j<nms.length;j++){if(nms[j].scrollWidth>nms[j].clientWidth+1)cut++;if(nms[j].style.fontSize)shr++;}
  if(cut){ok=false;msg.push(cut+' names cut off');}msg.push(shr+' names shrunk');
  if(HASH==='autoplay'&&S.tot.mine!==S.tot.mkt){ok=false;msg.push('market strategy should tie');}
  if(HASH==='autobest'&&S.tot.mine!==S.tot.best){ok=false;msg.push('best strategy should equal best');}
  if(S.tot.best<S.tot.mine||S.tot.best<S.tot.mkt){ok=false;msg.push('best below');}
  var el=document.createElement('pre');el.id='selfcheck';
  el.textContent='SELFCHECK '+(ok?'PASS ('+msg.join('; ')+')':'FAIL '+msg.join('; '))+' | room '+S.room.rank+' | year '+S.year+' slot '+S.slot+' mine '+S.tot.mine+' mkt '+S.tot.mkt+' best '+S.tot.best+' | '+S.mine.map(function(x){return pickLabel(x.k)+' '+x.p.n;}).join(', ');
  document.body.appendChild(el);
}

/* ---------- events ---------- */
app.addEventListener('click',function(e){
  var t=e.target&&e.target.closest?e.target.closest('[data-act]'):null;if(!t)return;
  var a=t.getAttribute('data-act');
  if(a==='slot'){slotChoice=parseInt(t.getAttribute('data-v'),10)||0;document.getElementById('slots').innerHTML=slotChips();}
  else if(a==='go'||a==='again'){startDraft();window.scrollTo(0,0);}
  else if(a==='pos'){S.pos=t.getAttribute('data-v');var c=document.querySelectorAll('#posf .chip');for(var i=0;i<c.length;i++)c[i].classList.toggle('on',c[i].getAttribute('data-v')===S.pos);updateBoard();}
  else if(a==='draft'){userPick(S.players[parseInt(t.getAttribute('data-i'),10)]);}
  else if(a==='reveal'){renderReveal(false);}
  else if(a==='copy'){copyResult(t);}
  else if(a==='view'){setView(t.getAttribute('data-v'));}
});
app.addEventListener('change',function(e){if(e.target&&e.target.id==='sort'&&S){S.sort=e.target.value;updateBoard();}});

if(QUICK)startDraft();else renderStart();
})();
</script>
<script data-goatcounter="https://handhanley.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
