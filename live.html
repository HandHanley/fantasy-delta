  while(lum < 0.22 && guard++ < 12){
    r = Math.min(255, Math.round(r * 1.25 + 12));
    g = Math.min(255, Math.round(g * 1.25 + 12));
    b = Math.min(255, Math.round(b * 1.25 + 12));
    lum = (0.2126*r + 0.7152*g + 0.0722*b) / 255;
  }
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

async function getJSON(url, cache){
  const res = await fetch(url, { cache: cache || 'no-store' });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function watched(name){ return S.watch.size > 0 && S.watch.has(normName(name)); }

function wkKey(w){ return w ? w.st + '-' + w.wk : ''; }
function viewWeek(){ return S.wk[S.league] || S.cur[S.league]; }

/* Team names are compared on letters and digits only. "Hawai'i" and the
   ʻokina spelling both become "hawaii"; "Texas A&M" matches itself either way. */
function normTeam(s){
  return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/&/g, ' and ').replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
}
/* Every name a team goes by in the feed, plus its full name with the nickname
   taken off — "Florida International Panthers" becomes "florida international",
   which is how DELTA's college file spells a school whose short name is "FIU". */
function teamKeys(t){
  const keys = [t.loc, t.short, t.abbr, t.full].map(normTeam);
  const f = normTeam(t.full), n = normTeam(t.nick);
  if(f && n && f.length > n.length && f.slice(-n.length) === n) keys.push(f.slice(0, f.length - n.length).trim());
  return keys.filter(Boolean);
}
function gameHasSchool(g, school){
  const s = normTeam(school);
  return !!s && g.teams.some(function(t){ return teamKeys(t).indexOf(s) >= 0; });
}
function gameMatches(g, q){
  return g.teams.some(function(t){
    return teamKeys(t).concat([normTeam(t.nick)]).some(function(k){ return k.indexOf(q) >= 0; });
  });
}
function searchQ(){ const q = normTeam(S.q); return q.length >= 2 ? q : ''; }

function watchSchools(){
  if(S.league !== 'cfb' || !S.watch.size || !S.school) return [];
  const out = [];
  S.watch.forEach(function(n){
    (S.school[n] || []).forEach(function(tm){ if(out.indexOf(tm) < 0) out.push(tm); });
  });
  return out;
}
/* Games with a watchlisted player's school in them that the Top 25 list does
   not already show. */
function extraGames(){
  const d = S.data.cfb, f = S.full.cfb;
  if(S.league !== 'cfb' || !d || !f) return [];
  const schools = watchSchools();
  if(!schools.length) return [];
  const have = {};
  d.games.forEach(function(g){ have[g.id] = 1; });
  return f.games.filter(function(g){
    return !have[g.id] && schools.some(function(s){ return gameHasSchool(g, s); });
  });
}
/* Does anything on screen need the all-games list? */
function needFull(){
  if(S.league !== 'cfb' || !S.data.cfb) return false;
  if(searchQ()) return true;
  const shown = S.data.cfb.games;
  return watchSchools().some(function(s){
    return !shown.some(function(g){ return gameHasSchool(g, s); });
  });
}
/* nflverse writes LA and WAS where ESPN writes LAR and WSH. Two names for the
   same team is all this is. */
const NFL_ALIAS = { LA:'LAR', WAS:'WSH', JAC:'JAX' };
function teamCode(x){ const c = String(x || '').toUpperCase(); return NFL_ALIAS[c] || c; }
function fmtN(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

/* A season so far, in the order a football person reads it. Empty categories are
   left out: a running back's passing line is noise. */
function seasonLine(s){
  if(!s) return '';
  const bits = [];
  if(s.py) bits.push(fmtN(s.py) + ' pass yds' + (s.pt ? ', ' + s.pt + ' TD' : '')
                     + (s.pi ? ', ' + s.pi + ' INT' : ''));
  if(s.ry || s.car) bits.push(fmtN(s.ry || 0) + ' rush yds' + (s.rt ? ', ' + s.rt + ' TD' : ''));
  if(s.rec || s.rey) bits.push((s.rec || 0) + ' rec, ' + fmtN(s.rey || 0) + ' yds'
                     + (s.ret ? ', ' + s.ret + ' TD' : ''));
  const games = s.gms ? s.gms + (s.gms === 1 ? ' game' : ' games') : '';
  if(!bits.length) return games ? games + ' \u00b7 no production yet' : '';
  return (games ? games + ' \u00b7 ' : '') + bits.join(' \u00b7 ');
}

async function loadDepth(){
  S.depthState = 'loading';
  try{
    const d = await getJSON('data/depth-charts.json', 'no-cache');
    const m = {};
    for(const k in (d && d.players) || {}){
      const p = d.players[k];
      if(p && p.team) m[normName(p.name || k)] = { name: p.name || k, team: p.team, slot: p.slot || '' };
    }
    S.depth = m; S.depthState = 'ready';
  }catch(e){ S.depthState = 'failed'; S.fc.depthFile = 'failed'; }
}

/* Per-game lines for every season DELTA keeps. Only this season's PLAYED games
   count: rows marked upcoming or missed carry no stats by design. */
async function loadLogs(){
  S.logsState = 'loading';
  try{
    const d = await getJSON('data/game-logs.json', 'no-cache');
    const season = Math.max.apply(null, (d && d.seasons) || [0]);
    const m = {};
    for(const k in (d && d.games) || {}){
      const tot = { gms:0, py:0, pt:0, pi:0, car:0, ry:0, rt:0, rec:0, rey:0, ret:0, tm:'' };
      for(const r of d.games[k]){
        if(!r || r.s !== season || r.up || r.dnp) continue;
        tot.gms++; tot.tm = r.tm || tot.tm;
        for(const f of ['py','pt','pi','car','ry','rt','rec','rey','ret']) tot[f] += Number(r[f]) || 0;
      }
      if(tot.gms) m[normName(k)] = tot;
    }
    S.logs = m; S.logsState = 'ready'; S.fc.logsSeason = season;
  }catch(e){ S.logsState = 'failed'; S.fc.logsFile = 'failed'; }
}

/* Who on the watchlist is playing in THIS game, and what they have done so far.
   NFL: the depth chart says which team a player is on, DELTA's logs say what he
   has done. College: both come from the college file the watchlist already uses. */
function watchInGame(g){
  const out = [];
  if(!S.watch.size) return out;
  if(S.league === 'nfl'){
    if(!S.depth) return out;
    const codes = g.teams.map(function(t){ return teamCode(t.abbr); });
    S.watch.forEach(function(n){
      const d = S.depth[n];
      if(!d) return;
      const code = teamCode(d.team);
      if(codes.indexOf(code) < 0) return;
      out.push({ name: d.name, team: code, pos: d.slot, stats: S.logs ? S.logs[n] : null });
    });
  }else{
    if(!S.college) return out;
    S.watch.forEach(function(n){
      (S.college[n] || []).forEach(function(p){
        const t = g.teams.filter(function(x){ return gameHasSchool({ teams:[x] }, p.tm); })[0];
        if(!t) return;
        out.push({ name: p.name, team: t.abbr, pos: p.pos, stats: p.stats });
      });
    });
  }
  // The away team first, to match the order everything else on the page uses.
  const order = g.teams.map(function(t){ return S.league === 'nfl' ? teamCode(t.abbr) : t.abbr; });
  out.sort(function(a, b){ return order.indexOf(a.team) - order.indexOf(b.team); });
  return out;
}

/* Fetched only when a pre-kickoff game is open and the watchlist is not empty,
   and the heavy file only when someone on it is actually in this game. Both are
   kept for the rest of the visit. */
async function ensurePreData(){
  const g = findGame();
  if(!g || g.state !== 'pre' || !S.watch.size) return;
  if(S.league === 'nfl'){
    if(S.depthState === 'idle') await loadDepth();
    if(S.depth && watchInGame(g).length && S.logsState === 'idle') await loadLogs();
  }else if(S.schoolState === 'idle'){
    await loadSchools();
  }
  if(S.gameId === g.id) render();
}

function anyLive(games){ return (games || []).some(function(g){ return g.state === 'in'; }); }
function gameIsFeatured(id){
  const d = S.data[S.league];
  return !!(d && d.games.some(function(g){ return g.id === id; }));
}

/* ── rendering ─────────────────────────────────────────────────────────── */
function teamRow(t, lead, big){
  return '<div class="tm"><div class="tm-l">'
    + '<span class="spine" style="background:' + teamColor(t) + '"></span>'
    + '<span class="abbr">' + esc(t.abbr) + '</span>'
    + (t.nick ? '<span class="nick">' + esc(t.nick) + '</span>' : '')
    + (t.record ? '<span class="rec">' + esc(t.record) + '</span>' : '')
    + (t.hasBall ? '<span class="dot">&#9679;</span>' : '')
    + '</div><span class="sc' + (lead ? ' lead' : '') + '">'
    + (big == null ? '&ndash;' : esc(big)) + '</span></div>';
}
function colourBar(teams){
  return '<div class="bar">' + teams.map(function(t){
    return '<span style="background:' + teamColor(t) + '"></span>';
  }).join('') + '</div>';
}
function leadIndex(teams){
  const n = teams.map(function(t){ return t.score == null ? -1 : Number(t.score); });
  if(n.length < 2 || n[0] === n[1]) return -1;
  return n[0] > n[1] ? 0 : 1;
}
/* KICKOFF IN THE READER'S OWN TIME ZONE. ESPN writes its time text in Eastern
   ("9/26 - 12:00 PM EDT") for everyone. The feed also carries the exact
   kickoff instant, so the device's own clock setting decides what is shown:
   Arizona sees MST, London sees BST, and nobody has to set anything. Only an
   upcoming game shows a kickoff; live and finished games keep ESPN's text,
   which is a game clock or "Final". A time ESPN has not fixed yet keeps ESPN's
   own words rather than inventing one. */
const KICK_DAY  = new Intl.DateTimeFormat(undefined, { month:'numeric', day:'numeric' });
const KICK_TIME = new Intl.DateTimeFormat(undefined, { hour:'numeric', minute:'2-digit', timeZoneName:'short' });
function whenText(g){
  if(!g || g.state !== 'pre' || !g.timeKnown || !g.start) return g ? g.status : '';
  const d = new Date(g.start);
  return KICK_DAY.format(d) + ' - ' + KICK_TIME.format(d);
}
function chip(live){
  return live ? '<span class="chip">LIVE</span>' : '<span class="chip done">FINAL</span>';
}

function gameCard(g){
  if(g.state === 'pre'){
    return '<button class="g" type="button" data-id="' + esc(g.id) + '">' + colourBar(g.teams)
      + '<div class="pre"><div style="display:flex;align-items:center;gap:10px">'
      + '<span class="spine" style="height:34px;background:' + teamColor(g.teams[0] || {}) + '"></span><div>'
      + g.teams.map(function(t){ return '<div class="pre-t">' + esc(t.abbr) + '</div>'; }).join('')
      + '</div></div><span class="rec">' + esc(whenText(g)) + '</span></div></button>';
  }
  const live = g.state === 'in', li = leadIndex(g.teams);
  return '<button class="g" type="button" data-id="' + esc(g.id) + '">' + colourBar(g.teams)
    + '<div class="gin"><div class="chiprow">' + chip(live)
    + '<span class="when' + (live ? '' : ' off') + '">' + esc(whenText(g)) + '</span></div>'
    + g.teams.map(function(t, i){ return teamRow(t, i === li, t.score); }).join('')
    + (g.detail ? '<div class="gfoot">' + esc(g.detail) + '</div>' : '')
    + '</div></button>';
}

function renderList(){
  const d = S.data[S.league];
  // A real link, so opening in a new tab and long-press both behave. "./" lands
  // back on whichever section of the app was last open.
  document.getElementById('head').innerHTML =
    '<a class="back" href="./" aria-label="Back To DELTA">&#8592;</a><h1>Live</h1>';
  document.getElementById('tabs').innerHTML =
      '<div class="tabs"><button class="tab" type="button" data-lg="nfl" aria-selected="'
    + (S.league === 'nfl') + '">NFL</button>'
    + '<button class="tab" type="button" data-lg="cfb" aria-selected="'
    + (S.league === 'cfb') + '">College</button></div>';
  const view = document.getElementById('view');
  if(!d){
    paint('<div class="empty">' + (S.failed ? 'Nothing to show yet.' : 'Loading\u2026') + '</div>');
    return;
  }
  if(d.wrongWeek){
    paint('<div class="empty">ESPN did not send that week. Try another.</div>');
    return;
  }

  /* SEARCH. Any top-division game that week, not only the ones on the list.
     Until the all-games list arrives, the Top 25 games that match show at once
     so the screen is never blank while it loads. */
  const q = S.league === 'cfb' ? searchQ() : '';
  if(q){
    const pool = S.full.cfb ? S.full.cfb.games : d.games;
    const hits = pool.filter(function(g){ return gameMatches(g, q); });
    const note = S.full.cfb ? ''
      : '<div class="fine" style="margin:0 2px 10px">'
        + (S.fullState === 'failed' ? 'Could not load every game just now, so only the listed games are searched.'
                                    : 'Searching every game&hellip;') + '</div>';
    paint(note + (hits.length
      ? '<div class="hd"><span>Matches &middot; ' + hits.length + '</span><span class="rule"></span></div>'
        + hits.map(gameCard).join('')
      : (S.full.cfb || S.fullState === 'failed'
          ? '<div class="empty">No game this week for \u201c' + esc(S.q.trim()) + '\u201d.</div>' : '')));
    return;
  }

  /* Watchlisted players at schools the Top 25 list leaves out — the reason
     this page reads the all-games list at all. They go first: they are the
     games this reader has told DELTA they care about. */
  const extra = extraGames();
  const extraHtml = extra.length
    ? '<div class="hd"><span>Your Watchlist Games &middot; ' + extra.length
      + '</span><span class="rule"></span></div>' + extra.map(gameCard).join('')
    : '';
  const groups = [['In Progress','in'],['Upcoming','pre'],['Final','post']]
    .map(function(x){ return [x[0], d.games.filter(function(g){ return g.state === x[1]; })]; })
    .filter(function(x){ return x[1].length; });
  paint(extraHtml + (groups.length
    ? groups.map(function(x){
        return '<div class="hd"><span>' + esc(x[0]) + ' &middot; ' + x[1].length
          + '</span><span class="rule"></span></div>' + x[1].map(gameCard).join('');
      }).join('')
    : (extraHtml ? '' : '<div class="empty">No games in this feed right now.</div>')));
}

/* Painted only when its markup changes, and centred only then, so the minute
   refresh never resets a strip the reader has scrolled. */
function renderWeeks(){
  const el = document.getElementById('weeks');
  const cal = S.cal[S.league];
  const sel = wkKey(viewWeek()), cur = wkKey(S.cur[S.league]);
  const html = (S.view === 'list' && cal && cal.length)
    ? '<div class="wks" id="wks">' + cal.map(function(e){
        const k = wkKey(e);
        return '<button class="wk" type="button" data-wk="' + esc(k) + '" aria-pressed="' + (k === sel) + '"'
          + (k === cur ? ' aria-current="date"' : '') + '>' + esc(e.label) + '</button>';
      }).join('') + '</div>'
    : '';
  if(html === S.weeksPainted) return;
  S.weeksPainted = html;
  el.innerHTML = html;
  const strip = document.getElementById('wks');
  const on = strip && strip.querySelector('[aria-pressed="true"]');
  if(strip && on) strip.scrollLeft = Math.max(0, on.offsetLeft - (strip.clientWidth - on.offsetWidth) / 2);
}

/* College only: the NFL never has more than sixteen games, so it lists them all.
   Built once and then left alone — rebuilding it would drop the keyboard. */
function renderSearch(){
  const el = document.getElementById('search');
  if(!(S.view === 'list' && S.league === 'cfb')){ if(el.innerHTML) el.innerHTML = ''; return; }
  if(document.getElementById('srch')) return;
  el.innerHTML = '<input class="srch" id="srch" type="search" inputmode="search" enterkeyhint="search"'
    + ' autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"'
    + ' placeholder="Find Any Team" aria-label="Find any team\u2019s game this week">';
  document.getElementById('srch').value = S.q;
}

function teamByAbbr(g, abbr){
  if(!g) return null;
  return g.teams.filter(function(t){ return t.abbr === abbr; })[0] || null;
}
function findGame(){
  const d = S.data[S.league];
  const hit = d ? d.games.filter(function(g){ return g.id === S.gameId; })[0] : null;
  if(hit) return hit;
  if(S.solo && S.solo.id === S.gameId) return S.solo;
  const f = S.full[S.league];
  return (f && f.games.filter(function(g){ return g.id === S.gameId; })[0]) || null;
}

/* WHERE THE BALL IS.

   Position comes from the down-and-distance text ("1st & 10 at LOU 32") rather
   than from situation.yardLine, whose zero point ESPN does not document. The
   text names the team whose half the ball is on, and that team is one of the
   two already being drawn, so the geometry is self-consistent with no guess
   about the feed's conventions. yardLine is kept only as a fallback.

   DIRECTION IS TAKEN FROM THE DRAWN ORDER, NOT FROM HOME/AWAY. That was the
   bug: the bar draws teams in the order the feed sends them, while the
   direction was computed from which side was home. When the feed leads with the
   home team those two disagree, and the line to gain lands behind the ball
   instead of ahead of it. Whoever has the ball attacks the OTHER team's
   endzone, and "the other team" is simply the other end of this bar. */
const EZ = 8;                     // endzone width, percent of the bar
const FIELD = 100 - (EZ * 2);     // playing surface between them
const yd = function(n){ return EZ + (n / 100) * FIELD; };

function fieldPos(g){
  const s = g.situation || {};
  const teams = g.teams || [];
  const possIdx = teams.findIndex(function(t){ return t.hasBall; });
  if(possIdx < 0) return null;

  // "… at LOU 32" · "… at 50" · "4th & Goal at LOU 3"
  let ball = null;
  const m = String(g.detail || '').match(/at\s+([A-Za-z]{2,5})?\s*(\d{1,2})\s*$/);
  if(m){
    const n = parseInt(m[2], 10);
    if(m[1]){
      const ab = m[1].toUpperCase();
      const side = teams.findIndex(function(t){ return String(t.abbr).toUpperCase() === ab; });
      if(side === 0) ball = n;             // n yards from the LEFT goal line
      else if(side === 1) ball = 100 - n;  // n yards from the RIGHT goal line
    }else if(n === 50){ ball = 50; }
  }
  if(ball == null && typeof s.yardLine === 'number') ball = s.yardLine;
  if(ball == null) return null;

  // Left team attacks right; right team attacks left.
  const dir = possIdx === 0 ? 1 : -1;

  let dist = (typeof s.distance === 'number') ? s.distance : null;
  if(dist == null){
    const d = String(g.detail || '').match(/&\s*(\d{1,2})\b/);
    if(d) dist = parseInt(d[1], 10);
  }
  if(/&\s*goal/i.test(String(g.detail || ''))) dist = dir === 1 ? (100 - ball) : ball;

  let togo = null;
  if(dist != null){
    const t = ball + dir * dist;
    if(t >= 0 && t <= 100) togo = t;
  }
  return { ball: ball, togo: togo, dir: dir, poss: teams[possIdx] };
}

function fieldBar(g){
  const f = fieldPos(g);
  if(!f) return '';
  const a = yd(f.ball);
  const t = f.togo == null ? null : yd(f.togo);
  const lo = t == null ? null : Math.min(a, t);
  const w  = t == null ? null : Math.abs(t - a);
  const possCol = teamColor(f.poss || {});

  let ticks = '';
  for(let i = 1; i < 10; i++)
    ticks += '<span class="tick' + (i === 5 ? ' mid' : '') + '" style="left:' + yd(i * 10) + '%"></span>';

  return '<div class="hd"><span>Where The Ball Is</span><span class="rule"></span></div>'
    + '<div class="card" style="padding:12px 12px 10px">'
    + '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px">'
    + '<span style="font-weight:700;font-size:14px">' + esc(g.detail || '') + '</span>'
    + '<span class="rec">' + esc((f.poss || {}).abbr || '') + ' ball</span></div>'
    + '<div class="field">'
    + '<span class="ez" style="left:0;width:' + EZ + '%;background:' + teamColor(g.teams[0] || {}) + '"></span>'
    + '<span class="ez" style="right:0;width:' + EZ + '%;background:' + teamColor(g.teams[1] || {}) + '"></span>'
    + ticks
    + (w != null ? '<span class="gain" style="left:' + lo + '%;width:' + w + '%"></span>' : '')
    + (t != null ? '<span class="togo" style="left:' + t + '%"></span>' : '')
    + '<span class="ball" style="left:' + a + '%;background:' + possCol + '"></span>'
    + '</div>'
    + '<div class="fkey"><span>' + esc((g.teams[0] || {}).abbr || '') + '</span>'
    + '<span>' + esc((g.teams[1] || {}).abbr || '') + '</span></div></div>';
}

function titleFor(name){
  const n = String(name || '').toLowerCase();
  if(n.indexOf('pass') === 0) return 'Passing';
  if(n.indexOf('rush') === 0) return 'Rushing';
  if(n.indexOf('rec') === 0)  return 'Receiving';
  if(n.indexOf('kicking') === 0) return 'Kicking';
  return name || 'Other';
}

/* Every stat carries the same weight. An earlier version made the yardage
   louder than the rest; it drew the eye oddly and read as though the other
   numbers were afterthoughts. */
function statLine(parts){
  if(!parts || !parts.length) return '';
  return '<div class="statline">' + parts.map(function(x){ return esc(x.t); })
    .join(' <span style="color:var(--fog-2)">&middot;</span> ') + '</div>';
}
function nameButton(name, trail){
  return '<button class="pname" type="button" data-player="' + esc(name) + '">'
    + esc(name) + '</button>' + (trail || '');
}
function cell(v){
  if(v == null || v === '') return '<span class="z">&ndash;</span>';
  const t = String(v);
  return (t === '0' || t === '0.0' || t === '0/0')
    ? '<span class="z">' + esc(t) + '</span>' : esc(t);
}
function playerTable(sec){
  const cols = sec.cols || [];
  return '<table class="bx"><colgroup><col>'
    + cols.map(function(){ return '<col class="n">'; }).join('') + '</colgroup>'
    + '<thead><tr><th class="p"></th>'
    + cols.map(function(c){ return '<th>' + esc(c) + '</th>'; }).join('')
    + '</tr></thead><tbody>'
    + sec.players.map(function(p){
        return '<tr><td class="p">'
          + (watched(p.name) ? '<span class="trk">&#9733;</span> ' : '')
          + nameButton(p.name) + '</td>'
          + cols.map(function(c){ return '<td>' + cell(p.cells && p.cells[c]) + '</td>'; }).join('')
          + '</tr>';
      }).join('')
    + '</tbody></table>';
}

function heroBlock(g){
  const live = g.state === 'in', li = leadIndex(g.teams);
  return '<div class="hero">' + colourBar(g.teams) + '<div class="hero-in"><div class="chiprow">'
    + (g.state === 'pre' ? '' : chip(live))
    + '<span class="when' + (live ? '' : ' off') + '">' + esc(whenText(g)) + '</span></div>'
    + g.teams.map(function(t, i){ return teamRow(t, i === li, t.score); }).join('')
    + '</div></div>';
}

function renderGame(){
  const g = findGame();
  document.getElementById('head').innerHTML =
    '<button class="back" type="button" id="back" aria-label="Back To Game List">&#8592;</button><h1>'
    + esc(g ? g.teams.map(function(t){ return t.abbr; }).join(' at ') : 'Game') + '</h1>';
  document.getElementById('tabs').innerHTML = gameTabs(g, 'game');
  const view = document.getElementById('view');
  if(!g){ paint('<div class="empty">That game is no longer in the feed.</div>'); return; }

  const sum = S.game;
  let html = heroBlock(g) + fieldBar(g);

  // A finished game's "last play" is a kneel-down. Only show it while it moves.
  if(sum && sum.lastPlay && g.state === 'in'){
    const older = (sum.plays || []).slice(1);
    html += '<div class="hd"><span>Last Play</span><span class="rule"></span></div>'
      + '<div class="card" style="padding:11px 13px">'
      + (sum.lastPlay.at ? '<div class="sub" style="margin:0 0 5px">' + esc(sum.lastPlay.at) + '</div>' : '')
      + '<div class="play">' + esc(sum.lastPlay.text) + '</div>'
      + (older.length
          ? '<div class="prev"><button class="prevb" type="button" data-plays="1"'
            + ' aria-expanded="' + S.playsOpen + '">'
            + (S.playsOpen ? '&#9652; Hide' : '&#9662; ' + older.length + ' before that')
            + '</button>'
            + (S.playsOpen
                ? older.map(function(p){
                    return '<div class="pv">'
                      + (p.at ? '<div class="sub" style="margin:0 0 3px">' + esc(p.at) + '</div>' : '')
                      + '<div class="play">' + esc(p.text) + '</div></div>';
                  }).join('')
                : '')
            + '</div>'
          : '')
      + '</div>';
  }

  if(g.state === 'pre'){
    // Decided by the game's own state, not by whether the summary happens to be
    // carrying stats: a game that has not kicked off shows the pre-kickoff screen.
    html += preview(g);
  }else if(sum && sum.sections.length){
    // Everyone the user actually stars, with no cap — the list is theirs, so
    // every row on it is relevant by definition.
    html += scoringBlock(g, sum);
    html += watchlistBlock(sum);
  }else{
    html += '<div class="notice" style="margin-top:16px">' + esc(noDetailYet(g)) + '</div>';
  }
  paint(html);
}

/* Live and Box Score as tabs, so switching is one tap either way instead of a
   button at the bottom and a back arrow at the top. Only for a game that has
   something live to show — a finished one has a box score and nothing else. */
function gameTabs(g, which){
  if(!g || g.state === 'pre') return '';
  // A finished game has nothing live, but its play log is still worth reading.
  const list = g.state === 'post' ? [['box','Box Score'],['plays','Plays']]
                                  : [['game','Live'],['box','Box Score'],['plays','Plays']];
  return '<div class="tabs">' + list.map(function(x){
    return '<button class="tab" type="button" data-gv="' + x[0] + '" aria-selected="'
      + (which === x[0]) + '">' + x[1] + '</button>';
  }).join('') + '</div>';
}

/* THE WHOLE GAME, PLAY BY PLAY, one quarter at a time.

   Pills across the top pick the quarter, so the first carry of the game is one
   tap away instead of at the bottom of a hundred-and-fifty-play scroll.

   ORDER DEPENDS ON WHETHER THE QUARTER IS OVER. A finished quarter reads start
   to finish, the way it happened — tap Q1 and the opening kickoff is on top.
   The quarter being played right now reads newest first, because while a game
   is on, the play that just happened is the one you want. Without that split,
   pills would only have moved the scrolling somewhere else.

   With no quarter chosen the tab follows the latest one, so a live game rolls
   into the next quarter on its own. Tap a pill and it stays put until you
   leave the game. */
function periodLabel(n){ return n <= 4 ? 'Q' + n : (n === 5 ? 'OT' : (n - 4) + 'OT'); }

function renderPlays(){
  const g = findGame(), sum = S.game;
  document.getElementById('head').innerHTML =
    '<button class="back" type="button" id="back" aria-label="Back To Game List">&#8592;</button><h1>'
    + esc(g ? g.teams.map(function(t){ return t.abbr; }).join(' at ') : 'Plays') + '</h1>';
  document.getElementById('tabs').innerHTML = gameTabs(g, 'plays');
  if(!g){ paint('<div class="empty">That game is no longer in the feed.</div>'); return; }
  const drives = (sum && sum.drives) || [];
  if(!drives.length){ paint('<div class="notice">' + esc(noDetailYet(g)) + '</div>'); return; }

  const has = {};
  drives.forEach(function(d){ d.plays.forEach(function(p){ if(p.period) has[p.period] = 1; }); });
  const periods = Object.keys(has).map(Number).sort(function(a, b){ return a - b; });
  const latest = periods.length ? periods[periods.length - 1] : null;
  // Unpicked, a live game follows the quarter being played; a finished game is
  // history, read from the start, so it opens on the first quarter.
  const fallback = g.state === 'in' ? latest : (periods.length ? periods[0] : null);
  const sel = (S.playsQ != null && has[S.playsQ]) ? S.playsQ : fallback;
  const nowPlaying = g.state === 'in' && sel === latest;
  const onField = g.state === 'in' ? drives[drives.length - 1] : null;

  const pills = periods.length
    ? '<div class="qpills">' + periods.map(function(n){
        return '<button class="qp" type="button" data-q="' + n + '" aria-pressed="'
          + (n === sel) + '">' + periodLabel(n) + '</button>';
      }).join('') + '</div>'
    : '';

  let rows = drives.map(function(d){
    return { d: d, plays: sel == null ? d.plays
                         : d.plays.filter(function(p){ return p.period === sel; }) };
  }).filter(function(x){ return x.plays.length; });
  if(nowPlaying){
    rows = rows.reverse();
    rows.forEach(function(x){ x.plays = x.plays.slice().reverse(); });
  }

  paint(heroBlock(g) + pills + rows.map(function(x){
    const d = x.d;
    const t = g.teams.filter(function(v){ return String(v.abbr) === String(d.team); })[0];
    const current = d === onField;
    return '<div class="hd"><span style="display:flex;align-items:center;gap:7px">'
      + (t ? '<span class="swatch" style="background:' + teamColor(t) + '"></span>' : '')
      + esc(d.team || 'Drive')
      + (current ? ' &middot; On The Field' : (d.result ? ' &middot; ' + esc(d.result) : ''))
      + '</span><span class="rule"></span></div>'
      + (d.desc ? '<div class="fine" style="margin:-4px 2px 8px">' + esc(d.desc) + '</div>' : '')
      + '<div class="card">' + x.plays.map(function(p){
          return '<div class="rowb">'
            + (p.at ? '<div class="sub" style="margin:0 0 3px">' + esc(p.at) + '</div>' : '')
            + '<div class="play' + (p.scoring ? ' scored' : '') + '">' + esc(p.text) + '</div></div>';
        }).join('') + '</div>';
  }).join(''));
}

/* The scoring summary. Shown on whichever screen you actually land on: the
   follow screen for a live game, and the box score for a finished one, since a
   finished game now skips the follow screen entirely. Same rule as the
   watchlist block — the box score carries what you would have seen on the
   screen you skipped. */
function scoringBlock(g, sum){
  const rows = (sum && sum.scoring) || [];
  if(!rows.length) return '';
  const teams = g.teams || [];
  const byHA = function(ha){
    const t = teams.filter(function(x){ return x.homeAway === ha; })[0];
    return t ? t.abbr : '';
  };
  // Whoever is ahead after each score reads bright, so a lead changing hands is
  // visible by scanning rather than by doing arithmetic. A tie leaves both muted.
  const lead = function(r){
    const a = Number(r.away), h = Number(r.home);
    if(!isFinite(a) || !isFinite(h) || a === h) return '';
    return a > h ? 'a' : 'h';
  };
  const awayAb = byHA('away') || (teams[0] || {}).abbr || '';
  const homeAb = byHA('home') || (teams[1] || {}).abbr || '';
  return '<div class="hd"><span>Scoring &middot; ' + rows.length
    + '</span><span class="rule"></span></div><div class="card">'
    + rows.map(function(r){
        const t = teams.filter(function(x){ return String(x.abbr) === String(r.team); })[0];
        const q = r.period ? 'Q' + r.period : '';
        return '<div class="rowb"><div style="display:flex;align-items:baseline;gap:8px">'
          + (t ? '<span class="spine" style="height:14px;background:' + teamColor(t) + '"></span>' : '')
          + '<span class="nm" style="font-size:12.5px">' + esc(r.team) + '</span>'
          + (r.kind ? '<span class="rec">' + esc(r.kind) + '</span>' : '')
          + '<span class="rec" style="margin-left:auto;white-space:nowrap">'
          + '<span class="' + (lead(r) === 'a' ? 'ahead' : '') + '">'
          + esc(awayAb) + ' ' + esc(r.away == null ? '' : r.away) + '</span>'
          + ' &middot; '
          + '<span class="' + (lead(r) === 'h' ? 'ahead' : '') + '">'
          + esc(homeAb) + ' ' + esc(r.home == null ? '' : r.home) + '</span>'
          + '</span></div>'
          + '<div class="play" style="margin-top:4px">' + esc(r.text) + '</div>'
          + ((q || r.at) ? '<div class="sub">' + esc((q + ' ' + r.at).trim()) + '</div>' : '')
          + '</div>';
      }).join('') + '</div>';
}

/* One row per PLAYER, not per stat category. A quarterback who ran, or a
   receiver who took a carry, was appearing twice — two half-pictures of the
   same person. Their lines stack inside a single row instead. */
function watchlistBlock(sum){
  const hits = [], seen = {};
  for(const sec of sum.sections){
    for(const p of sec.players){
      if(!watched(p.name)) continue;
      const k = normName(p.name);
      if(seen[k] == null){ seen[k] = hits.length; hits.push({ p: p, lines: [], parts: [] }); }
      hits[seen[k]].lines.push(p.line);
      hits[seen[k]].parts.push(p);
    }
  }
  // Nobody starred in this game means nothing at all — not a line explaining the
  // absence. It read as out of place on a scoreboard.
  if(!hits.length) return '';
  const fmt = pprValue();
  // Best day on top. Points, not yards, because points are the thing being
  // asked about on the screen where your own players are listed.
  hits.forEach(function(h){ h.fp = fantasyPoints(h.parts, fmt.per); });
  hits.sort(function(a, b){ return b.fp - a.fp; });
  const anyKicker = hits.some(function(h){
    return h.parts.some(function(x){ return x.unit === 'kick'; }); });

  return '<div class="hd"><span>Your Watchlist &middot; ' + hits.length
    + '</span><span class="rule"></span></div><div class="card">'
    + hits.map(function(h){
        const kickOnly = h.parts.every(function(x){ return x.unit === 'kick'; });
        return '<div class="rowb"><div style="display:flex;align-items:baseline;gap:10px">'
          + '<div class="nm" style="min-width:0"><span class="trk">&#9733;</span> '
          + nameButton(h.p.name, ' <span class="pos">' + esc(h.p.team) + '</span>')
          + '</div>'
          + (kickOnly ? ''
             : '<span class="fp">' + esc(h.fp.toFixed(1))
               + ' <span class="fpu">PTS</span></span>')
          + '</div>' + h.lines.map(statLine).join('') + '</div>';
      }).join('') + '</div>'
    + '<div class="fine">' + esc(fmt.label) + ' scoring, from your league settings.'
    + (anyKicker ? ' Kickers are not scored \u2014 the rules vary too much between leagues.' : '')
    + '</div>';
}

function kv(pair){
  return '<div class="kv"><span class="kvk">' + esc(pair[0]) + '</span>'
    + '<span class="kvv">' + esc(pair[1]) + '</span></div>';
}
/* How long until kickoff, in the words a person would use. Nothing beyond two
   days out — "in 61h" is not something anyone reads as a time. */
function countdown(g){
  if(!g.timeKnown || !g.start) return '';
  const ms = g.start - Date.now();
  if(ms <= 0) return 'starting shortly';
  if(ms > 48 * 3600000) return '';
  const mins = Math.round(ms / 60000), h = Math.floor(mins / 60);
  const m = mins - h * 60;
  return 'in ' + (h ? (m ? h + 'h ' + m + 'm' : h + 'h') : mins + 'm');
}

/* WHAT A GAME SHOWS BEFORE IT KICKS OFF. Everything here is already in the game
   list this page reads anyway, so the screen costs nothing extra to fill.
   Deliberately not here: the spread, the over/under and ESPN's win probability.
   DELTA does not carry a bet, and a win probability is a projection about a
   game nobody has played. */
function preview(g){
  const info = g.info || {};
  const rows = [['Kickoff', whenText(g) + (countdown(g) ? ' \u00b7 ' + countdown(g) : '')]];
  if(info.tv) rows.push(['TV', info.tv]);
  if(info.venue) rows.push(['Venue', info.venue + (info.city ? ' \u00b7 ' + info.city : '')
    + (info.indoor ? ' \u00b7 Indoor' : '') + (info.neutral ? ' \u00b7 Neutral Site' : '')]);
  if(info.weather) rows.push(['Weather', [info.weather.text,
    info.weather.temp == null ? '' : info.weather.temp + '\u00b0'].filter(Boolean).join(' \u00b7 ')]);
  if(info.note) rows.push(['Note', info.note]);
  let html = '<div class="hd"><span>Kickoff</span><span class="rule"></span></div>'
    + '<div class="card">' + rows.map(kv).join('') + '</div>';

  /* YOUR PLAYERS IN THIS GAME, and what they have done this season. Records came
     out of this spot: the hero above already carries them, and a road record in
     September says nothing. This says something only DELTA can say. */
  const mine = watchInGame(g);
  if(mine.length){
    const waiting = S.league === 'nfl' && S.logsState === 'loading';
    html += '<div class="hd"><span>Your Watchlist \u00b7 ' + mine.length
      + '</span><span class="rule"></span></div><div class="card">'
      + mine.map(function(m){
          const line = seasonLine(m.stats);
          return '<div class="rowb"><div class="nm"><span class="trk">&#9733;</span> '
            + nameButton(m.name, ' <span class="pos">' + esc(m.team)
                + (m.pos ? ' \u00b7 ' + esc(m.pos) : '') + '</span>')
            + '</div>'
            + (line ? '<div class="statline">' + esc(line) + '</div>'
                    : (waiting ? '<div class="statline">Season numbers loading\u2026</div>'
                               : '<div class="statline">No games played yet this season.</div>'))
            + '</div>';
        }).join('') + '</div>';
  }

  // Each side's leading passer, rusher and receiver this season. Tapping a name
  // opens DELTA's own card on him, same as everywhere else on this page.
  const lead = g.teams.filter(function(t){ return (t.leaders || []).length; });
  if(lead.length){
    html += '<div class="hd"><span>Season So Far</span><span class="rule"></span></div>'
      + lead.map(function(t){
          return '<div class="card tinted" style="border-top-color:' + teamColor(t) + '">'
            + t.leaders.map(function(L){
                return '<div class="rowb"><div class="nm">'
                  + nameButton(L.who, ' <span class="pos">' + esc(t.abbr)
                      + (L.pos ? ' \u00b7 ' + esc(L.pos) : '') + '</span>')
                  + '</div><div class="statline">' + esc(L.label) + ': ' + esc(L.line) + '</div></div>';
              }).join('') + '</div>';
        }).join('');
  }
  // A feed that sent none of it still gets the honest one-liner it had before.
  if(rows.length === 1 && !mine.length && !lead.length)
    html += '<div class="notice" style="margin-top:16px">' + esc(noDetailYet(g)) + '</div>';
  return html;
}

/* "Loading" is only true while it IS loading. A game that has not kicked off
   has no player stats to fetch, and saying loading forever reads as broken. */
function noDetailYet(g){
  if(!S.game) return 'Loading the detail for this game\u2026';
  if(g && g.state === 'pre') return 'This game has not kicked off yet.';
  return 'No player stats for this game yet.';
}

function renderBox(){
  const g = findGame(), sum = S.game;
  document.getElementById('head').innerHTML =
    '<button class="back" type="button" id="back" aria-label="Back To Game List">&#8592;</button><h1>'
    + esc(g ? g.teams.map(function(t){ return t.abbr; }).join(' at ') : 'Box Score') + '</h1>';
  document.getElementById('tabs').innerHTML = gameTabs(g, 'box');
  const view = document.getElementById('view');
  if(!g || !sum){ paint('<div class="empty">No box score available.</div>'); return; }

  const abbrs = [];
  for(const s of sum.sections) if(abbrs.indexOf(s.teamAbbr) < 0) abbrs.push(s.teamAbbr);
  if(!S.boxTeam || abbrs.indexOf(S.boxTeam) < 0) S.boxTeam = abbrs[0] || null;

  let html = heroBlock(g);
  // A finished game has no Live tab, so its box score carries what that tab
  // would have shown. Keyed on the game's state rather than on how you got
  // here, because a finished game now also has a Plays tab to wander through.
  if(g.state === 'post'){ html += scoringBlock(g, sum); html += watchlistBlock(sum); }
  if(abbrs.length > 1){
    html += '<div class="tabs" style="margin-top:12px">' + abbrs.map(function(a){
      const on = a === S.boxTeam, c = teamColor(teamByAbbr(g, a) || {});
      // Selected tab wears that team's own colour rather than the brand teal,
      // which is what stops the page reading as one grey block.
      return '<button class="tab" type="button" data-team="' + esc(a) + '" aria-selected="'
        + on + '"' + (on ? ' style="color:' + c + ';border-color:' + c + ';background:transparent"' : '')
        + '>' + esc(a) + '</button>';
    }).join('') + '</div>';
  }
  // Only the three that matter. ESPN also sends fumbles, defence, kicking and
  // returns; none of that is what this page is for.
  // 'kicking' spelled out, not 'kick': ESPN also sends kickReturns, which
  // starts with the same four letters and was being drawn as a second Kicking
  // section carrying nothing but a long return.
  const KEEP = ['pass', 'rush', 'rec', 'kicking'];
  const rank = function(sec){
    const n = String(sec.name || '').toLowerCase();
    for(let i = 0; i < KEEP.length; i++) if(n.indexOf(KEEP[i]) === 0) return i;
    return -1;
  };
  const tt = (sum.totals || {})[S.boxTeam];
  if(tt){
    const bits = [];
    if(tt.plays) bits.push(esc(tt.plays) + ' <span class="u">Plays</span>');
    if(tt.yards) bits.push(esc(tt.yards) + ' <span class="u">Yds</span>');
    if(tt.top)   bits.push(esc(tt.top)   + ' <span class="u">Possession</span>');
    if(bits.length)
      html += '<div class="tt">' + bits.join(' <span style="color:var(--fog-2)">&middot;</span> ') + '</div>';
  }

  const mine = sum.sections
    .filter(function(s){ return s.teamAbbr === S.boxTeam && rank(s) >= 0; })
    .sort(function(a, b){ return rank(a) - rank(b); });

  const col = teamColor(teamByAbbr(g, S.boxTeam) || {});
  html += mine.length
    ? mine.map(function(sec){
        return '<div class="hd"><span class="swatch" style="background:' + col + '"></span>'
          + '<span>' + esc(titleFor(sec.name)) + '</span><span class="rule"></span></div>'
          + '<div class="card tinted" style="border-top-color:' + col + '">'
          + playerTable(sec) + '</div>';
      }).join('')
    : '<div class="empty">No player stats for this team yet.</div>';
  html += '<div class="hd"><span><span class="trk">&#9733;</span> On Your Watchlist</span>'
    + '<span class="rule"></span></div>';
  paint(html);
}

/* Replacing innerHTML on an unchanged screen throws away whatever the reader
   was in the middle of — an open toggle, a scroll position, a half-pressed
   button — for no gain. Between plays the feed usually says the same thing, so
   most refreshes should paint nothing at all. */
function paint(html){
  if(html === S.painted) return;
  S.painted = html;
  document.getElementById('view').innerHTML = html;
}

function render(){
  // Cheap, and it means a star set in the main app shows up on the next redraw
  // without this page being reloaded.
  S.watch = readWatchlist(S.league);
  S.fc.watchlist = S.watch.size;

  if(S.league === 'cfb'){
    S.fc.watchSchools = watchSchools().length;
    // A school with no game in the all-games list is usually a bye week — or a
    // spelling the matcher does not know. This line is how to tell which.
    const f = S.full.cfb;
    if(f) S.fc.watchNoGame = watchSchools().filter(function(s){
      return !f.games.some(function(g){ return gameHasSchool(g, s); });
    }).join(', ') || 'none';
  }
  S.fc.week = wkKey(viewWeek()) + (S.wk[S.league] ? '' : ' (current)');
  renderWeeks();
  renderSearch();

  document.getElementById('notice').innerHTML = S.failed
    ? '<div class="notice">Could not reach the feed just now. Showing the last good read.</div>' : '';
  if(S.view === 'list') renderList();
  else if(S.view === 'game') renderGame();
  else if(S.view === 'plays') renderPlays();
  else renderBox();

  document.getElementById('stamp').textContent =
    ago(S.view === 'list' ? S.at[S.league] : (S.gameAt || S.at[S.league]));

  const f = {};
  const a = S.data[S.league] ? S.data[S.league].found : {};
  for(const k in a) f[k] = a[k];
  if(S.game) for(const k in S.game.found) f[k] = S.game.found[k];
  for(const k in S.fc) f[k] = S.fc[k];
  const fcw = document.getElementById('fcwrap');
  if(!DEBUG){ if(fcw) fcw.hidden = true; return; }
  if(fcw) fcw.hidden = false;
  const g = findGame();
  let txt = Object.keys(f).map(function(k){
    return (k + ':' + '                      ').slice(0, 22) + f[k];
  }).join('\n');
  if(g && g.situation){
    txt += '\n\nRAW yardLine: ' + g.situation.yardLine
      + '\nRAW distance: ' + g.situation.distance
      + '\nposs: ' + g.situation.possessionAbbr
      + '\n(does the bar match the real game? if not, the convention is flipped)';
  }
  txt += '\n\nA zero means this source did not send that field.';
  document.getElementById('fc').textContent = txt;
}

/* ── DELTA's player card, in a sheet ───────────────────────────────────── */
function openCard(name){
  closeCard();
  // Whichever card page belongs to the sport currently being watched. Both take
  // ?name= and both handle a name they do not know with their own clear
  // message, which is the honest answer: DELTA does not track that player.
  const page = S.league === 'cfb' ? 'cfb-player.html' : 'player.html';
  const el = document.createElement('div');
  el.className = 'sheet';
  el.id = 'sheet';
  el.innerHTML = '<div class="sheet-hd"><span class="sheet-nm">' + esc(name) + '</span>'
    + '<button class="sheet-x" type="button" id="sheet-x">Close</button></div>'
    + '<iframe title="DELTA player card" src="' + esc(page + '?name=' + encodeURIComponent(name)) + '"></iframe>';
  document.body.appendChild(el);
  document.body.style.overflow = 'hidden';
}
function closeCard(){
  const el = document.getElementById('sheet');
  if(el) el.remove();
  document.body.style.overflow = '';
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeCard();
});

/* ── loading ───────────────────────────────────────────────────────────── */
async function loadList(){
  const a = ADAPTERS[ACTIVE_SOURCE], which = S.league, w = S.wk[which], key = wkKey(w);
  const first = !S.data[which];
  try{
    const parsed = a.scoreboard(await getJSON(a.scoreboardUrl(which, { week: w })));
    // The reader picked another week while this was on its way. Drop it.
    if(wkKey(S.wk[which]) !== key) return;
    if(parsed.calendar.length) S.cal[which] = parsed.calendar;
    if(!w && parsed.week) S.cur[which] = parsed.week;
    // A week asked for by number has to BE that week. If the feed ignored the
    // request it sends the current one, and drawing that under the wrong pill
    // would be worse than saying so.
    if(w && parsed.week && wkKey(parsed.week) !== key){
      parsed.games = []; parsed.wrongWeek = true;
      S.fc.weekMismatch = 'asked ' + key + ', got ' + wkKey(parsed.week);
    }
    S.data[which] = parsed; S.at[which] = Date.now(); S.failed = false;
  }catch(e){ S.failed = true; }
  if(which !== S.league) return;
  render();
  if(which === 'cfb') await afterCollegeList();
  // A past week's first read decides whether it needs refreshing at all.
  if(first) schedule();
}

/* After the Top 25 list: fetch what the watchlist and search need, and only
   what they need. */
async function afterCollegeList(){
  if(S.watch.size && S.schoolState === 'idle') await loadSchools();
  if(S.league === 'cfb' && needFull() && !S.full.cfb && S.fullState !== 'loading') await loadFull();
}

async function loadSchools(){
  S.schoolState = 'loading';
  try{
    // DELTA's own file: revalidate rather than re-download, like the app does.
    const d = await getJSON('data/college-players.json', 'no-cache');
    const m = {}, rows = {};
    for(const p of ((d && d.players) || [])){
      if(!p || !p.n || !p.tm) continue;
      const k = normName(p.n);
      if(!m[k]) m[k] = [];
      if(m[k].indexOf(p.tm) < 0) m[k].push(p.tm);
      // The same shorthand the NFL logs use, so one reader draws both sports.
      if(!rows[k]) rows[k] = [];
      rows[k].push({ name: p.n, tm: p.tm, pos: p.pos || '',
                     stats: { gms: p.gms || 0, py: p.py || 0, pt: p.pt || 0, pi: p.pi || 0,
                              car: p.car || 0, ry: p.ry || 0, rt: p.rt || 0,
                              rec: p.rec || 0, rey: p.rey || 0, ret: p.ret || 0 } });
    }
    S.school = m; S.college = rows; S.schoolState = 'ready';
  }catch(e){ S.schoolState = 'failed'; S.fc.schoolFile = 'failed'; }
}

async function loadFull(){
  const a = ADAPTERS[ACTIVE_SOURCE], lg = 'cfb', w = S.wk[lg], key = wkKey(w);
  if(S.league !== lg) return;
  const first = !S.full[lg];
  S.fullState = 'loading';
  try{
    const parsed = a.scoreboard(await getJSON(a.scoreboardUrl(lg, { all: true, week: w })));
    if(S.league !== lg || wkKey(S.wk[lg]) !== key) return;
    const want = w || S.cur[lg];
    if(want && parsed.week && wkKey(parsed.week) !== wkKey(want)){
      S.full[lg] = null; S.fullState = 'failed';
      S.fc.fullWeekMismatch = 'asked ' + wkKey(want) + ', got ' + wkKey(parsed.week);
    }else{
      S.full[lg] = parsed; S.fullState = 'ok'; S.fc.fullGames = parsed.games.length;
    }
  }catch(e){ S.fullState = 'failed'; }
  if(S.league !== lg) return;
  render();
  if(first) schedule();
}

async function loadGame(){
  const a = ADAPTERS[ACTIVE_SOURCE], id = S.gameId, which = S.league;
  if(!id) return;
  try{
    const raw = await getJSON(a.summaryUrl(which, id));
    const parsed = a.summary(raw);
    if(S.gameId === id){
      S.game = parsed; S.gameAt = Date.now(); S.failed = false;
      // A game the Top 25 list does not carry takes its score from here.
      if(!gameIsFeatured(id)){
        const g = a.summaryGame ? a.summaryGame(raw) : null;
        if(g && !g.id) g.id = id;
        const was = S.soloOk;
        S.solo = (g && g.id === id) ? g : null;
        S.soloOk = !!S.solo;
        S.fc.scoreFrom = S.soloOk ? 'play feed' : 'all-games list';
        if(was !== S.soloOk) schedule();
      }
    }
  }catch(e){ S.failed = true; }
  if(S.gameId === id) render();
  // A game that has not kicked off has a watchlist block to fill.
  ensurePreData();
}

/* WHAT REFRESHES, AND HOW OFTEN.

   A past or future week does not move, so it is read once and left alone —
   unless something in it is live, which covers a Monday night game sitting in
   last week's column.

   The list: the Top 25 list every minute, as it always was. The all-games list
   only while it is showing something that can still change — search results, or
   a watchlisted player's game that has not finished.

   Inside a game: a Top 25 game keeps the fast scoreboard refresh it always had,
   because that list is small. Any other game takes its score from the summary
   the Live and Plays tabs already pull every thirty seconds, so following one
   costs nothing extra. If the summary turns out not to carry the score, the
   all-games list stands in at that slower clock. A finished game's score does
   not change, so it is not refreshed at all. */
function schedule(){
  if(timer) clearInterval(timer);
  if(detailTimer) clearInterval(detailTimer);
  if(fullTimer) clearInterval(fullTimer);
  timer = detailTimer = fullTimer = null;
  if(document.visibilityState !== 'visible') return;   // never poll in the background
  const d = S.data[S.league];
  const moving = !S.wk[S.league] || anyLive(d && d.games) || anyLive(extraGames());
  if(S.view === 'list'){
    if(moving) timer = setInterval(loadList, LIST_MS);
    if(S.league === 'cfb' && moving && S.full.cfb
       && (searchQ() || extraGames().some(function(g){ return g.state !== 'post'; })))
      fullTimer = setInterval(loadFull, LIST_MS);
  }else{
    const g = findGame();
    const settled = !!(g && g.state === 'post');
    if(gameIsFeatured(S.gameId)){
      if(!settled) timer = setInterval(loadList, SCORE_MS);   // small list, fast
    }else if(S.soloOk === false && !settled){
      fullTimer = setInterval(loadFull, FOLLOW_MS);
    }
    detailTimer = setInterval(loadGame,                       // expensive, one game
      S.view === 'box' ? DETAIL_MS : FOLLOW_MS);
  }
}
document.addEventListener('visibilitychange', function(){
  schedule();
  if(document.visibilityState === 'visible'){ loadList(); if(S.view !== 'list') loadGame(); }
});

document.addEventListener('click', async function(ev){
  const t = ev.target;
  if(t.closest && t.closest('#sheet-x')){ closeCard(); return; }
  const sheet = t.closest && t.closest('#sheet');
  if(sheet){
    // Tapping the dimmed area outside the card closes it; taps inside do not.
    if(t === sheet) closeCard();
    return;
  }
  const pn = t.closest ? t.closest('[data-player]') : null;
  if(pn){ openCard(pn.getAttribute('data-player')); return; }
  const wkb = t.closest ? t.closest('[data-wk]') : null;
  if(wkb){
    const k = wkb.getAttribute('data-wk');
    const e = (S.cal[S.league] || []).filter(function(x){ return wkKey(x) === k; })[0];
    if(!e) return;
    const next = k === wkKey(S.cur[S.league]) ? null : { st: e.st, wk: e.wk };
    if(wkKey(next) === wkKey(S.wk[S.league])) return;
    S.wk[S.league] = next;
    S.data[S.league] = null; S.full[S.league] = null; S.fullState = 'idle';
    render(); schedule(); loadList(); return;
  }
  const lg = t.closest ? t.closest('[data-lg]') : null;
  if(lg){
    const nextLg = lg.getAttribute('data-lg');
    // A sport always opens on its current week, with no search carried over.
    if(S.wk[nextLg]){ S.wk[nextLg] = null; S.data[nextLg] = null; }
    S.full[nextLg] = null; S.fullState = 'idle'; S.q = '';
    S.solo = null; S.soloOk = null;
    S.league = nextLg; S.view = 'list'; S.game = null; S.gameId = null;
    try{ localStorage.setItem(LG_LS, S.league); }catch(e){}
    render(); loadList(); schedule(); return;
  }
  const tm = t.closest ? t.closest('[data-team]') : null;
  if(tm){ S.boxTeam = tm.getAttribute('data-team'); render(); return; }
  if(t.closest && t.closest('[data-plays]')){ S.playsOpen = !S.playsOpen; render(); return; }
  const qp = t.closest ? t.closest('[data-q]') : null;
  if(qp){ S.playsQ = Number(qp.getAttribute('data-q')); render(); return; }
  const gv = t.closest ? t.closest('[data-gv]') : null;
  if(gv){
    const next = gv.getAttribute('data-gv');
    // Switching tabs means the Live screen has been seen, so the box score
    // stops repeating the scoring summary and watchlist that live there.
    if(next === 'box') S.from = 'game';
    S.view = next; render(); schedule(); return;
  }
  if(t.closest && t.closest('#back')){
    // The tabs move between Live and Box Score, so back always means "out".
    S.view = 'list'; S.gameId = null; S.game = null; S.solo = null; S.soloOk = null;
    delete S.fc.scoreFrom;
    render(); schedule(); return;
  }
  const card = t.closest ? t.closest('[data-id]') : null;
  if(card){
    S.gameId = card.getAttribute('data-id'); S.game = null; S.boxTeam = null;
    S.solo = null; S.soloOk = null;
    S.playsOpen = false;
    S.playsQ = null;
    S.from = 'list';
    // A finished game has no clock, no possession and no last play worth
    // reading — the follow-along screen would only repeat the card just tapped.
    // Go straight to the numbers. Live and upcoming games still land on the
    // game screen, which is the one that has something to follow.
    const g0 = findGame();
    S.view = (g0 && g0.state === 'post') ? 'box' : 'game';
    render(); schedule();
    await loadGame();
  }
});

/* Typing filters at once; the all-games list is fetched on the first real
   search and not before. S.q is the source of truth, not the input, so a
   repaint can never lose what was typed. */
document.addEventListener('input', function(ev){
  if(!ev.target || ev.target.id !== 'srch') return;
  S.q = ev.target.value || '';
  render();
  if(searchQ() && !S.full.cfb && S.fullState !== 'loading') loadFull();
  else schedule();
});

render();
loadList();
schedule();
</script>
</body>
