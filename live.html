<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DELTA — Live</title>
<!--
  STANDALONE. Not wired into index.html, not linked from the nav. Touches no
  engine code and carries no build marker, so it can be deleted with no
  consequence to the site.

  ── THE SOURCE IS MEANT TO BE REPLACED ──────────────────────────────────────
  Only the ADAPTERS block knows where data comes from. Everything else works on
  one internal shape. Swapping sources = one more adapter + ACTIVE_SOURCE.

  ── CONFIRMED vs ASSUMED ────────────────────────────────────────────────────
  Confirmed against the real feed 19 Sep 2026:
    events[] · competitions[0].competitors[].team.abbreviation · .score
    team.displayName · status.type.shortDetail · the summary endpoint responds
  ASSUMED, read defensively, page works without each:
    status.type.state · situation.{possession,downDistanceText,yardLine,distance}
    competitors[].{records,homeAway} · team.{color,alternateColor}
    boxscore.players[].statistics[] · drives.current
  The Feed Check panel reports which of these actually arrived. Anything
  reading 0 there is not available to build on, whatever the docs say.

  ── THE FIELD BAR IS UNVERIFIED ─────────────────────────────────────────────
  ESPN's yardLine convention is not documented anywhere reliable. The bar is
  drawn from it, and the RAW values are printed in Feed Check so the first live
  game either confirms the convention or shows it is backwards. Do not trust
  the bar until that check has been eyeballed against a real game.
-->
<style>
:root{
  --ink:#0A0F1A; --ink-2:#0D1420; --panel:#111A28; --line:#1E2A3A;
  --paper:#EAF0F4; --fog:#8CA0B3; --fog-2:#5C7080;
  --teal-br:#2DD4BF; --teal-tint:rgba(45,212,191,.12);
  --sky:#6BB6E0; --sky-tint:rgba(107,182,224,.14);
  --topaz:#E0B34D;
  /* emerald / coral / topaz are RESERVED SIGNAL COLOURS (buy / sell / watch)
     and must never mark a game state. Live is sky, settled is fog. Team
     colours are DATA from the feed, not tokens, so they are set inline. */
  --sans:'Nunito Sans','Avenir Next',system-ui,'Segoe UI',sans-serif;
  --mono:'SFMono-Regular',ui-monospace,'JetBrains Mono','Roboto Mono',Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:14px 12px 30px;font-family:var(--sans);background:var(--ink);
     color:var(--paper);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.top-l{display:flex;align-items:center;gap:10px;min-width:0}
h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.01em;
   white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stamp{font-family:var(--mono);font-size:10.5px;color:var(--fog);white-space:nowrap}
.back{background:transparent;border:0;color:var(--teal-br);font-size:17px;line-height:1;
      padding:8px 10px 8px 0;margin:-8px 0}

.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--fog);
     border-radius:9px;padding:12px 6px;font-family:var(--sans);font-size:13px;font-weight:600}
.tab[aria-selected="true"]{color:var(--teal-br);border-color:var(--teal-br);background:var(--teal-tint)}

.hd{display:flex;align-items:center;gap:9px;margin:16px 0 9px}
.hd span:first-child{font-family:var(--mono);font-size:10px;letter-spacing:.09em;color:var(--fog);
                     text-transform:uppercase;white-space:nowrap}
.rule{flex:1;height:1px;background:var(--line)}

.notice{background:var(--ink-2);border:1px solid var(--line);border-radius:10px;
        padding:10px 12px;font-size:12px;color:var(--fog);margin-bottom:12px;line-height:1.45}

.g{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;
   margin-bottom:9px;width:100%;text-align:left;padding:0;font-family:var(--sans);color:inherit;display:block}
.bar{display:flex;height:3px}
.bar span{flex:1}
.gin{padding:9px 12px 10px}
.chiprow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}
.chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--sky);
      background:var(--sky-tint);border-radius:4px;padding:3px 6px}
.chip.done{color:var(--fog);background:transparent;padding-left:0}
.when{font-family:var(--mono);font-size:11px;color:var(--sky)}
.when.off{color:var(--fog)}
.tm{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:3px 0}
.tm-l{display:flex;align-items:center;gap:9px;min-width:0}
.spine{width:3px;height:20px;border-radius:2px;flex:none}
.abbr{font-weight:800;font-size:15px;letter-spacing:-.01em}
.nick{font-size:11.5px;color:var(--fog);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec{font-family:var(--mono);font-size:10px;color:var(--fog)}
.dot{color:var(--sky);font-size:10px}
.sc{font-family:var(--mono);font-size:21px;font-variant-numeric:tabular-nums;color:var(--fog)}
.sc.lead{color:var(--paper);font-weight:700}
.gfoot{margin-top:7px;border-top:1px solid var(--line);padding-top:7px;
       font-family:var(--mono);font-size:10.5px;color:var(--fog)}
.pre{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px}
.pre-t{font-weight:800;font-size:14.5px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px 13px;margin-bottom:2px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0;
     border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.nm{font-size:13.5px;font-weight:700}
.nm .pos{color:var(--fog);font-weight:400;font-size:11px}
.sub{font-family:var(--mono);font-size:10.5px;color:var(--fog);margin-top:2px}
/* The box score is a TABLE, because its job is comparing players down a column.
   Five columns is the ceiling that fits a phone; anything more and the right
   edge gets cut off, which is the exact fault in every other app's version.
   Nothing here ever scrolls sideways. */
table.bx{width:100%;border-collapse:collapse;table-layout:fixed}
.bx th{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--fog-2);
       font-weight:600;text-align:right;padding:0 0 7px;white-space:nowrap}
.bx th.p,.bx td.p{text-align:left;width:auto}
.bx col.n{width:38px}
.bx td{font-family:var(--mono);font-size:12px;text-align:right;padding:9px 0;
       border-top:1px solid var(--line);font-variant-numeric:tabular-nums;
       white-space:nowrap}
.bx tbody tr:first-child td{border-top:0}
.bx td.p{font-family:var(--sans);font-size:13px;font-weight:700;
         overflow:hidden;text-overflow:ellipsis;padding-right:8px}
/* A zero is kept so the columns stay aligned, but dimmed so the numbers that
   actually happened are the ones the eye catches. */
.bx td .z{color:var(--fog-2)}
.rowb{padding:10px 0;border-bottom:1px solid var(--line)}
.rowb:last-child{border-bottom:0}
.statline{font-family:var(--mono);font-size:11px;color:var(--fog);margin-top:4px;
          line-height:1.5;font-variant-numeric:tabular-nums}
.statline{color:var(--fog)}
.swatch{width:9px;height:9px;border-radius:2px;flex:none}
.card.tinted{border-top-width:2px;border-top-style:solid}
/* topaz IS the reserved signal for WATCH, so a watchlist star is its correct
   use, not an exception to the rule. */
.trk{color:var(--topaz);font-size:11px}

.hero{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:2px}
.hero .bar{height:4px}
.hero-in{padding:12px 14px 13px}
.hero .tm{padding:4px 0}
.hero .spine{width:4px;height:28px}
.hero .abbr{font-size:17px}
.hero .sc{font-size:34px;line-height:1}

.field{position:relative;height:36px;border-radius:6px;overflow:hidden;
       background:var(--ink-2);border:1px solid var(--line)}
.ez{position:absolute;top:0;bottom:0}
.tick{position:absolute;top:22%;bottom:22%;width:1px;background:var(--line)}
.tick.mid{top:8%;bottom:8%;background:var(--fog-2)}
/* The ground still to cover, shaded between the ball and the line to gain. On a
   3rd and 2 it is a sliver; on a 1st and 10 it is a block. That difference is
   the whole point of drawing this rather than printing the number. */
.gain{position:absolute;top:0;bottom:0;background:rgba(234,240,244,.10)}
.ball{position:absolute;top:0;bottom:0;width:4px;box-shadow:0 0 0 1px rgba(10,15,26,.55)}
.togo{position:absolute;top:0;bottom:0;width:2px;background:var(--paper)}
.fkey{display:flex;justify-content:space-between;margin-top:6px;font-family:var(--mono);
      font-size:9.5px;color:var(--fog-2);letter-spacing:.04em}

/* The player card is DELTA's own page, opened in a sheet over the feed rather
   than copied in here. Same origin, so it just works, and it can never drift
   from the real card because it IS the real card. */
.sheet{position:fixed;inset:0;background:rgba(10,15,26,.82);z-index:50;display:flex;
       flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;
          padding:11px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.sheet-nm{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-x{background:transparent;border:1px solid var(--line);color:var(--fog);border-radius:8px;
         padding:7px 12px;font-family:var(--sans);font-size:13px;flex:none}
.sheet iframe{flex:1;width:100%;border:0;background:var(--ink)}
.pname{background:transparent;border:0;padding:0;margin:0;font:inherit;color:inherit;
       text-align:left;text-decoration:underline;text-decoration-color:var(--line);
       text-underline-offset:3px}
.play{font-size:13px;line-height:1.45}
details.prev{margin:10px 0 0;border-top:1px solid var(--line);padding-top:9px;border-bottom:0}
details.prev summary{font-family:var(--mono);font-size:10.5px;color:var(--fog);cursor:pointer}
.pv{padding:9px 0 0;border-top:1px solid var(--line);margin-top:9px}
.pv:first-of-type{border-top:0;margin-top:0}
.empty{color:var(--fog);font-size:13px;padding:18px 2px}
details{margin-top:24px;border-top:1px solid var(--line);padding-top:12px}
summary{font-family:var(--mono);font-size:11px;color:var(--fog)}
.fc{font-family:var(--mono);font-size:10.5px;color:var(--fog);margin-top:8px;white-space:pre-wrap;
    word-break:break-word}
</style>
</head>
<body>

<div class="top">
  <div class="top-l" id="head"></div>
  <div class="stamp" id="stamp">&mdash;</div>
</div>
<div id="tabs"></div>
<div id="notice"></div>
<div id="view"><div class="empty">Loading&hellip;</div></div>

<!-- Feed Check was scaffolding: it reported which optional fields the feed
     actually sent, while that was still unknown. It is answered now, so it is
     off the page. Add ?debug=1 to the address if a field ever needs checking
     again. -->
<details id="fcwrap" hidden>
  <summary>Feed Check</summary>
  <div class="fc" id="fc"></div>
</details>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   ADAPTERS — the ONLY part of this file that knows where data comes from.

   scoreboard(raw) -> { games:[ { id, state:'pre'|'in'|'post', status, detail,
       situation:{yardLine,distance,possessionAbbr}|null,
       teams:[{abbr,nick,score,record,color,altColor,hasBall,homeAway}] } ], found:{} }

   summary(raw) -> { lastPlay:{text,at}|null,
       sections:[{name,teamAbbr,players:[{name,jersey,headline,sub,team}]}], found:{} }

   To move off ESPN: add a sibling object and change ACTIVE_SOURCE.
   ══════════════════════════════════════════════════════════════════════════ */
const ADAPTERS = {
  espn: {
    label: 'ESPN',
    base: 'https://site.api.espn.com/apis/site/v2/sports/football/',
    path: function(league){ return league === 'cfb' ? 'college-football' : 'nfl'; },
    scoreboardUrl: function(league){ return this.base + this.path(league) + '/scoreboard'; },
    summaryUrl: function(league, id){
      return this.base + this.path(league) + '/summary?event=' + encodeURIComponent(id);
    },

    scoreboard: function(raw){
      const found = { total:0, state:0, possession:0, downDistance:0, record:0, color:0, yardLine:0 };
      const games = [];
      const events = (raw && raw.events) || [];
      for(const ev of events){
        const comp = ev && ev.competitions && ev.competitions[0];
        if(!comp) continue;
        const type = (ev.status && ev.status.type) || {};

        // ESPN sends 0-0 before kickoff, so the score alone cannot decide
        // whether to show a scoreline.
        let state = type.state;
        if(state) found.state++;
        else if(type.completed === true) state = 'post';
        else state = /\d{1,2}\/\d{1,2}|AM|PM/i.test(type.shortDetail || '') ? 'pre' : 'in';

        const sit = comp.situation || {};
        if(sit.possession != null) found.possession++;
        if(sit.downDistanceText) found.downDistance++;
        if(typeof sit.yardLine === 'number') found.yardLine++;

        let possAbbr = null;
        const teams = (comp.competitors || []).map(function(c){
          const t = c.team || {};
          const rec = (c.records && c.records[0] && c.records[0].summary) || '';
          if(rec) found.record++;
          if(t.color) found.color++;
          const ball = sit.possession != null && String(sit.possession) === String(t.id);
          const abbr = t.abbreviation || t.shortDisplayName || t.displayName || '?';
          if(ball) possAbbr = abbr;
          return { abbr: abbr, nick: t.name || '', score: c.score == null ? null : String(c.score),
                   record: rec, color: t.color || null, altColor: t.alternateColor || null,
                   hasBall: ball, homeAway: c.homeAway || '' };
        });

        // A competition with fewer than two teams is not a game anyone can
        // read — it rendered as a blank card. Skip it rather than show it.
        if(teams.length < 2) continue;

        found.total++;
        games.push({
          id: ev.id || '', state: state,
          status: type.shortDetail || type.description || '',
          detail: state === 'in' ? (sit.downDistanceText || '') : '',
          situation: state === 'in' ? {
            yardLine: typeof sit.yardLine === 'number' ? sit.yardLine : null,
            distance: typeof sit.distance === 'number' ? sit.distance : null,
            possessionAbbr: possAbbr
          } : null,
          teams: teams
        });
      }
      return { games: games, found: found };
    },

    summary: function(raw){
      const found = { sections:0, players:0, lastPlay:0, targets:0,
                      fumblesLost:0, fumbles:0 };
      const sections = [];
      const box = (raw && raw.boxscore) || {};
      for(const tm of (box.players || [])){
        const abbr = (tm.team && (tm.team.abbreviation || tm.team.displayName)) || '?';

        /* Fumbles arrive in their own section, which this page otherwise drops.
           They matter, though: a lost fumble costs fantasy points, so it belongs
           on the player's own row rather than in a section nobody opens. Harvest
           them first, then fold each one into its player below.

           FUMBLES and FUMBLES LOST are different things and only the second
           costs anything. If the feed gives the lost count it is shown as FL; if
           it only gives total fumbles, the column says FUM instead. Labelling a
           plain fumble as "lost" would be claiming something the feed never
           said. */
        const fum = {};
        for(const st of (tm.statistics || [])){
          if(String(st.name || '').toLowerCase().indexOf('fumble') !== 0) continue;
          const L = st.labels || [];
          const iLost = L.indexOf('LOST'), iFum = L.indexOf('FUM');
          for(const a of (st.athletes || [])){
            const nm = (a.athlete && (a.athlete.displayName || a.athlete.shortName)) || '';
            if(!nm) continue;
            fum[normName(nm)] = {
              lost: iLost >= 0 ? (a.stats || [])[iLost] : null,
              fum:  iFum  >= 0 ? (a.stats || [])[iFum]  : null
            };
          }
        }

        for(const st of (tm.statistics || [])){
          const labels = st.labels || [];
          const players = [];
          // Per statistic block, NOT per athlete: the column set below is chosen
          // after the athlete loop has ended, so a const scoped inside that loop
          // is not in scope where it is needed.
          const unit = String(st.name || '').toLowerCase();
          for(const a of (st.athletes || [])){
            const ath = a.athlete || {};
            const stats = a.stats || [];
            const pick = function(key){
              const i = labels.indexOf(key);
              return i >= 0 ? stats[i] : null;
            };
            // Targets are labelled inconsistently and are missing from some
            // college feeds altogether, so try the spellings rather than one.
            const pickAny = function(keys){
              for(const k of keys){ const v = pick(k); if(v != null) return v; }
              return null;
            };
            // One line, read the way the stat is spoken: volume, then yards,
            // then what it produced. Yards carries the emphasis flag so the
            // renderer can make it the thing the eye lands on.
            const line = [];
            const add = function(v, label, emph){
              if(v == null || v === '' || v === '0/0') return;
              line.push({ t: label ? (v + ' ' + label) : String(v), e: !!emph });
            };
            const addIf = function(v, label){
              if(v && v !== '0' && v !== '0.0') line.push({ t: v + ' ' + label, e: false });
            };
            const tgt = pickAny(['TGTS', 'TGT', 'TAR', 'TARGETS']);
            if(tgt != null) found.targets++;

            // `cells` feeds the box-score TABLE; `line` feeds the watchlist
            // block, where players from different categories sit together and a
            // shared column set would be meaningless. Both come off the same
            // reads so they can never disagree.
            const cells = {};
            // Either the section carries it, or the fumbles section did.
            const own = fum[normName(ath.displayName || ath.shortName || '')] || {};
            const lost = pickAny(['FUML', 'FL', 'LOST']) != null
                       ? pickAny(['FUML', 'FL', 'LOST']) : own.lost;
            const fumb = pickAny(['FUM', 'FUMBLES']) != null
                       ? pickAny(['FUM', 'FUMBLES']) : own.fum;
            if(lost != null){ cells.FL = lost; found.fumblesLost++; }
            else if(fumb != null){ cells.FUM = fumb; found.fumbles++; }

            if(unit.indexOf('kick') === 0){
              cells.FG = pick('FG'); cells.XP = pick('XP');
              cells.PTS = pick('PTS'); cells.LG = pick('LONG');
              add(pick('FG'), 'FG');
              add(pick('XP'), 'XP');
              add(pick('PTS'), 'PTS');
              addIf(pick('LONG'), 'LONG');
            }else if(unit.indexOf('pass') === 0){
              cells['C/ATT'] = pick('C/ATT'); cells.YDS = pick('YDS');
              cells.TD = pick('TD');          cells.INT = pick('INT');
              add(pick('C/ATT'), '');
              add(pick('YDS'), 'YDS');
              addIf(pick('TD'), 'TD');
              addIf(pick('INT'), 'INT');
              add(pick('AVG'), 'Y/A');
            }else if(unit.indexOf('rush') === 0){
              cells.CAR = pick('CAR');  cells.YDS = pick('YDS');
              cells.TD = pick('TD');    cells.LG = pick('LONG');
              add(pick('CAR'), 'CAR');
              add(pick('YDS'), 'YDS');
              addIf(pick('TD'), 'TD');
              add(pick('AVG'), 'AVG');
              addIf(pick('LONG'), 'LONG');
            }else{
              // Targets before receptions: the chance comes before the catch,
              // and it is the order both ESPN and Yahoo print.
              cells.TGT = tgt;          cells.REC = pick('REC');
              cells.YDS = pick('YDS');  cells.TD = pick('TD');
              cells.LG = pick('LONG');
              addIf(tgt, 'TGT');
              add(pick('REC'), 'REC');
              add(pick('YDS'), 'YDS');
              addIf(pick('TD'), 'TD');
              add(pick('AVG'), 'AVG');
              addIf(pick('LONG'), 'LONG');
            }
            // Sort keys. Yards first: this site scores what a player DID, and
            // yards are the production. Opportunity — targets and carries — is
            // deliberately NOT the sort, because DELTA's own research found the
            // opportunity signal is already priced by the market once current
            // production is controlled for. Ranking by it would lead with the
            // one number the site says is least informative.
            const num = function(v){
              const n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g, ''));
              return isFinite(n) ? n : 0;
            };
            players.push({ name: ath.displayName || ath.shortName || '',
                           jersey: ath.jersey || '', line: line, cells: cells, team: abbr,
                           // Kickers have no yardage, so points are their
                           // headline number and what the sort ranks them by.
                           _yds: unit.indexOf('kick') === 0 ? num(pick('PTS')) : num(pick('YDS')),
                           _td: num(pick('TD')),
                           _vol: num(pick('REC') || pick('CAR') || pick('C/ATT')) });
            found.players++;
          }
          if(players.length){
            // Sorted here rather than trusting the feed's order. ESPN appears to
            // send these by yards already, but that is an observation about
            // today's responses, not a promise, and it is not something the page
            // should silently depend on.
            players.sort(function(a, b){
              return (b._yds - a._yds) || (b._td - a._td) || (b._vol - a._vol);
            });
            found.sections++;
            /* Columns in priority order, then the ones carrying nothing are
               dropped and the rest capped at five — the most a phone fits
               without the right edge being cut off, which is the flaw in every
               other app's table. AVG never appears: it is yards divided by a
               column already on screen.

               Two are conditional, which is what keeps the cap honest:
                 TGT — hidden when the feed sends no targets at all. College
                       feeds may not; a column of dashes would waste a slot.
                 FL  — hidden unless somebody actually lost one, which is most
                       games. When it does appear it outranks LG, because a lost
                       fumble costs points and a long gain is flavour. */
            const ORDER = unit.indexOf('kick') === 0 ? ['FG','XP','PTS','LG']
                        : unit.indexOf('pass') === 0 ? ['C/ATT','YDS','TD','INT','FL','FUM']
                        : unit.indexOf('rush') === 0 ? ['CAR','YDS','TD','FL','FUM','LG']
                        : ['TGT','REC','YDS','TD','FL','FUM','LG'];
            const ALWAYS = { 'C/ATT':1, YDS:1, TD:1, INT:1, CAR:1, REC:1, LG:1,
                             FG:1, XP:1, PTS:1 };
            const COLS = [];
            for(const c of ORDER){
              if(COLS.length >= 5) break;
              const any = players.some(function(pl){
                const v = pl.cells[c];
                if(v == null || v === '') return false;
                // A column of nothing-happened is noise, so the optional ones
                // have to clear zero as well as exist.
                return ALWAYS[c] ? true : !(v === '0' || v === '0.0');
              });
              if(any) COLS.push(c);
            }
            sections.push({ name: st.name || st.text || '', teamAbbr: abbr,
                            cols: COLS, players: players });
          }
        }
      }
      // The drive's plays, newest first. Six is enough to catch up on what was
      // missed without turning the screen into a transcript.
      const cur = raw && raw.drives && raw.drives.current;
      const plays = ((cur && cur.plays) || [])
        .filter(function(p){ return p && p.text; })
        .slice(-6).reverse()
        .map(function(p){ return { text: p.text, at: (p.clock && p.clock.displayValue) || '' }; });
      found.lastPlay = plays.length;
      const lastPlay = plays.length ? plays[0] : null;
      /* Scoring plays, in the order they happened. Chronological on purpose:
         the running score only makes sense read forwards, and every box score
         ever printed does it this way. The away/home scores are matched to
         teams by their own homeAway flag rather than by feed order, which has
         already proved unreliable once. */
      const scoring = (raw && raw.scoringPlays || [])
        .filter(function(x){ return x && x.text; })
        .map(function(x){
          return {
            text: x.text,
            team: (x.team && (x.team.abbreviation || x.team.displayName)) || '',
            period: (x.period && x.period.number) || null,
            at: (x.clock && x.clock.displayValue) || '',
            kind: (x.scoringType && (x.scoringType.displayName || x.scoringType.name))
                  || (x.type && x.type.text) || '',
            away: x.awayScore, home: x.homeScore
          };
        });
      found.scoringPlays = scoring.length;

      return { sections: sections, lastPlay: lastPlay, plays: plays,
               scoring: scoring, found: found };
    }
  }
};
const ACTIVE_SOURCE = 'espn';

/* THE USER'S OWN WATCHLIST, not DELTA's whole universe.

   This page is served from the same origin as the app, so it reads the very
   same localStorage the star buttons write to — no download of any kind, and a
   star set in the app shows up here on the next redraw. The key and the shape
   are the engine's (delta-engine.js, dwKey/dwList): one JSON array of
   namespaced strings, "nfl:Josh Allen" / "cfb:Kevin Jennings". The two
   namespaces in use are exactly nfl and cfb, which is what this page's two
   tabs already are.

   READ ONLY. The engine is the single writer and carries the DSYNC hook, so
   nothing here ever writes to that key. */
const DW_LS = 'delta_watchlist';
function readWatchlist(league){
  const pre = (league === 'cfb' ? 'cfb' : 'nfl') + ':';
  let raw = [];
  try{ raw = JSON.parse(localStorage.getItem(DW_LS) || '[]'); }catch(e){ return new Set(); }
  if(!Array.isArray(raw)) return new Set();
  const out = new Set();
  for(const e of raw){
    if(typeof e !== 'string') continue;
    // A legacy bare entry with no namespace is an NFL player: the engine's own
    // migration treats it that way, and it may not have run here yet.
    const name = e.slice(0, pre.length) === pre ? e.slice(pre.length)
               : (league !== 'cfb' && e.indexOf(':') < 0 ? e : null);
    if(name) out.add(normName(name));
  }
  return out;
}

/* ══════════════════════════════════════════════════════════════════════════
   Source-agnostic from here down.
   ══════════════════════════════════════════════════════════════════════════ */
/* Two feeds, two clocks, because they are very different sizes and change at
   very different rates.

   The SCOREBOARD carries everything that moves play to play — score, clock,
   possession, down and distance — for every game at once, and measured 278 KB.
   The SUMMARY carries the box score and the last play, and measured 487 KB.

   Snaps come roughly every 25-40 real seconds, so a 30-second refresh could put
   you a whole play behind. Scores now refresh every 15. The box score can lag a
   minute without anyone noticing, so it does, and that pays for the faster
   scoreline: the old build pulled BOTH every 30 seconds.

   Those KB are the JSON after the browser unpacks it. What actually crosses the
   wire is compressed and typically far smaller — the Network tab shows the real
   figure, and that is the one to check before worrying about a phone plan. */
const DEBUG = /(?:^|[?&])debug=1(?:&|$)/.test(location.search);
const LIST_MS  = 60000;   // the game list, nothing open
const SCORE_MS = 15000;   // score, clock, possession while following a game
const DETAIL_MS = 60000;  // box score and last play while following a game
/* `from` records which screen the box score was reached from. It does two jobs:
   the back arrow goes back where you came from, and the watchlist block appears
   on the box score only when you arrived straight from the list — because then
   you skipped the screen that would have shown it. */
const S = { view:'list', league:'nfl', gameId:null, boxTeam:null, from:'game',
            data:{nfl:null,cfb:null}, at:{nfl:0,cfb:0},
            game:null, gameAt:0, failed:false, watch:new Set(), fc:{} };
let timer = null, detailTimer = null;

function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function ago(ts){
  if(!ts) return '\u2014';
  const s = Math.round((Date.now() - ts) / 1000);
  if(s < 10) return 'Just Now';
  if(s < 60) return s + 's Ago';
  const m = Math.round(s / 60);
  return m + (m === 1 ? ' Min Ago' : ' Mins Ago');
}
function normName(s){
  return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/\b(jr|sr|ii|iii|iv|v)\b/g,'').replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim();
}

/* A team colour from the feed is often near-black and vanishes on this
   background. Take the primary, fall back to the alternate, then lift it until
   it is actually visible. */
function teamColor(t){
  function parse(h){
    if(!h) return null;
    const v = String(h).replace('#','');
    if(!/^[0-9a-fA-F]{6}$/.test(v)) return null;
    const r = parseInt(v.slice(0,2),16), g = parseInt(v.slice(2,4),16), b = parseInt(v.slice(4,6),16);
    return { r:r, g:g, b:b, lum:(0.2126*r + 0.7152*g + 0.0722*b) / 255 };
  }
  let c = parse(t && t.color);
  if(!c || c.lum < 0.18){
    const alt = parse(t && t.altColor);
    if(alt && (!c || alt.lum > c.lum)) c = alt;
  }
  if(!c) return 'var(--fog-2)';
  let r = c.r, g = c.g, b = c.b, lum = c.lum, guard = 0;
  while(lum < 0.22 && guard++ < 12){
    r = Math.min(255, Math.round(r * 1.25 + 12));
    g = Math.min(255, Math.round(g * 1.25 + 12));
    b = Math.min(255, Math.round(b * 1.25 + 12));
    lum = (0.2126*r + 0.7152*g + 0.0722*b) / 255;
  }
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

async function getJSON(url){
  const res = await fetch(url, { cache:'no-store' });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function watched(name){ return S.watch.size > 0 && S.watch.has(normName(name)); }

function teamByAbbr(g, abbr){

function findGame(){

/* WHERE THE BALL IS.

   Position comes from the down-and-distance text ("1st & 10 at LOU 32") rather
   than from situation.yardLine, whose zero point ESPN does not document. The
   text names the team whose half the ball is on, and that team is one of the
   two already being drawn, so the geometry is self-consistent with no guess
   about the feed's conventions. yardLine is kept only as a fallback.

   DIRECTION IS TAKEN FROM THE DRAWN ORDER, NOT FROM HOME/AWAY. That was the
   bug: the bar draws teams in the order the feed sends them, while the
   direction was computed from which side was home. When the feed leads with the
   home team those two disagree, and the line to gain lands behind the ball
   instead of ahead of it. Whoever has the ball attacks the OTHER team's
   endzone, and "the other team" is simply the other end of this bar. */
const EZ = 8;                     // endzone width, percent of the bar
const FIELD = 100 - (EZ * 2);     // playing surface between them
const yd = function(n){ return EZ + (n / 100) * FIELD; };

function fieldPos(g){
  const s = g.situation || {};
  const teams = g.teams || [];
  const possIdx = teams.findIndex(function(t){ return t.hasBall; });
  if(possIdx < 0) return null;

  // "… at LOU 32" · "… at 50" · "4th & Goal at LOU 3"
  let ball = null;
  const m = String(g.detail || '').match(/at\s+([A-Za-z]{2,5})?\s*(\d{1,2})\s*$/);
  if(m){
    const n = parseInt(m[2], 10);
    if(m[1]){
      const ab = m[1].toUpperCase();
      const side = teams.findIndex(function(t){ return String(t.abbr).toUpperCase() === ab; });
      if(side === 0) ball = n;             // n yards from the LEFT goal line
      else if(side === 1) ball = 100 - n;  // n yards from the RIGHT goal line
    }else if(n === 50){ ball = 50; }
  }
  if(ball == null && typeof s.yardLine === 'number') ball = s.yardLine;
  if(ball == null) return null;

  // Left team attacks right; right team attacks left.
  const dir = possIdx === 0 ? 1 : -1;

  let dist = (typeof s.distance === 'number') ? s.distance : null;
  if(dist == null){
    const d = String(g.detail || '').match(/&\s*(\d{1,2})\b/);
    if(d) dist = parseInt(d[1], 10);
  }
  if(/&\s*goal/i.test(String(g.detail || ''))) dist = dir === 1 ? (100 - ball) : ball;

  let togo = null;
  if(dist != null){
    const t = ball + dir * dist;
    if(t >= 0 && t <= 100) togo = t;
  }
  return { ball: ball, togo: togo, dir: dir, poss: teams[possIdx] };
}

function fieldBar(g){
  const f = fieldPos(g);
  if(!f) return '';
  const a = yd(f.ball);
  const t = f.togo == null ? null : yd(f.togo);
  const lo = t == null ? null : Math.min(a, t);
  const w  = t == null ? null : Math.abs(t - a);
  const possCol = teamColor(f.poss || {});

  let ticks = '';
  for(let i = 1; i < 10; i++)
    ticks += '<span class="tick' + (i === 5 ? ' mid' : '') + '" style="left:' + yd(i * 10) + '%"></span>';

  return '<div class="hd"><span>Where The Ball Is</span><span class="rule"></span></div>'
    + '<div class="card" style="padding:12px 12px 10px">'
    + '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px">'
    + '<span style="font-weight:700;font-size:14px">' + esc(g.detail || '') + '</span>'
    + '<span class="rec">' + esc((f.poss || {}).abbr || '') + ' ball</span></div>'
    + '<div class="field">'
    + '<span class="ez" style="left:0;width:' + EZ + '%;background:' + teamColor(g.teams[0] || {}) + '"></span>'
    + '<span class="ez" style="right:0;width:' + EZ + '%;background:' + teamColor(g.teams[1] || {}) + '"></span>'
    + ticks
    + (w != null ? '<span class="gain" style="left:' + lo + '%;width:' + w + '%"></span>' : '')
    + (t != null ? '<span class="togo" style="left:' + t + '%"></span>' : '')
    + '<span class="ball" style="left:' + a + '%;background:' + possCol + '"></span>'
    + '</div>'
    + '<div class="fkey"><span>' + esc((g.teams[0] || {}).abbr || '') + '</span>'
    + '<span>' + esc((g.teams[1] || {}).abbr || '') + '</span></div></div>';
}

function titleFor(name){
  const n = String(name || '').toLowerCase();
  if(n.indexOf('pass') === 0) return 'Passing';
  if(n.indexOf('rush') === 0) return 'Rushing';
  if(n.indexOf('rec') === 0)  return 'Receiving';
  if(n.indexOf('kick') === 0) return 'Kicking';
  return name || 'Other';
}

/* Every stat carries the same weight. An earlier version made the yardage
   louder than the rest; it drew the eye oddly and read as though the other
   numbers were afterthoughts. */
function statLine(parts){
  if(!parts || !parts.length) return '';
  return '<div class="statline">' + parts.map(function(x){ return esc(x.t); })
    .join(' <span style="color:var(--fog-2)">&middot;</span> ') + '</div>';
}
function nameButton(name, trail){
  return '<button class="pname" type="button" data-player="' + esc(name) + '">'
    + esc(name) + '</button>' + (trail || '');
}
function cell(v){
  if(v == null || v === '') return '<span class="z">&ndash;</span>';
  const t = String(v);
  return (t === '0' || t === '0.0' || t === '0/0')
    ? '<span class="z">' + esc(t) + '</span>' : esc(t);
}
function playerTable(sec){
  const cols = sec.cols || [];
  return '<table class="bx"><colgroup><col>'
    + cols.map(function(){ return '<col class="n">'; }).join('') + '</colgroup>'
    + '<thead><tr><th class="p"></th>'
    + cols.map(function(c){ return '<th>' + esc(c) + '</th>'; }).join('')
    + '</tr></thead><tbody>'
    + sec.players.map(function(p){
        return '<tr><td class="p">'
          + (watched(p.name) ? '<span class="trk">&#9733;</span> ' : '')
          + nameButton(p.name) + '</td>'
          + cols.map(function(c){ return '<td>' + cell(p.cells && p.cells[c]) + '</td>'; }).join('')
          + '</tr>';
      }).join('')
    + '</tbody></table>';
}

function heroBlock(g){
  const live = g.state === 'in', li = leadIndex(g.teams);
  return '<div class="hero">' + colourBar(g.teams) + '<div class="hero-in"><div class="chiprow">'

    + '</div></div>';

function renderGame(){
  const g = findGame();
  document.getElementById('tabs').innerHTML = '';
  document.getElementById('head').innerHTML =
    '<button class="back" type="button" id="back" aria-label="Back To Game List">&#8592;</button><h1>'
    + esc(g ? g.teams.map(function(t){ return t.abbr; }).join(' at ') : 'Game') + '</h1>';

  const sum = S.game;
  let html = heroBlock(g) + fieldBar(g);

  // A finished game's "last play" is a kneel-down. Only show it while it moves.
  if(sum && sum.lastPlay && g.state === 'in'){
    const older = (sum.plays || []).slice(1);
    html += '<div class="hd"><span>Last Play</span><span class="rule"></span></div>'
      + '<div class="card" style="padding:11px 13px">'
      + (sum.lastPlay.at ? '<div class="sub" style="margin:0 0 5px">' + esc(sum.lastPlay.at) + '</div>' : '')
      + '<div class="play">' + esc(sum.lastPlay.text) + '</div>'
      + (older.length
          ? '<details class="prev"><summary>' + older.length + ' before that</summary>'
            + older.map(function(p){
                return '<div class="pv">'
                  + (p.at ? '<div class="sub" style="margin:0 0 3px">' + esc(p.at) + '</div>' : '')
                  + '<div class="play">' + esc(p.text) + '</div></div>';
              }).join('') + '</details>'
          : '')
      + '</div>';
  }

  if(sum && sum.sections.length){
    // Everyone the user actually stars, with no cap — the list is theirs, so
    // every row on it is relevant by definition.
    html += scoringBlock(g, sum);
    html += watchlistBlock(sum);
    html += '<button class="tab" type="button" id="tobox" style="width:100%;margin-top:14px">Full Box Score</button>';
  }else{
    html += '<div class="notice" style="margin-top:16px">' + esc(noDetailYet(g)) + '</div>';
  }

/* The scoring summary. Shown on whichever screen you actually land on: the
   follow screen for a live game, and the box score for a finished one, since a
   finished game now skips the follow screen entirely. Same rule as the
   watchlist block — the box score carries what you would have seen on the
   screen you skipped. */
function scoringBlock(g, sum){
  const rows = (sum && sum.scoring) || [];
  if(!rows.length) return '';
  const teams = g.teams || [];
  const byHA = function(ha){
    const t = teams.filter(function(x){ return x.homeAway === ha; })[0];
    return t ? t.abbr : '';
  };
  const awayAb = byHA('away') || (teams[0] || {}).abbr || '';
  const homeAb = byHA('home') || (teams[1] || {}).abbr || '';
  return '<div class="hd"><span>Scoring &middot; ' + rows.length
    + '</span><span class="rule"></span></div><div class="card">'
    + rows.map(function(r){
        const t = teams.filter(function(x){ return String(x.abbr) === String(r.team); })[0];
        const q = r.period ? 'Q' + r.period : '';
        return '<div class="rowb"><div style="display:flex;align-items:baseline;gap:8px">'
          + (t ? '<span class="spine" style="height:14px;background:' + teamColor(t) + '"></span>' : '')
          + '<span class="nm" style="font-size:12.5px">' + esc(r.team) + '</span>'
          + (r.kind ? '<span class="rec">' + esc(r.kind) + '</span>' : '')
          + '<span class="rec" style="margin-left:auto;white-space:nowrap">'
          + esc(awayAb) + ' ' + esc(r.away == null ? '' : r.away) + ' &middot; '
          + esc(homeAb) + ' ' + esc(r.home == null ? '' : r.home) + '</span></div>'
          + '<div class="play" style="margin-top:4px">' + esc(r.text) + '</div>'
          + ((q || r.at) ? '<div class="sub">' + esc((q + ' ' + r.at).trim()) + '</div>' : '')
          + '</div>';
      }).join('') + '</div>';
}

/* One row per PLAYER, not per stat category. A quarterback who ran, or a
   receiver who took a carry, was appearing twice — two half-pictures of the
   same person. Their lines stack inside a single row instead. */
function watchlistBlock(sum){
  const hits = [], seen = {};
  for(const sec of sum.sections){
    for(const p of sec.players){
      if(!watched(p.name)) continue;
      const k = normName(p.name);
      if(seen[k] == null){ seen[k] = hits.length; hits.push({ p: p, lines: [] }); }
      hits[seen[k]].lines.push(p.line);
    }
  }
  if(!hits.length){
    return '<div class="notice" style="margin-top:16px">'
      + (S.watch.size ? 'Nobody from your watchlist is in this game.'
                      : 'Star players in DELTA and they show up here when they play.')
      + '</div>';
  }
  return '<div class="hd"><span>Your Watchlist &middot; ' + hits.length
    + '</span><span class="rule"></span></div><div class="card">'
    + hits.map(function(h){
        return '<div class="rowb"><div class="nm"><span class="trk">&#9733;</span> '
          + nameButton(h.p.name, ' <span class="pos">' + esc(h.p.team) + '</span>')
          + '</div>' + h.lines.map(statLine).join('') + '</div>';
      }).join('') + '</div>';
}

/* "Loading" is only true while it IS loading. A game that has not kicked off
   has no player stats to fetch, and saying loading forever reads as broken. */
function noDetailYet(g){
  if(!S.game) return 'Loading the detail for this game\u2026';
  if(g && g.state === 'pre') return 'This game has not kicked off yet.';
  return 'No player stats for this game yet.';
}

function renderBox(){
  const g = findGame(), sum = S.game;
  document.getElementById('tabs').innerHTML = '';
  document.getElementById('head').innerHTML =
    '<button class="back" type="button" id="back" aria-label="Back To Game">&#8592;</button><h1>Box Score</h1>';
  const view = document.getElementById('view');
  if(!g || !sum){ view.innerHTML = '<div class="empty">No box score available.</div>'; return; }

  const abbrs = [];
  for(const s of sum.sections) if(abbrs.indexOf(s.teamAbbr) < 0) abbrs.push(s.teamAbbr);
  if(!S.boxTeam || abbrs.indexOf(S.boxTeam) < 0) S.boxTeam = abbrs[0] || null;

  let html = heroBlock(g);
  if(S.from === 'list'){ html += scoringBlock(g, sum); html += watchlistBlock(sum); }
  if(abbrs.length > 1){
    html += '<div class="tabs" style="margin-top:12px">' + abbrs.map(function(a){
      const on = a === S.boxTeam, c = teamColor(teamByAbbr(g, a) || {});
      // Selected tab wears that team's own colour rather than the brand teal,
      // which is what stops the page reading as one grey block.
      return '<button class="tab" type="button" data-team="' + esc(a) + '" aria-selected="'
        + on + '"' + (on ? ' style="color:' + c + ';border-color:' + c + ';background:transparent"' : '')
        + '>' + esc(a) + '</button>';
    }).join('') + '</div>';
  }
  // Only the three that matter. ESPN also sends fumbles, defence, kicking and
  // returns; none of that is what this page is for.
  const KEEP = ['pass', 'rush', 'rec', 'kick'];
  const rank = function(sec){
    const n = String(sec.name || '').toLowerCase();
    for(let i = 0; i < KEEP.length; i++) if(n.indexOf(KEEP[i]) === 0) return i;
    return -1;
  };
  const mine = sum.sections
    .filter(function(s){ return s.teamAbbr === S.boxTeam && rank(s) >= 0; })
    .sort(function(a, b){ return rank(a) - rank(b); });

  const col = teamColor(teamByAbbr(g, S.boxTeam) || {});
  html += mine.length
    ? mine.map(function(sec){
        return '<div class="hd"><span class="swatch" style="background:' + col + '"></span>'
          + '<span>' + esc(titleFor(sec.name)) + '</span><span class="rule"></span></div>'
          + '<div class="card tinted" style="border-top-color:' + col + '">'
          + playerTable(sec) + '</div>';
      }).join('')
    : '<div class="empty">No player stats for this team yet.</div>';
  html += '<div class="hd"><span><span class="trk">&#9733;</span> On Your Watchlist</span>'
    + '<span class="rule"></span></div>';
  view.innerHTML = html;
}

function render(){
  // Cheap, and it means a star set in the main app shows up on the next redraw
  // without this page being reloaded.
  S.watch = readWatchlist(S.league);
  S.fc.watchlist = S.watch.size;

  document.getElementById('notice').innerHTML = S.failed
    ? '<div class="notice">Could not reach the feed just now. Showing the last good read.</div>' : '';
  if(S.view === 'list') renderList();
  else if(S.view === 'game') renderGame();
  else renderBox();

  document.getElementById('stamp').textContent =
    ago(S.view === 'list' ? S.at[S.league] : (S.gameAt || S.at[S.league]));

  const f = {};
  const a = S.data[S.league] ? S.data[S.league].found : {};
  for(const k in a) f[k] = a[k];
  if(S.game) for(const k in S.game.found) f[k] = S.game.found[k];
  for(const k in S.fc) f[k] = S.fc[k];
  const fcw = document.getElementById('fcwrap');
  if(!DEBUG){ if(fcw) fcw.hidden = true; return; }
  if(fcw) fcw.hidden = false;
  const g = findGame();
  let txt = Object.keys(f).map(function(k){
    return (k + ':' + '                      ').slice(0, 22) + f[k];
  }).join('\n');
  if(g && g.situation){
    txt += '\n\nRAW yardLine: ' + g.situation.yardLine
      + '\nRAW distance: ' + g.situation.distance
      + '\nposs: ' + g.situation.possessionAbbr
      + '\n(does the bar match the real game? if not, the convention is flipped)';
  }
  txt += '\n\nA zero means this source did not send that field.';
  document.getElementById('fc').textContent = txt;
}

/* ── DELTA's player card, in a sheet ───────────────────────────────────── */
function openCard(name){
  closeCard();
  // Whichever card page belongs to the sport currently being watched. Both take
  // ?name= and both handle a name they do not know with their own clear
  // message, which is the honest answer: DELTA does not track that player.
  const page = S.league === 'cfb' ? 'cfb-player.html' : 'player.html';
  const el = document.createElement('div');
  el.className = 'sheet';
  el.id = 'sheet';
  el.innerHTML = '<div class="sheet-hd"><span class="sheet-nm">' + esc(name) + '</span>'
    + '<button class="sheet-x" type="button" id="sheet-x">Close</button></div>'
    + '<iframe title="DELTA player card" src="' + esc(page + '?name=' + encodeURIComponent(name)) + '"></iframe>';
  document.body.appendChild(el);
  document.body.style.overflow = 'hidden';
}
function closeCard(){
  const el = document.getElementById('sheet');
  if(el) el.remove();
  document.body.style.overflow = '';
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeCard();
});

/* ── loading ───────────────────────────────────────────────────────────── */
async function loadList(){
  const a = ADAPTERS[ACTIVE_SOURCE], which = S.league;
  try{
    const parsed = a.scoreboard(await getJSON(a.scoreboardUrl(which)));
    S.data[which] = parsed; S.at[which] = Date.now(); S.failed = false;
  }catch(e){ S.failed = true; }
  if(which === S.league) render();
}
async function loadGame(){
  const a = ADAPTERS[ACTIVE_SOURCE], id = S.gameId, which = S.league;
  if(!id) return;
  try{
    const parsed = a.summary(await getJSON(a.summaryUrl(which, id)));
    if(S.gameId === id){ S.game = parsed; S.gameAt = Date.now(); S.failed = false; }
  }catch(e){ S.failed = true; }
  if(S.gameId === id) render();
}
function schedule(){
  if(timer) clearInterval(timer);
  if(detailTimer) clearInterval(detailTimer);
  if(document.visibilityState !== 'visible') return;   // never poll in the background
  if(S.view === 'list'){
    timer = setInterval(loadList, LIST_MS);
  }else{
    timer = setInterval(loadList, SCORE_MS);           // cheap, fast, all games
    detailTimer = setInterval(loadGame, DETAIL_MS);    // expensive, slow, one game
  }
}
document.addEventListener('visibilitychange', function(){
  schedule();
  if(document.visibilityState === 'visible'){ loadList(); if(S.view !== 'list') loadGame(); }
});

document.addEventListener('click', async function(ev){
  const t = ev.target;
  if(t.closest && t.closest('#sheet-x')){ closeCard(); return; }
  const sheet = t.closest && t.closest('#sheet');
  if(sheet){
    // Tapping the dimmed area outside the card closes it; taps inside do not.
    if(t === sheet) closeCard();
    return;
  }
  const pn = t.closest ? t.closest('[data-player]') : null;
  if(pn){ openCard(pn.getAttribute('data-player')); return; }
  const lg = t.closest ? t.closest('[data-lg]') : null;
  if(lg){
    S.league = lg.getAttribute('data-lg'); S.view = 'list'; S.game = null; S.gameId = null;
    render(); loadList(); schedule(); return;
  }
  const tm = t.closest ? t.closest('[data-team]') : null;
  if(tm){ S.boxTeam = tm.getAttribute('data-team'); render(); return; }
  if(t.closest && t.closest('#tobox')){ S.view = 'box'; S.from = 'game'; render(); return; }
  if(t.closest && t.closest('#back')){
    if(S.view === 'box' && S.from === 'game'){ S.view = 'game'; }
    else { S.view = 'list'; S.gameId = null; S.game = null; }
    render(); schedule(); return;
  }
  const card = t.closest ? t.closest('[data-id]') : null;
  if(card){
    S.gameId = card.getAttribute('data-id'); S.game = null; S.boxTeam = null;
    S.from = 'list';
    // A finished game has no clock, no possession and no last play worth
    // reading — the follow-along screen would only repeat the card just tapped.
    // Go straight to the numbers. Live and upcoming games still land on the
    // game screen, which is the one that has something to follow.
    const g0 = findGame();
    S.view = (g0 && g0.state === 'post') ? 'box' : 'game';
    render(); schedule();
    await loadGame();
  }
});

render();
loadList();
schedule();
</script>
</body>
</html>
