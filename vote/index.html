<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who Would You Rather Have?</title>
<style>
  :root {
    --ink: #0A0F1A; --ink-2: #0D1420; --panel: #111A28; --line: #1E2A3A;
    --paper: #EAF0F4; --fog: #8CA0B3; --fog-2: #748A9C;
    --teal-br: #2DD4BF; --teal: #14B8A6; --emerald: #10B981; --emerald-deep: #047857; --mint: #CCFBF1;
    --topaz: #E0B34D;
    --teal-tint: color-mix(in srgb, var(--teal-br) 14%, var(--panel));
    --sans: "Nunito Sans", "Avenir Next", system-ui, -apple-system, sans-serif;
    --mono: SFMono-Regular, ui-monospace, "JetBrains Mono", monospace;
    --geo: "Century Gothic", Futura, Questrial, "Josefin Sans", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--sans); -webkit-tap-highlight-color: transparent; }
  .wrap { max-width: 720px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); min-height: 100vh; display: flex; flex-direction: column; gap: 16px; }
  .mock { font-size: 12px; font-weight: 700; color: var(--topaz); border: 1px solid color-mix(in srgb, var(--topaz) 45%, var(--line)); background: color-mix(in srgb, var(--topaz) 10%, var(--panel)); border-radius: 10px; padding: 8px 12px; line-height: 1.4; }
  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--paper); }
  .brand svg { width: 32px; height: 32px; }
  .brand span { font-family: var(--geo); font-weight: 700; font-size: 16px; letter-spacing: .04em; }
  .count { font-size: 12px; color: var(--fog); justify-self: end; white-space: nowrap; }
  .back { justify-self: start; font-size: 13px; font-weight: 700; color: var(--paper); text-decoration: none; border: 1px solid var(--line); background: var(--ink-2); border-radius: 18px; padding: 8px 14px; white-space: nowrap; }
  .back:focus-visible { outline: 2px solid var(--teal-br); outline-offset: 2px; }
  .prog { font-size: 12px; color: var(--fog); margin: 8px 0 0; text-align: center; }
  .prog b { font-family: var(--mono); color: var(--paper); font-weight: 600; }
  .count b { font-family: var(--mono); color: var(--paper); font-weight: 500; }
  h1 { font-size: 20px; font-weight: 800; margin: 0; text-align: center; }
  .sub { font-size: 13px; color: var(--fog); margin: 4px 0 0; text-align: center; }
  .pair { display: grid; gap: 10px; }
  @media (min-width: 640px) { .pair { grid-template-columns: 1fr auto 1fr; align-items: stretch; } }
  .or { align-self: center; justify-self: center; font-size: 12px; font-weight: 700; color: var(--fog-2); }
  .card { position: relative; width: 100%; min-height: 128px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--paper); font: inherit; text-align: left; padding: 18px 16px; cursor: pointer; display: grid; align-content: center; gap: 6px; overflow: hidden; transition: border-color .15s, opacity .2s, transform .1s; }
  .card:active { transform: scale(.985); }
  .card:focus-visible { outline: 2px solid var(--teal-br); outline-offset: 2px; }
  .name { font-size: 20px; font-weight: 800; line-height: 1.2; white-space: nowrap; overflow: hidden; position: relative; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; position: relative; }
  .chip { font-size: 12px; font-weight: 700; color: var(--fog); background: var(--ink-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; }
  .chip .num { font-family: var(--mono); font-weight: 500; }
  .bar { position: absolute; inset: 0 auto 0 0; width: 0; background: color-mix(in srgb, var(--fog) 10%, var(--panel)); transition: width .5s ease; }
  .pct { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: 20px; font-weight: 700; opacity: 0; transition: opacity .3s; }
  .voted .card { cursor: default; }
  .voted .card.pick { border-color: var(--teal-br); }
  .voted .card.pick .bar { background: var(--teal-tint); }
  .voted .card.pick .pct { color: var(--teal-br); }
  .voted .card:not(.pick) { opacity: .7; }
  .voted .pct { opacity: 1; }
  .result { min-height: 20px; text-align: center; font-size: 13px; color: var(--fog); }
  .result b { color: var(--paper); }
  .actions { display: grid; gap: 10px; margin-top: auto; }
  .next { height: 48px; border-radius: 14px; border: 0; background: var(--teal-br); color: var(--ink); font: inherit; font-size: 16px; font-weight: 800; cursor: pointer; }
  .next[disabled] { opacity: .35; cursor: default; }
  .skip { height: 36px; border-radius: 18px; border: 1px solid var(--line); background: var(--ink-2); color: var(--fog); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; justify-self: center; padding: 0 14px; }
  footer { font-size: 12px; color: var(--fog-2); text-align: center; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" id="back" href="/">← Back To DELTA</a>
    <a class="brand" href="/" aria-label="DELTA home">
      <svg viewBox="0 0 128 128" aria-hidden="true">
        <defs>
          <linearGradient id="lf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--teal-br)"/><stop offset="1" stop-color="var(--teal)"/></linearGradient>
          <linearGradient id="rf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--emerald)"/><stop offset="1" stop-color="var(--emerald-deep)"/></linearGradient>
        </defs>
        <path d="M64 22 L24 106 L64 106 Z" fill="url(#lf)"/>
        <path d="M64 22 L64 106 L104 106 Z" fill="url(#rf)"/>
        <line x1="64" y1="25" x2="64" y2="106" stroke="var(--mint)" stroke-width="2" opacity=".7"/>
        <g stroke="var(--mint)" stroke-width="3" stroke-linecap="round" opacity=".85">
          <line x1="58" y1="52" x2="70" y2="52"/><line x1="55" y1="70" x2="73" y2="70"/><line x1="52" y1="88" x2="76" y2="88"/>
        </g>
      </svg>
    </a>
    <div class="count">Your Votes <b id="n">0</b></div>
  </header>

  <div>
    <h1>Who Would You Rather Have?</h1>
    <p class="sub">In a 12-team, full PPR superflex dynasty league. Tap one.</p>
    <p class="prog" id="prog" hidden>Crowd Rankings: <b id="tot"></b> of <b id="goal"></b> votes</p>
  </div>

  <div class="pair" id="pair">
    <button class="card" type="button" data-side="0"><div class="bar"></div><div class="name"></div><div class="meta"></div><div class="pct"></div></button>
    <div class="or">Or</div>
    <button class="card" type="button" data-side="1"><div class="bar"></div><div class="name"></div><div class="meta"></div><div class="pct"></div></button>
  </div>

  <div class="result" id="result" aria-live="polite"></div>

  <div class="actions">
    <button class="next" id="next" type="button" disabled>Next</button>
    <button class="skip" id="skip" type="button">Don't Know Them, Skip</button>
  </div>

  <footer>Votes are anonymous (<a href="/privacy.html" style="color:inherit">Privacy</a>). Picks are 2027 rookie picks.</footer>
</div>

<script src="../delta-vote.js"></script>
<script>
// The player list, pairing and saving live in delta-vote.js (shared with the Market tab's vote card).
const OWNER_HASH = '9d7e93b5a23dbb56234802a6ca428060806070b62d3b408c034eedc35f39e966';
const $ = (s) => document.querySelector(s);
let cur = null, curType = '', shownAt = 0, voted = false;

function count(name) { try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: name, title: name, event: true }); } catch (e) {} }

async function sha256(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join('');
}
async function checkOwnerLink() {                              // ?k=CODE marks this device as the owner's, once
  const k = new URLSearchParams(location.search).get('k');
  if (!k) return;
  try { if (await sha256(k) === OWNER_HASH) DV.setOwner(); } catch (e) {}
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
}

// Back To DELTA: return to the page they came from on this site; otherwise the home page.
$('#back').addEventListener('click', (e) => {
  let same = false;
  try { same = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (err) {}
  if (same && history.length > 1) { e.preventDefault(); history.back(); }
});

function progress() {
  const t = DV.total(), el = $('#prog');
  if (t == null) { el.hidden = true; return; }
  el.hidden = false;
  $('#tot').textContent = t.toLocaleString('en-US');
  $('#goal').textContent = DV.GOAL.toLocaleString('en-US');
}

function chips(x) {
  if (x.pos === 'PICK') return '<span class="chip">Rookie Pick</span>';
  const s = [`<span class="chip">${x.pos}</span>`];
  if (x.team) s.push(`<span class="chip">${x.team}</span>`);
  if (x.age != null) s.push(`<span class="chip">Age <span class="num">${x.age}</span></span>`);
  return s.join('');
}

function show() {
  const p = DV.pickPair(); cur = p.pair; curType = p.type; voted = false; shownAt = performance.now();
  $('#pair').classList.remove('voted'); $('#result').textContent = ''; $('#next').disabled = true;
  document.querySelectorAll('.card').forEach((c, i) => {
    const x = cur[i];
    c.classList.remove('pick');
    const nm = c.querySelector('.name'); nm.textContent = x.n; nm.style.fontSize = '';
    for (let f = 20; f > 13 && nm.scrollWidth > nm.clientWidth; f -= 1) nm.style.fontSize = f - 1 + 'px';   // names never wrap or cut
    c.querySelector('.meta').innerHTML = chips(x);
    c.querySelector('.bar').style.width = '0';
    c.querySelector('.pct').textContent = '';
    c.setAttribute('aria-label', x.n);
  });
  progress();
}

async function vote(side) {
  if (voted) return;
  voted = true;
  const pair = cur;
  $('#pair').classList.add('voted');
  document.querySelectorAll('.card').forEach((c, i) => { if (i === side) c.classList.add('pick'); });
  $('#result').textContent = 'Saving\u2026';
  try { await DV.save(pair, curType, pair[side].n, performance.now() - shownAt); }
  catch (e) { $('#result').textContent = "Couldn't save that vote. Check your connection and try the next one."; $('#next').disabled = false; return; }
  $('#n').textContent = DV.noteVote(pair);
  count('vote-page-vote');
  progress();
  $('#next').disabled = false;
  let n;
  try { n = await DV.share(pair[0].n, pair[1].n); } catch (e) { n = null; }
  if (cur !== pair) return;                                   // moved on already
  if (!n || n[0] + n[1] === 0) { $('#result').textContent = 'Vote saved.'; return; }
  const tot = n[0] + n[1];
  const pct = [Math.round(100 * n[0] / tot), 100 - Math.round(100 * n[0] / tot)];
  document.querySelectorAll('.card').forEach((c, i) => {
    c.querySelector('.bar').style.width = pct[i] + '%';
    c.querySelector('.pct').textContent = pct[i] + '%';
  });
  if (tot === 1) $('#result').innerHTML = "<b>First vote</b> on this pair. You set the market.";
  else $('#result').innerHTML = `<b>${pct[side]}%</b> of ${tot} voters agreed with you.`;
}

document.querySelectorAll('.card').forEach((c) => c.addEventListener('click', () => vote(Number(c.dataset.side))));
$('#next').addEventListener('click', show);
$('#skip').addEventListener('click', () => {
  if (!voted) DV.save(cur, curType, null, performance.now() - shownAt).catch(() => {});   // a skip is data too; never blocks the next pair
  show();
});
$('#n').textContent = DV.myVotes();
checkOwnerLink();
Promise.race([DV.loadCounts(), new Promise((r) => setTimeout(r, 1500))]).then(show, show);   // never wait long for counts
</script>
<script data-goatcounter="https://handhanley.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
