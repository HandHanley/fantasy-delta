  const s = [`<span class="chip">${x.pos}</span>`];
  if (x.team) s.push(`<span class="chip">${x.team}</span>`);
  if (x.age != null) s.push(`<span class="chip">Age <span class="num">${x.age}</span></span>`);
  return s.join('');
}

function show() {
  cur = pickPair(); voted = false; shownAt = performance.now();
  $('#pair').classList.remove('voted'); $('#result').textContent = ''; $('#next').disabled = true;
  document.querySelectorAll('.card').forEach((c, i) => {
    const x = cur[i];
    c.classList.remove('pick');
    const nm = c.querySelector('.name'); nm.textContent = x.n; nm.style.fontSize = '';
    for (let f = 20; f > 13 && nm.scrollWidth > nm.clientWidth; f -= 1) nm.style.fontSize = f - 1 + 'px';   // names never wrap or cut
    c.querySelector('.meta').innerHTML = chips(x);
    c.querySelector('.bar').style.width = '0';
    c.querySelector('.pct').textContent = '';
    c.setAttribute('aria-label', x.n);
  });
}

async function vote(side) {
  if (voted) return;
  voted = true;
  const pair = cur;
  $('#pair').classList.add('voted');
  document.querySelectorAll('.card').forEach((c, i) => { if (i === side) c.classList.add('pick'); });
  $('#result').textContent = 'Saving…';
  try { await save(pair[side].n); }
  catch (e) { $('#result').textContent = "Couldn't save that vote. Check your connection and try the next one."; $('#next').disabled = false; return; }
  votes += 1; store.set('dv_votes', String(votes)); $('#n').textContent = votes;
  COUNTS[pair[0].n] = (COUNTS[pair[0].n] || 0) + 1; COUNTS[pair[1].n] = (COUNTS[pair[1].n] || 0) + 1;
  if (++sinceCounts >= 25) loadCounts();
  $('#next').disabled = false;
  let n;
  try { n = await share(pair[0].n, pair[1].n); } catch (e) { n = null; }
  if (cur !== pair) return;                                   // moved on already
  if (!n || n[0] + n[1] === 0) { $('#result').textContent = 'Vote saved.'; return; }
  const tot = n[0] + n[1];
  const pct = [Math.round(100 * n[0] / tot), 100 - Math.round(100 * n[0] / tot)];
  document.querySelectorAll('.card').forEach((c, i) => {
    c.querySelector('.bar').style.width = pct[i] + '%';
    c.querySelector('.pct').textContent = pct[i] + '%';
  });
  if (tot === 1) $('#result').innerHTML = "<b>First vote</b> on this pair. You set the market.";
  else $('#result').innerHTML = `<b>${pct[side]}%</b> of ${tot} voters agreed with you.`;
}

document.querySelectorAll('.card').forEach((c) => c.addEventListener('click', () => vote(Number(c.dataset.side))));
$('#next').addEventListener('click', show);
$('#skip').addEventListener('click', () => {
  if (!voted) save(null).catch(() => {});                     // a skip is data too; never blocks the next pair
  show();
});
$('#n').textContent = votes;
checkOwnerLink();
Promise.race([loadCounts(), new Promise((r) => setTimeout(r, 1500))]).then(show, show);   // never wait long for counts
</script>
</body>
