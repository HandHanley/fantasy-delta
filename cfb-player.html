<!doctype html>
<html lang="en"><head>

<title>DELTA · college player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#0A0F1A; --ink-2:#0D1420; --panel:#111A28; --line:#1E2A3A;
  --teal-br:#2DD4BF; --emerald:#10B981; --fog:#8CA0B3; --fog-2:#5C7080;
  --paper:#EAF0F4; --coral:#E05745; --topaz:#E0B34D; --sky:#6BB6E0; --violet:#9B8AF0;
  --sans:'Nunito Sans',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box} html,body{margin:0} body{background:var(--ink);color:var(--paper);font-family:var(--sans);padding:18px 16px 60px}
.wrap{max-width:760px;margin:0 auto}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.nav-back{font-size:12px;color:var(--fog);display:flex;align-items:center;gap:5px;transition:color .15s;text-decoration:none}
.nav-back:hover{color:var(--paper);text-decoration:none}
a{color:var(--teal-br);text-decoration:none}
.back{font-size:12px;color:var(--fog);display:inline-block;margin-bottom:14px}
.back:hover{color:var(--teal-br)}
.nm{font-size:27px;font-weight:800;letter-spacing:-.4px;line-height:1.05}
.sub{margin-top:7px;font-size:13px;color:var(--fog);display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.posdot{font-size:12px;font-weight:800;color:var(--ink);border-radius:6px;padding:3px 9px}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;border:1px solid var(--line)}
.b-p4{color:var(--emerald);border-color:#1c3a30;background:#0e1c17}
.b-g5{color:var(--coral);border-color:var(--line)}
.b-star{color:var(--topaz);border-color:#3a3320;background:#1c1810}
.b-bo{color:var(--topaz);border-color:#3a3320;background:#1c1810;font-weight:800}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
@media(max-width:640px){.cols{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px}
.hlab{font-size:10.5px;color:var(--fog);font-weight:600;letter-spacing:.02em}
.big{font-size:34px;font-weight:800;font-family:var(--mono);line-height:1}
.sec-h{font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--fog-2);margin:24px 0 9px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cell{background:var(--panel);padding:10px 11px}
.cell .k{font-size:9.5px;color:var(--fog-2);text-transform:uppercase;letter-spacing:.04em}
.cell .v{font-size:16px;font-weight:700;font-family:var(--mono);margin-top:2px}
table.gl{width:100%;border-collapse:collapse;font-size:11.5px}
table.gl th{text-align:right;color:var(--fog-2);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.03em;padding:6px 8px;border-bottom:1px solid var(--line)}
table.gl th:nth-child(-n+2),table.gl td:nth-child(-n+2){text-align:left}
table.gl td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--ink-2);font-family:var(--mono)}
.pill{font-size:10.5px;font-weight:700;padding:3px 11px;border-radius:14px;cursor:pointer}
.muted{font-size:10px;color:var(--fog-2);line-height:1.5;margin-top:8px}
#err{color:var(--fog);font-size:14px;padding:40px 0;text-align:center}
</style></head>
<body><div class="wrap">
<nav class="nav">
  <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none">
    <svg width="26" height="26" viewBox="0 0 128 128" aria-label="DELTA college" style="display:block;flex-shrink:0">
      <defs>
        <linearGradient id="cfbOStroke" x1="0.05" y1="0.25" x2="0.95" y2="0.75">
          <stop offset="0" stop-color="#2DD4BF"/><stop offset="0.5" stop-color="#14B8A6"/><stop offset="1" stop-color="#059669"/>
        </linearGradient>
        <linearGradient id="cfbOCore" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#EAFFFB"/><stop offset="1" stop-color="#5EEAD4"/>
        </linearGradient>
        <filter id="cfbOGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#2DD4BF" flood-opacity="0.35"/>
        </filter>
      </defs>
      <g filter="url(#cfbOGlow)" fill="none" stroke-linejoin="round" stroke-linecap="round">
        <path d="M64 22 L24 106 L104 106 Z" stroke="url(#cfbOStroke)" stroke-width="7.5"/>
        <path d="M64 22 L24 106 L104 106 Z" stroke="url(#cfbOCore)" stroke-width="2.3" stroke-opacity="0.5"/>
      </g>
      <line x1="64" y1="32" x2="64" y2="102" stroke="#CCFBF1" stroke-width="1.6" stroke-opacity="0.5"/>
      <g stroke="#CCFBF1" stroke-opacity="0.9" stroke-width="2.4" stroke-linecap="round">
        <line x1="58" y1="52" x2="70" y2="52"/><line x1="55" y1="70" x2="73" y2="70"/><line x1="52" y1="88" x2="76" y2="88"/>
      </g>
    </svg>
    <span style="font-weight:700;font-size:16px;letter-spacing:3.5px;text-transform:uppercase;color:#EAF0F4">DELTA</span>
  </a>
  <a class="nav-back" href="./index.html?tab=college">← College</a>
</nav>
<div id="app"><div id="err">Loading…</div></div>
</div>
<script>
// ── shared dDOM math (kept in sync with index.html; pure functions, stable/calibrated) ──
const DDOM_SWING=0.50;
function cfbMult(t){ if(t==null) return 1.0; return Math.max(1-DDOM_SWING,Math.min(1+DDOM_SWING,1+DDOM_SWING*(t-0.5)*2)); }
const RB_RUSH_W = 0.50;
// RB dominator is ALL-PURPOSE: an equal blend of rushing and receiving share.
// Rushing-only was the original definition and it systematically undersold pass-catching
// backs — Jahmyr Gibbs took ~35% of his college scrimmage yards through the air and read
// as a 47th-percentile back. Validated 22 Aug 2026 against draft capital on 306 backs
// (91 drafted, 215 undrafted): 0.50 was the empirical peak of the CV curve AND the
// pre-registered default, beating rushing-only on 92% of held-out splits, and agreeing
// on a second outcome (NFL PPG, n=54: 0.249 vs 0.199). See docs/PREREG-rb-dominator-weight.md.
// The 0.50 is deliberately un-tuned — the curve is flat between 0.3 and 0.8, so do NOT
// "improve" it to a second decimal without a study that clears the same gates.
function cfbRBDom(p){ if(p.rdom==null&&p.dom==null) return null;
  return RB_RUSH_W*(p.rdom||0)+(1-RB_RUSH_W)*(p.dom||0); }
function cfbAdjVal(p){ const m=cfbMult(p.tpct);
  if(p.pos==='QB') return p.anya==null?null:p.anya*m;
  if(p.pos==='RB'){ const d=cfbRBDom(p); return d==null?null:d*m; }
  if(p.pos==='WR'||p.pos==='TE') return p.dom==null?null:p.dom*m; return null; }
function cfbQualifies(p){ if((p.gms||0)<6) return false;
  if(p.pos==='WR'||p.pos==='TE') return (p.rec||0)>=20;
  if(p.pos==='RB') return (p.car||0)>=60;
  if(p.pos==='QB') return (p.att||0)>=120; return false; }
function cfbPct(p,pool){
  const peers=pool.filter(x=>x.pos===p.pos&&cfbQualifies(x)).map(cfbAdjVal).filter(x=>x!=null).sort((a,b)=>a-b);
  if(peers.length<2) return 50;
  const av=cfbAdjVal(p); if(av==null) return null;
  let below=0; for(const x of peers){ if(x<av) below++; } return Math.round(100*below/(peers.length-1)); }
function cfbDDOM(p,pool){ if(!cfbQualifies(p)) return null;
  const raw=p.pos==='QB'?p.anya:p.pos==='RB'?cfbRBDom(p):(p.pos==='WR'||p.pos==='TE')?p.dom:null;
  if(raw==null) return null; const pct=cfbPct(p,pool); if(pct==null) return null;
  return { pct, raw:p.pos==='QB'?Math.round(raw*10)/10:Math.round(raw*1000)/10, rawUnit:p.pos==='QB'?'':'%',
    rawLabel:p.pos==='QB'?'ANY/A':p.pos==='RB'?'all-purpose dom':'dominator',
    label:p.pos==='QB'?'competition-adjusted efficiency':p.pos==='RB'?'competition-adjusted all-purpose production':'competition-adjusted dominance' }; }
function cfbClassName(c){ return {1:'Freshman',2:'Sophomore',3:'Junior',4:'Senior',5:'Senior (5th)'}[c]||'class n/a'; }
const N=v=>(v==null||v===''||v===0)?'-':(''+v);

// ── data loading ──
const SEASON_CACHE={};
async function loadSeason(yr){ if(SEASON_CACHE[yr]!==undefined) return SEASON_CACHE[yr];
  try{ const r=await fetch('./data/college-players-'+yr+'.json',{cache:'no-cache'}); if(!r.ok) throw 0;
    const j=await r.json(); SEASON_CACHE[yr]=(j&&j.players)||[]; }catch(e){ SEASON_CACHE[yr]=[]; }
  return SEASON_CACHE[yr]; }

async function boot(){
  const name=new URLSearchParams(location.search).get('name');
  const app=document.getElementById('app');
  if(!name){ app.innerHTML='<div id="err">No player specified.</div>'; return; }
  // resolve newest visible season (same logic as the app)
  let data;
  try{ const r=await fetch('./data/college-players.json',{cache:'no-cache'}); data=await r.json(); }
  catch(e){ app.innerHTML='<div id="err">College data unavailable.</div>'; return; }
  const vis=(data.seasons||[]).slice().sort((a,b)=>b-a); const newest=vis[0];
  if(newest && data.season!==newest){ const s=await loadSeason(newest); if(s.length) data={players:s,seasons:data.seasons,season:newest}; }
  SEASON_CACHE[data.season]=data.players;
  const pool=data.players;
  const p=pool.find(x=>x.n===name) || pool.find(x=>x.n.toLowerCase()===name.toLowerCase());
  if(!p){ app.innerHTML='<div id="err">Player not found: '+name.replace(/[<>]/g,'')+'</div>'; return; }
  render(p, pool, data.seasons||[data.season]);
}

function render(p, pool, seasons){
  const dd=cfbDDOM(p, pool);
  const clsNum=p.ageEst?p.ageEst-17:p.cls;
  const posCol=p.pos==='QB'?'var(--violet)':p.pos==='RB'?'var(--topaz)':'var(--sky)';
  const compHtml=(p.p4?'<span class="badge b-p4">P4</span>':'<span class="badge b-g5">G5</span>');
  const starsHtml=p.stars?'<span class="badge b-star" title="'+p.stars+'-star recruit">'+'\u2605'.repeat(p.stars)+' recruit</span>':'';

  // dDOM hero
  const posPlural={QB:'QBs',RB:'RBs',WR:'WRs',TE:'TEs'}[p.pos]||'players';
  const tp=p.tpct==null?50:Math.round(p.tpct*100);
  const heroCard = dd
    ? '<div class="card"><div class="hlab">dDOM \u00b7 '+dd.label+'</div>'
      +'<div class="big" style="color:var(--teal-br)">'+dd.pct+'</div>'
      +'<div class="muted" style="margin-top:3px">'+(dd.pct>=50?'top '+(100-dd.pct)+'% of '+posPlural:'below median of '+posPlural)+' \u00b7 percentile at position \u00b7 raw '+dd.rawLabel+' '+dd.raw+dd.rawUnit+'</div>'
      +'<div style="margin-top:11px;font-size:10.5px;color:var(--fog);display:flex;align-items:center;gap:7px"><span>competition</span>'
      +'<span style="flex:1;height:5px;background:var(--ink-2);border-radius:3px;overflow:hidden;position:relative"><i style="position:absolute;left:0;top:0;bottom:0;width:'+tp+'%;background:linear-gradient(90deg,var(--emerald),var(--teal-br));border-radius:3px'+(p.tpct==null?';opacity:.3':'')+'"></i></span>'
      +'<span style="color:'+(p.tpct==null?'var(--fog-2)':'var(--emerald)')+';font-weight:700;white-space:nowrap">'+(p.tpct==null?'no talent data':tp+'th pct talent')+'</span></div></div>'
    : '<div class="card"><div class="hlab">dDOM</div><div class="muted" style="margin-top:6px">Below the qualifying volume floor (6+ games and a position minimum), so no competition-adjusted percentile is computed.</div></div>';

  // PPA / EPA card — the standalone page's added depth
// RB headline PPA is ALL PLAYS, not rushing plays. Rushing-only made the same mistake
// the dominator did: a box labelled "per-play efficiency" that could not see a third of a
// receiving back's work. Gibbs 2022 read 43rd percentile on rushing plays and 70th on all
// plays. Checked 22 Aug 2026 on 301 backs vs draft capital: all-plays 0.340 vs rushing
// 0.320, winning 84% of held-out splits, and 0.316 vs 0.215 against NFL PPG (n=54).
// No weight to choose here — CFBD returns the combined figure directly.
  const ppaHead = p.pos==='QB'?p.ppaPass : p.ppa;
  const ppaLbl  = p.pos==='QB'?'passing PPA/play' : p.pos==='RB'?'rushing PPA/play' : 'PPA/play';
  const ppaBench = ppaHead==null?'' : (ppaHead>=0.4?' \u00b7 elite':ppaHead>=0.2?' \u00b7 strong':ppaHead>=0?' \u00b7 solid':' \u00b7 below average');
  const splitRow=(lab,val,tip)=> val==null?'' :
    '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:5px 0;border-top:1px solid var(--line)">'
    +'<span style="font-size:10.5px;color:var(--fog)"'+(tip?' title="'+tip+'"':'')+'>'+lab+'</span>'
    +'<b style="font-size:13px;font-family:var(--mono);color:'+(val>=0?'var(--paper)':'var(--coral)')+'">'+val.toFixed(2)+'</b></div>';
  const ppaCard = (p.ppa!=null||ppaHead!=null)
    ? '<div class="card"><div class="hlab">PPA \u00b7 predicted points added (college EPA)</div>'
      +'<div class="big" style="color:var(--sky)">'+(ppaHead!=null?ppaHead.toFixed(2):(p.ppa!=null?p.ppa.toFixed(2):'-'))+'</div>'
      +'<div class="muted" style="margin-top:3px">'+ppaLbl+ppaBench+' \u2014 per-play efficiency, garbage time excluded. ~0 is average.</div>'
      +'<div style="margin-top:10px">'
        +splitRow('All plays', p.ppa, 'Average predicted points added across every play he was involved in.')
        +splitRow('Passing', p.ppaPass, 'PPA on passing plays \u2014 for a receiver, the value created on targets thrown his way.')
        +splitRow('Rushing', p.ppaRush, 'PPA on rushing plays.')
        +(p.ppaTot!=null?'<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:5px 0;border-top:1px solid var(--line)">'
          +'<span style="font-size:10.5px;color:var(--fog)" title="Cumulative points added over the season \u2014 a volume measure, unlike the per-play averages above.">Season total</span>'
          +'<b style="font-size:13px;font-family:var(--mono);color:var(--sky)">'+p.ppaTot.toFixed(1)+'</b></div>':'')
      +'</div><div id="ppa-hist"></div></div>'
    : '<div class="card"><div class="hlab">PPA (college EPA)</div><div class="muted" style="margin-top:6px">No PPA on record for this season.</div></div>';

  // production / efficiency grid
  const pc = p.pos==='QB'
    ? [['Pass yds',N(p.py)],['TD / INT',N(p.pt)+' / '+N(p.pi)],['Comp %',p.cmppct!=null?(p.cmppct*100).toFixed(1):'-'],['Yds/att',N(p.ypa)],['ANY/A',N(p.anya)],['Rush yds',N(p.ry)]]
    : p.pos==='RB'
    ? [['Rush yds',N(p.ry)],['Rush TD',N(p.rt)],['Carries',N(p.car)],['Yds/car',p.car?(p.ry/p.car).toFixed(1):'-'],['Rec',N(p.rec)],['Rec yds',N(p.rey)]]
    : [['Rec yds',N(p.rey)],['Rec TD',N(p.ret)],['Catches',N(p.rec)],['Tgt share',p.rsh!=null?Math.round(p.rsh*100)+'%':'-'],['Yds/catch',p.rec?(p.rey/p.rec).toFixed(1):'-'],['Yds/game',p.gms?(p.rey/p.gms).toFixed(1):'-']];
  const gridHtml='<div class="grid3">'+pc.map(c=>'<div class="cell"><div class="k">'+c[0]+'</div><div class="v">'+c[1]+'</div></div>').join('')+'</div>';

  document.getElementById('app').innerHTML=
    '<div class="nm">'+p.n+' <span id="bo"></span></div>'
    +'<div class="sub"><span class="posdot" style="background:'+posCol+'">'+p.pos+'</span>'+(p.tm||'-')+(p.conf?' \u00b7 '+p.conf:'')
      +compHtml+starsHtml+'<span>'+cfbClassName(clsNum)+(p.ageEst?' \u00b7 age ~'+p.ageEst:'')+'</span></div>'
    +'<div class="cols">'+heroCard+ppaCard+'</div>'
    +'<div class="sec-h">PRODUCTION &amp; EFFICIENCY</div>'+gridHtml
    +'<div class="sec-h">TRAJECTORY \u00b7 dDOM BY SEASON</div><div id="traj" class="muted">loading…</div>'
    +'<div class="sec-h">GAME LOG</div><div id="gamelog" class="muted">loading…</div>'
    +'<div id="teammates"></div>'
    +'<div class="muted" style="margin-top:22px;border-top:1px solid var(--line);padding-top:12px">'
    +'dDOM is a DELTA analytical metric (competition-adjusted production percentile among qualified players). PPA is CFBD\u2019s predicted-points-added, the college EPA. Age is an estimate from recruiting class. Regular season only.</div>';

  fillCrossSeason(p, seasons);
}

// ── cross-season: trajectory, breakout badge, season-switchable game log + team construction ──
const GL={};
function classInSeason(rec, yr){ return rec.rcls ? (yr-rec.rcls+1) : (rec.ageEst?rec.ageEst-17:null); }
function gameLogTable(pos, games){
  const cols = pos==='QB'?[['C/ATT','ca'],['Yds','py'],['TD','pt'],['INT','pi'],['Car','car'],['RuYd','ry'],['RuTD','rt']]
    : pos==='RB'?[['Car','car'],['RuYd','ry'],['RuTD','rt'],['Rec','rec'],['ReYd','rey'],['ReTD','ret']]
    : [['Rec','rec'],['ReYd','rey'],['ReTD','ret'],['Car','car'],['RuYd','ry'],['RuTD','rt']];
  const g=(games||[]).slice().sort((a,b)=>(a.w||0)-(b.w||0));
  if(!g.length) return '<div class="muted">No game rows for this season.</div>';
  return '<table class="gl"><thead><tr><th>Wk</th><th>Opp</th>'+cols.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr></thead><tbody>'
    +g.map(gm=>'<tr><td>'+(gm.w||'-')+'</td><td>'+(gm.opp||'-')+'</td>'+cols.map(c=>'<td>'+N(gm[c[1]])+'</td>').join('')+'</tr>').join('')
    +'</tbody></table>';
}
function teammatesTable(p, pool){
  const mates=pool.filter(x=>x.tm===p.tm&&x.pos!=='QB'&&(x.rec||0)>0).sort((a,b)=>(b.rsh||0)-(a.rsh||0)).slice(0,6);
  if(mates.length<2) return '';
  return '<div class="sec-h">TEAM CONSTRUCTION</div><table class="gl"><thead><tr><th>Player</th><th>Pos</th><th>Cls</th><th>Rec</th><th>Yds</th><th>RecSh</th></tr></thead><tbody>'
    +mates.map(m=>'<tr'+(m.n===p.n?' style="background:#0e1c17"':'')+'><td'+(m.n===p.n?' style="font-weight:800"':'')+'>'+m.n+(m.n===p.n?' \u2190':'')+'</td><td>'+m.pos+'</td><td>'+(m.cls?'Y'+m.cls:'-')+'</td><td>'+(m.rec||0)+'</td><td>'+(m.rey||0)+'</td><td>'+(m.rsh!=null?Math.round(m.rsh*100)+'%':'-')+'</td></tr>').join('')
    +'</tbody></table><div class="muted">Only tracked players appear \u2014 shares will not sum to 100%.</div>';
}
function glSeason(y){ if(y==='all'){ GL.sel='all'; renderGL(); return; } if(GL.data&&GL.data[y]){ GL.sel=y; renderGL(); } }
function renderGL(){
  const yrs=Object.keys(GL.data).map(Number).sort((a,b)=>a-b);
  const opts=yrs.length>1?yrs.concat(['all']):yrs;
  const lab=y=>y==='all'?'All seasons':y;
  const pills=opts.length>1?'<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">'+opts.map(y=>
    '<button class="pill" onclick="glSeason(\''+y+'\')" style="border:1px solid '+(String(y)===String(GL.sel)?'var(--teal-br)':'var(--line)')+';background:'+(String(y)===String(GL.sel)?'var(--ink)':'transparent')+';color:'+(String(y)===String(GL.sel)?'var(--teal-br)':'var(--fog)')+'">'+lab(y)+'</button>').join('')+'</div>':'';
  let body, teamHost;
  if(GL.sel==='all'){
    // Stacked multi-season log — the full career view the quick-look modal can't show.
    body=yrs.map(y=>{ const d=GL.data[y];
      const tot=(d.games||[]).reduce((a,g)=>{['rec','rey','ret','car','ry','rt','py','pt','pi'].forEach(k=>a[k]=(a[k]||0)+(+g[k]||0));return a;},{});
      const sum=d.pos==='QB'?`${tot.py||0} pass yds \u00b7 ${tot.pt||0} TD \u00b7 ${tot.pi||0} INT`
        :d.pos==='RB'?`${tot.ry||0} rush yds \u00b7 ${tot.rt||0} TD \u00b7 ${tot.rec||0} rec`
        :`${tot.rey||0} rec yds \u00b7 ${tot.ret||0} TD \u00b7 ${tot.rec||0} rec`;
      return '<div style="margin-bottom:20px"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px">'
        +'<div style="font-size:12px;font-weight:800;color:var(--teal-br)">'+y+'</div>'
        +'<div style="font-size:10.5px;color:var(--fog-2);font-family:var(--mono)">'+sum+' \u00b7 '+(d.games||[]).length+' g</div></div>'
        +gameLogTable(d.pos,d.games)+'</div>'; }).join('');
    teamHost=GL.data[yrs[yrs.length-1]];
  } else { const cur=GL.data[GL.sel]; body=gameLogTable(cur.pos,cur.games); teamHost=cur; }
  document.getElementById('gamelog').innerHTML=pills+body;
  document.getElementById('teammates').innerHTML=teammatesTable(teamHost.rec,teamHost.players);
}
async function fillCrossSeason(p, seasons){
  seasons=seasons.slice().sort((a,b)=>a-b);
  const pts={}, data={}, ppaBySeason={}; let breakout=null;
  for(const yr of seasons){
    const players=await loadSeason(yr);
    const rec=players.find(x=>x.id===p.id)||players.find(x=>x.n===p.n&&x.pos===p.pos);
    if(!rec) continue;
    const dd=cfbDDOM(rec, players);
    if(dd){ pts[yr]=dd.pct; const cin=classInSeason(rec,yr); if(!breakout&&cin!=null&&cin<=2&&dd.pct>=80) breakout={season:yr,cls:cin}; }
    if(rec.g&&rec.g.length) data[yr]={games:rec.g,pos:rec.pos,rec:rec,players:players};
    const head = rec.pos==='QB'?rec.ppaPass : rec.ppa;   // RB = all plays, see cfbPPA note
    if(head!=null||rec.ppa!=null) ppaBySeason[yr]={head, all:rec.ppa, pass:rec.ppaPass, rush:rec.ppaRush, tot:rec.ppaTot};
  }
  // PPA by season — the multi-year efficiency view the modal can't show.
  const phEl=document.getElementById('ppa-hist');
  const pYrs=Object.keys(ppaBySeason).map(Number).sort((a,b)=>a-b);
  if(phEl && pYrs.length>1){
    const vals=pYrs.map(y=>ppaBySeason[y].head).filter(v=>v!=null);
    const mx=Math.max(0.6, ...vals.map(Math.abs));
    phEl.innerHTML='<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">'
      +'<div class="hlab" style="margin-bottom:7px">PPA by season</div>'
      +pYrs.map(y=>{ const v=ppaBySeason[y].head; if(v==null) return '';
        const w=Math.max(4,Math.round(Math.abs(v)/mx*100));
        return '<div style="display:grid;grid-template-columns:42px 1fr 46px;gap:8px;align-items:center;margin-bottom:5px;font-size:11px">'
          +'<span style="color:var(--fog-2);font-family:var(--mono)">'+y+'</span>'
          +'<div style="height:14px;background:var(--ink-2);border-radius:3px;overflow:hidden"><i style="display:block;height:100%;width:'+w+'%;background:'+(v>=0?'linear-gradient(90deg,#134e7a,var(--sky))':'var(--coral)')+';border-radius:3px"></i></div>'
          +'<b style="font-family:var(--mono);font-size:11.5px;text-align:right;color:'+(v>=0?'var(--paper)':'var(--coral)')+'">'+v.toFixed(2)+'</b></div>'; }).join('')
      +'<div class="muted">Per-play PPA each season \u00b7 bars scaled to his own peak.</div></div>';
  }
  // trajectory
  const yw=seasons.filter(y=>pts[y]!=null);
  const tEl=document.getElementById('traj');
  if(tEl){ if(!yw.length){ tEl.innerHTML='<div class="muted">Not enough qualified seasons to chart.</div>'; }
    else { const first=pts[yw[0]],last=pts[yw[yw.length-1]];
      const trend=yw.length>=2?(last>first?'<span style="color:var(--emerald)">\u25b2 rising</span>':last<first?'<span style="color:var(--coral)">\u25bc declining</span>':'<span style="color:var(--fog-2)">\u2192 stable</span>'):'';
      const rows=seasons.concat([seasons[seasons.length-1]+1]).map(yr=>{ const pt=pts[yr];
        const bar=pt!=null?'<div style="height:22px;background:var(--ink-2);border-radius:4px;position:relative;overflow:hidden"><i style="position:absolute;left:0;top:0;bottom:0;width:'+Math.max(8,pt)+'%;background:linear-gradient(90deg,#134e7a,var(--sky));border-radius:4px;display:flex;align-items:center;padding-left:8px;font-size:11px;font-weight:700;font-family:var(--mono);color:var(--paper)">'+pt+'</i></div>':'<div style="height:22px;background:var(--ink-2);border-radius:4px;opacity:.35"></div>';
        return '<div style="display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:center;margin-bottom:7px;font-size:12px"><span style="color:var(--fog-2);font-family:var(--mono);font-weight:600">'+yr+'</span>'+bar+'</div>'; }).join('');
      tEl.innerHTML='<div style="text-align:right;margin-bottom:6px">'+trend+'</div>'+rows+'<div class="muted">Percentile among his position that season \u00b7 bar end = 100.</div>'; } }
  // breakout badge
  const boEl=document.getElementById('bo');
  if(boEl&&breakout){ const cn={1:'Fr',2:'So'}[breakout.cls]||'';
    boEl.outerHTML='<span class="badge b-bo" title="Top-20% competition-adjusted production as an underclassman \u2014 the strongest single college-to-NFL signal.">\u25c6 Early breakout \u00b7 '+cn+" \u2019"+String(breakout.season).slice(2)+'</span>'; }
  // game log + team construction
  const yd=Object.keys(data).map(Number).sort((a,b)=>a-b);
  const glEl=document.getElementById('gamelog');
  if(!yd.length){ if(glEl) glEl.innerHTML='<div class="muted">No game rows.</div>'; }
  else { GL.data=data; GL.sel=yd[yd.length-1]; renderGL(); }
}
boot();
</script>
