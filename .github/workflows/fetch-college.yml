# College tracking pipeline. Writes data/college-players.json, which NOTHING in the
# app fetches yet — completely invisible to users until the ?college=1 tab ships.
# Separate from the nightly NFL pipeline on purpose: different cadence, and a failure
# here must never touch NFL data.
name: Fetch College Data

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Season to build (2025 = last completed, full year of data)"
        required: false
        default: "2025"
      weeks:
        description: "Weeks to pull"
        required: false
        default: "16"
      portal_year:
        description: "Transfer portal year (defaults to the season above; use the UPCOMING season to see who just moved)"
        required: false
        default: ""
  schedule:
    # Tuesdays 09:00 UTC — after the weekend's games are finalised.
    - cron: "0 9 * * 2"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CFBD client
        run: pip install --quiet cfbd

      - name: Build college dataset
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFBD_YEAR: ${{ github.event.inputs.year || '2026' }}
          CFBD_WEEKS: ${{ github.event.inputs.weeks || '16' }}
          CFBD_PORTAL_YEAR: ${{ github.event.inputs.portal_year }}
        run: python scripts/fetch-college.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/college-players*.json data/college-portal*.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "College data refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
