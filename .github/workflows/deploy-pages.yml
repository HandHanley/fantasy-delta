name: Deploy Pages

# Replaces GitHub's classic "pages build and deployment" (which has been
# timing out on nearly every push, requiring manual re-runs). This is the
# modern Actions-based Pages deploy with an AUTOMATIC RETRY on the flaky
# deploy step — the manual "Re-run failed jobs" dance happens by itself.
#
# ONE-TIME SETUP after committing this file:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# ── WHY THE workflow_run TRIGGER BELOW MATTERS ──────────────────────────────
# GitHub deliberately does NOT trigger workflows from commits pushed by another
# workflow using the default GITHUB_TOKEN (loop prevention). So when the nightly
# data job commits data/*.json, a plain `on: push` deploy NEVER FIRES — the repo
# has fresh data but the live site keeps serving the previous build. That is the
# bug that made TD% (pass_att) never appear on the site even though the data was
# committed.
#
# `workflow_run` fires *after the data workflow completes*, regardless of who
# pushed, which closes that gap.
#
#   >>> ACTION REQUIRED: set the name below to the EXACT `name:` value at the top
#   >>> of your data workflow (the "update values" one). It must match exactly —
#   >>> it is the workflow's `name:` field, NOT the filename.

on:
  push:
    branches: [main]
  workflow_run:
    # Every workflow that COMMITS DATA belongs in this list. A commit made by a
    # workflow using the default GITHUB_TOKEN cannot trigger `on: push`, so a data
    # job missing from here lands its files in the repo and never reaches the site.
    # These are the `name:` values at the top of each workflow, not the filenames.
    workflows: ["Update Market Values", "Fetch College Data", "Build Devy Board", "Freeze Snapshot (accuracy ledger)"]
    types: [completed]
  workflow_dispatch:

# never run two deploys at once; a new push supersedes a queued one
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # For workflow_run: deploy whether the data job passed OR failed (9 Oct 2026).
    # The nightly commits its data FIRST and runs its alarms (Engine Audit, QB depth
    # check) AFTER, so a red run usually means "fresh data, plus an alarm" — and the
    # alarm already emails. Deploying only on success held that fresh data back: the
    # 5 Oct nightly failed its check and the site stayed stale until a manual re-run.
    # If a job failed before committing, this re-publishes unchanged files: harmless.
    # Cancelled or skipped runs still do nothing.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main          # workflow_run checks out the default SHA; be explicit
                             # so we always publish the newest committed data

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Cache-busting (9 Oct 2026). The pages load delta-engine.js and delta-sync.js by a
      # fixed address, so for a few minutes after a deploy a phone could pair a new page
      # with the old engine (or the reverse). The PUBLISHED copy gets ?v=<this commit> on
      # those two script tags; the repo files are untouched. Nothing to bump by hand.
      - name: Stamp script versions
        run: |
          v="$(git rev-parse --short HEAD)"
          for f in index.html player.html cfb-player.html; do
            sed -i -E "s#src=\"(delta-engine|delta-sync)\.js\"#src=\"\1.js?v=${v}\"#g" "$f"
          done
          grep -o 'src="delta-[a-z]*\.js?v=[0-9a-f]*"' index.html player.html cfb-player.html

      # Player link-preview pictures (23 Oct 2026). Draws p/<slug>/card.png for every NFL player
      # with the engine's own drawing code in a real browser, and points each /p/<slug>/ page at
      # its picture — in the PUBLISHED copy only; nothing is committed (the 409 pictures are
      # ~33 MB). Playwright goes into the runner's temp folder, never into the site. Safe to
      # fail: a page is only re-pointed after its picture is written, and the deploy carries on
      # with the site-wide og-image.png for anything not drawn. Pinned version: bump on purpose.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-1.56.1

      # The pages' TEXT preview (title, description) is rebuilt here too, from the same engine and
      # data the pictures use (23 Oct 2026). The nightly also builds them, but a fix landing
      # between nightlies left Gibbs's text at "Score 92" under a picture reading 96. If this
      # step fails, the pictures step is skipped, so text and picture can never disagree.
      - name: Player link-preview text
        id: sharepages
        continue-on-error: true
        run: node scripts/build-share-pages.js

      - name: Player link-preview pictures
        if: steps.sharepages.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        env:
          PW_DIR: ${{ runner.temp }}/pw
        run: |
          npm install --prefix "$PW_DIR" --no-audit --no-fund --silent playwright@1.56.1
          "$PW_DIR/node_modules/.bin/playwright" install --with-deps chromium
          node scripts/build-share-images.js .

      # College files (25 Oct 2026, legal compliance plan step 9). CFBD's terms bar publishing its
      # data as a bulk download or public mirror, so the raw season files (every game for ~1,000
      # players a season) stay in the repo for the scripts and studies but leave the PUBLISHED copy.
      # The pages read DELTA's college board instead (season lines + DELTA's measures, no game rows),
      # built here from those same files. If the build fails, the deploy stops and the site keeps its
      # previous version, so the College tab is never left without a file.
      - name: College board files, and no raw season files on the site
        run: |
          node scripts/build-college-board.js
          rm -f data/college-players.json data/college-players-*.json
          test -s data/college-board.json
          if ls data/college-players*.json >/dev/null 2>&1; then echo "raw college files still present"; exit 1; fi
          echo "college board built; raw season files left out of the published site"

      # Test files stay off the site (25 Oct 2026, legal compliance plan step 4). data/fixtures
      # holds the owner's league history (league-mates' Sleeper names and avatars) and Fantasy
      # Football Calculator files for studies. Nothing on the site reads them; the research
      # scripts read the repo copy, which is untouched. This deletes them from the PUBLISHED copy
      # only. If a page ever needs a file from that folder, move the file out of it instead.
      - name: Leave test files out of the site
        run: |
          rm -rf data/fixtures
          test ! -e data/fixtures && echo "data/fixtures left out of the published site"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Retry deploy (automatic — replaces the manual re-run)
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
