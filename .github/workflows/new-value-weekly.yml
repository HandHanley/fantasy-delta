name: New Value Weekly

# Rebuilds DELTA's New Value (the Own Value Scale, in season) once a week and commits data/new-value.json, plus a
# copy per week in data/new-value-history/. Display data only: the site's engine doesn't read it.
# Build: study/new_value_weekly.py (rules and their write-ups listed at its top). Data: scripts/fetch-new-value-data.sh.
#
# WHEN: 14:17 UTC Wednesday = 07:17 Arizona. Monday night's stats and the 12:00 UTC snap build are both in by then
# (see update-market-values.yml for nflverse's two clocks). GitHub often starts scheduled runs 30-140 min late; that's
# fine here. Season months only. The build values the latest regular-season week whose games are all final.
on:
  schedule:
    - cron: '17 14 * 9-12,1 3'
  workflow_dispatch:
    inputs:
      week:
        description: 'Week to build through (blank = latest completed)'
        required: false

concurrency:
  group: new-value-weekly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pandas numpy --quiet

      # Past seasons never change; the script re-downloads only this season's files (and players, picks, schedule).
      - name: Cache past seasons
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nv
          key: nv-data-2026-v1-${{ github.run_id }}
          restore-keys: nv-data-2026-v1-

      - name: Fetch nflverse data
        run: bash scripts/fetch-new-value-data.sh "${{ runner.temp }}/nv" 2026

      - name: Build New Value
        run: |
          WEEK_ARG=""
          if [ -n "${{ github.event.inputs.week }}" ]; then WEEK_ARG="--week ${{ github.event.inputs.week }}"; fi
          python study/new_value_weekly.py --data "${{ runner.temp }}/nv" --season 2026 $WEEK_ARG --out data/new-value.json
          mkdir -p data/new-value-history
          W=$(python -c "import json;print(json.load(open('data/new-value.json'))['meta']['through_week'])")
          cp data/new-value.json "data/new-value-history/2026-w$(printf '%02d' "$W").json"

      - name: Commit
        run: |
          git config user.name "DELTA Bot"
          git config user.email "delta-bot@users.noreply.github.com"
          git add data/new-value.json data/new-value-history/
          if git diff --staged --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "chore: New Value weekly build [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
