# One look at DELTA's CollegeFootballData key: tier, monthly limit, calls used and left, when the
# count resets, and the last 31 days of usage, written as annotations on the run (the logs can't
# be read from Claude's workspace). Two requests to CFBD's /info endpoints; writes nothing and
# commits nothing, so it sets off no deploy (Deploy Pages lists the workflows it follows).
# Added 25 Oct 2026 after three college runs failed overnight. Run by hand from the Actions tab.
name: CFBD Key Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ask CFBD about the key
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/cfbd-key-check.py
