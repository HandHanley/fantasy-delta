name: Update Market Values

on:
  schedule:
    # ── WHY THESE TIMES (measured 11 Sep 2026, do not "tidy" them) ─────────────
    # DELTA's game logs come from nflverse, which publishes on TWO clocks:
    #   stats + play-by-play  nflverse/nflverse-pbp, event-based crons, 5-17 min builds
    #   snap counts           nflverse/nflverse-pfr, every 6h at 00/06/12/18 UTC
    # fetch-game-logs.py needs BOTH: a missing snap row becomes snp:0.0 and the DNP
    # rule falls through, so a player who took snaps but scored nothing vanishes from
    # that week (see handoff §9). Running before the snap file lands publishes that.
    # GitHub also starts scheduled runs 30-140 min late (observed in nflverse's own
    # run history), so every slot below carries slack rather than chasing a kickoff.
    #
    # 13:20 UTC daily — 06:20 MST. The old 06:00 UTC collided with the 06:00 UTC snap
    # cron, so the nightly always read snaps that were six hours stale. 13:20 lands
    # after the previous evening's stats build AND after the 06:00/12:00 snap builds,
    # which covers Thursday night (Fri run), Sunday night (Mon run) and Monday night
    # (Tue run) with no extra workflow.
    - cron: '20 13 * * *'
    # 03:20 UTC Monday — 20:20 MST Sunday. The Sunday day games. Their stats build
    # fires 22:03 and 00:07 UTC and their snaps land on the 00:00 UTC cycle, so this
    # is the earliest point all of it is complete. Pulls Sunday's box scores forward
    # by a full day. Season months only; pointless in June.
    - cron: '20 3 * 9-12,1 1'
  workflow_dispatch:

jobs:
  update-values:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install polars pyarrow pandas --quiet
          pip install 'nflreadpy@git+https://github.com/nflverse/nflreadpy' --quiet

      - name: Fetch FantasyCalc market values
        run: node scripts/fetch-market-values.js

      - name: Fetch scarcity-engine validation
        run: node scripts/fetch-scarcity-validation.js

      - name: Fetch NFL player stats
        run: python scripts/fetch-player-stats.py

      - name: Fetch game logs + snap counts
        run: python scripts/fetch-game-logs.py

      # DELTA Read of a finished game, for live.html only (4 Oct 2026). Display
      # data: nothing in the engine or the freeze reads it. Must never block the
      # nightly data, so a failure here writes nothing and the rest still commits.
      - name: Build game reads (Live)
        continue-on-error: true
        run: python scripts/fetch-game-reads.py

      # This season so far, for the cards' display-only Alpha / Workhorse line
      # (4 Oct 2026). Nothing scored reads it; a failure must not block the nightly.
      - name: Build season so far (cards)
        continue-on-error: true
        run: python scripts/fetch-season-so-far.py

      # Playcaller tendency chart with the season in progress (7 Oct 2026). Display
      # only: player.html loads data/pc-fingerprint.json over the copy baked into the
      # engine, and nothing scored reads either file. FTN charting publishes with
      # play-by-play. A failure writes nothing and the chart keeps its last good file.
      - name: Build playcaller tendencies (chart)
        continue-on-error: true
        run: |
          python scripts/fetch-style-rates.py --seasons 2026 --out data/style-rates-2026.json
          python scripts/generate-style-fingerprint.py

      # Scorecard: grades DELTA's projections against real 2026 games and saves a
      # weekly snapshot of the live projections the first night each NFL week is
      # complete (never overwritten). Must never block the nightly data, so a
      # failure here is logged and the fresh data still commits below.
      - name: Build Scorecard
        continue-on-error: true
        run: node scripts/build-scorecard.js

      # Depth charts for the player card's "who is ahead of him" and Live's pre-kickoff
      # block (9 Oct 2026). Display only: feeds no score, projection or call. Until now
      # nothing ran this, so the file sat at its 23 Aug camp snapshot all season. A
      # failure writes nothing and the pages keep the last good file.
      - name: Refresh depth charts (card, Live)
        continue-on-error: true
        run: python scripts/fetch-prospect-context.py --confirm --only depth

      - name: Commit updated data
        run: |
          git config user.name "DELTA Bot"
          git config user.email "delta-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "chore: update market values, scarcity validation, player stats, and game logs [skip ci]"
            git push
          fi

      # Regression gate: recompute the Engine Audit (32/32 directional check)
      # against the freshly fetched market data and the SHIPPED engine in
      # index.html. Runs AFTER commit on purpose — fresh data always publishes;
      # a directional flip is an engine alarm (workflow fails -> email), not a
      # reason to serve stale data.
      - name: Engine Audit gate (scarcity directional validation)
        run: node scripts/engine-audit-gate.js

      # QB depth-chart alarm (2 Oct 2026). All of September the depth-chart layer fell back to
      # 2025 silently after nflverse renamed its columns. Runs AFTER commit and whatever the
      # gate above did: fresh data always publishes; an in-season fallback turns the run red
      # (-> email) instead of hiding in the log.
      - name: QB depth-chart check
        if: always()
        run: |
          python - <<'PY'
          import json, sys
          st = json.load(open('data/player-stats.json')).get('qb_roles_status') or {}
          print(f"QB roles source: {st.get('source')} | reason: {st.get('reason')} | teams: {st.get('teams')} | "
                f"snapshot: {st.get('snapshot')} | in-season: {st.get('in_season')}")
          if st.get('in_season') and st.get('source') != 'depth-chart':
              print(f"::error title=QB depth chart not read::{st.get('reason')}")
              sys.exit(1)
          PY
