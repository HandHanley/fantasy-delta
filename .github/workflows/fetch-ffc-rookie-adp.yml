name: Fetch FFC ADP (one-off)

# Pulls Fantasy Football Calculator's ADP (12-team) for 2014 to this year and commits one file per year to
# data/fixtures/ffc-<format>-adp-<year>.json — research material only (Future First, pick values, and the
# market head-to-head). Formats: rookie (default), dynasty (startup), 2qb.
# FFC's API is free for personal and commercial use; it asks for "a link or mention of some kind", which DELTA
# gives on the About page. Every file carries the attribution line.
#
# MANUAL ONLY. No schedule. One call per year, a second apart.
#
# DELIBERATELY NOT IN THE DEPLOY PAGES TRIGGER LIST — same reasoning as fetch-league-history.yml:
# nothing in the app reads data/fixtures/. If that ever changes, this workflow MUST be added there.

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Years to fetch: YYYY or YYYY-YYYY (blank = 2014 to this year)'
        required: false
        type: string
      format:
        description: 'Draft format: rookie (default), dynasty, or 2qb'
        required: false
        default: 'rookie'
        type: choice
        options: [rookie, dynasty, 2qb]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Fetch ADP
        run: |
          FMT="${{ inputs.format || 'rookie' }}"
          if [ -n "${{ inputs.years }}" ]; then
            node scripts/fetch-ffc-rookie-adp.js --format "$FMT" --years "${{ inputs.years }}"
          else
            node scripts/fetch-ffc-rookie-adp.js --format "$FMT"
          fi

      - name: Commit fixtures
        run: |
          git config user.name "DELTA Bot"
          git config user.email "delta-bot@users.noreply.github.com"
          git add data/fixtures/
          if git diff --staged --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "chore: FFC ${{ inputs.format || 'rookie' }} ADP fixtures [skip ci]"
            git push
          fi
