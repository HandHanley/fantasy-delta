<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;min-height:100vh;-webkit-font-smoothing:antialiased}

.page{max-width:680px;margin:0 auto;padding:16px 14px 48px}
/* ── Desktop: two columns ────────────────────────────────────────────────
   Below 1000px nothing changes — one column, exactly as before. Above it the
   page widens and the NFL cards flow into two columns.
   CSS columns rather than a grid, deliberately. A grid makes every row as tall
   as its tallest cell, and these cards range from under 100px to
   787px (Opportunity), so a grid would leave a 700px hole beside the tall ones.
   Columns pack vertically instead, which is what you actually want here.
   break-inside:avoid keeps a card whole; the inline-block/width:100% pair is
   what makes that reliable — on its own, break-inside is widely ignored.
   .pp-span lets one card opt back out to the full width. */
@media(min-width:1000px){
  .page{max-width:1080px}
  #tab-nfl,#tab-cfb{column-count:2;column-gap:16px}
  #tab-nfl > *,#tab-cfb > *{break-inside:avoid;display:inline-block;width:100%;margin-bottom:16px}
  #tab-nfl > .pp-span,#tab-cfb > .pp-span{column-span:all;display:block}
  /* THE TOP FOUR ARE A GRID, NOT COLUMNS (4 Oct 2026). In the column flow the
     DELTA Score + season stats stacked on one side and The Read + Start Profile
     on the other, so the two sides ended at different heights (owner: "the boxes
     aren't aligned"). Paired in rows — Score beside The Read, stats beside Start
     Profile — each pair now shares a top and a bottom. Markup order is unchanged,
     so phones (one column, below 1000px) see exactly what they did. */
  #tab-nfl > .pp-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    grid-template-areas:"ds read" "stat start";gap:16px;align-items:stretch}
  .pp-top > .pt-ds{grid-area:ds} .pp-top > .pt-read{grid-area:read}
  .pp-top > .pt-stat{grid-area:stat} .pp-top > .pt-start{grid-area:start}
  .pp-top > div{display:flex;flex-direction:column;min-width:0}
  .pp-top > div > *:last-child{flex:1;margin-bottom:0 !important}
  /* The season stats had a loose label above a bare box, so the box started lower
     than Start Profile beside it. On desktop the whole block sits in a card, so
     both cards share a top as well as a bottom. */
  .pp-top #statline-host{display:flex;flex-direction:column;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .pp-top #statline-host > *:last-child{flex:1}
}
.foot-links{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.foot-build{font-family:var(--mono);font-size:9.5px;color:var(--fog-2);letter-spacing:.02em}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.nav-back{font-size:12px;color:var(--fog);display:flex;align-items:center;gap:5px;transition:color .15s}
.nav-back:hover{color:var(--paper);text-decoration:none}
/* Tap targets (B6, 10 Oct 2026): invisible 8-10px hit area on the small links and season
   buttons, touch screens only, so nothing moves visually. */
@media (pointer:coarse){
  .nav-back,.gl-tab{position:relative}
  .nav-back::after{content:'';position:absolute;inset:-10px -6px}
  .gl-tab::after{content:'';position:absolute;inset:-8px -1px}
}
.nav-brand{font-size:11px;font-weight:700;color:var(--emerald);letter-spacing:.05em}
.hero{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.hero-hs{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--line);background:var(--panel);flex-shrink:0}
.hero-ph{width:72px;height:72px;border-radius:50%;background:var(--panel);border:1px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--fog-2)}
.hero-info{flex:1;min-width:0}
.hero-name{font-size:24px;font-weight:800;letter-spacing:-.5px;color:var(--paper);line-height:1.1;margin-bottom:5px}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px;color:var(--fog);margin-bottom:3px}
.hero-bg{font-size:11px;color:var(--fog);margin-bottom:7px}
.hero-verdict{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.verdict-badge{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.hero-vals{font-size:11px;color:var(--fog)}
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.03em}
.bs{background:var(--ink-2);color:var(--emerald)}
.bi{background:var(--ink-2);color:var(--sky)}
.bn{background:var(--line);color:var(--fog)}
.bw{background:var(--ink-2);color:var(--topaz)}
.bd{background:var(--ink-2);color:var(--coral-bri)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}

.card-sub{font-size:9px;color:var(--fog-2);font-weight:400;margin-top:2px}
.dd-section-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fog-2);margin-bottom:8px}
.mk-pills{display:flex;gap:4px;flex-shrink:0}
.mk-pill{font-size:10px;font-weight:700;padding:4px 9px;border-radius:10px;border:1px solid var(--line);background:var(--ink-2);color:var(--fog);cursor:pointer;white-space:nowrap;font-family:inherit}
.mk-pill.on{color:var(--teal-br);border-color:var(--teal-br)}
.mk-head{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;margin:10px 0 6px}

/* Phones: the date+rank line always takes its own row, so pressing the chart (which adds
   the date) never pushes the chart down under the finger. */
@media (max-width:480px){ .mk-rank{flex-basis:100%;margin-left:0} }

@media(max-width:600px){.gl-tbl{font-size:9px!important}.gl-tbl th,.gl-tbl td{padding:2px 3px!important}
/* game-log view tabs: 6 pills must hold ONE line. At default sizing the strip needs
   ~346px but a 402pt phone only gives 340px of card content, so "Trend" wrapped.
   Tightening type + padding + gap frees ~70px, which keeps all six inline down to
   ~350pt. Container keeps flex-wrap as a safety net below that. */
.gl-tab{font-size:9.5px!important;padding:3px 5px!important;margin-right:3px!important}}
.dd-prog-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.dd-prog-label{font-size:10px;color:var(--fog);width:36px;flex-shrink:0}
.dd-prog-bar{flex:1;height:5px;background:var(--panel);border-radius:3px;overflow:hidden}
.dd-prog-fill{height:100%;border-radius:3px}
.dd-prog-val{font-size:10px;font-weight:600;width:32px;text-align:right;flex-shrink:0}
/* ── Shared board styling ─────────────────────────────────────────────────
   Lifted from index.html so this page reads as the same product. Opt in with
   .dl-board. .dl-pp- is this page's density modifier — the same pattern Roster
   (.dl-mt-) and Power Rankings (.dl-pw-) use, because a stat table inside a
   card cannot carry the reading-board 42px row. */
.dl-b-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.dl-board{width:auto;min-width:100%;border-collapse:collapse}
.dl-board thead th{font-family:var(--sans);font-size:10.5px;font-weight:600;
  letter-spacing:0;text-transform:none;color:var(--fog-2);
  padding:0 10px 9px;border-bottom:none;white-space:nowrap;cursor:default}
.dl-board thead th:hover{color:var(--fog-2)}
.dl-board tbody td{height:42px;padding:0 10px;font-size:13px;
  border-bottom:1px solid var(--line);vertical-align:middle}
.dl-board tbody tr:hover td{background:var(--row-hi)}
.dl-board th.dl-b-r,.dl-board td.dl-b-r{text-align:right}
.dl-board th.dl-b-c,.dl-board td.dl-b-c{text-align:center}

/* Figures right, first column left. These tables were built that way and every
   generated cell depends on it, so it stays a default here rather than being
   rewritten as per-cell .dl-b-r on four tables' worth of markup. */
.dl-pp-tbl{font-family:var(--mono);font-size:12px}
.dl-pp-tbl thead th{font-size:9.5px;letter-spacing:.04em;text-align:right;padding:0 8px 7px}
.dl-pp-tbl thead th:first-child{text-align:left}
.dl-pp-tbl tbody td{height:30px;text-align:right;padding:0 8px;font-size:inherit;
  border-bottom:1px solid var(--line)}
.dl-pp-tbl tbody td:first-child{text-align:left;color:var(--fog);font-weight:600;font-family:var(--sans)}
/* Left is the board default but the RIGHT default on this page, so a left-aligned cell
   that is not the first one needs saying. Named to sit beside .dl-b-r / .dl-b-c. */
.dl-board th.dl-b-l,.dl-board td.dl-b-l{text-align:left}
/* The row for the player whose page you are on. This was tinted with an emerald wash,
   which quietly invents a signal: --emerald means BUY everywhere else in the product, so
   a green row here reads as a verdict rather than "you are here". --row-hi is the token
   that already means highlighted row, and it follows the accent theme. */
.dl-pp-tbl tbody tr.dl-pp-me td{background:var(--row-hi)}
.dl-pp-tbl tbody tr.dl-pp-me td:first-child{color:var(--paper)}
/* College game log: up to nine columns, so it stays tighter than the season tables
   and the opponent column — the least valuable field — gives up space first.
   Scoped through .dl-pp-tbl so it outranks the density rules above; a bare .cgl td
   loses to .dl-pp-tbl tbody td on specificity and the tightening silently stops. */
.dl-pp-tbl.cgl{font-size:11px}
.dl-pp-tbl.cgl thead th,.dl-pp-tbl.cgl tbody td{padding:4px 5px}
.dl-pp-tbl.cgl tbody td{height:auto}
.cgl .opp{max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:600px){
  .dl-pp-tbl.cgl{font-size:9.5px}
  .dl-pp-tbl.cgl thead th,.dl-pp-tbl.cgl tbody td{padding:3px 3px}
  .cgl .opp{max-width:56px;font-size:9px}
}
@media(max-width:400px){
  .dl-pp-tbl.cgl{font-size:9px}
  .cgl .opp{max-width:46px;font-size:8.5px}
}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-box{background:var(--ink-2);border-radius:6px;padding:8px 10px;text-align:center}

@media(max-width:480px){.hero-name{font-size:20px}.hero-hs,.hero-ph{width:58px;height:58px}}
/* ===================== DELTA BRAND LAYER ===================== */
:root{
  --ink:#0A0F1A; --ink-2:#0D1420; --panel:#111A28; --line:#1E2A3A;
  --teal-br:#2DD4BF; --teal:#14B8A6; --emerald:#10B981; --emerald-dp:#047857;
  --mint:#CCFBF1; --fog:#8CA0B3; --fog-2:#5C7080; --paper:#EAF0F4;
  --coral:#E05745; --topaz:#E0B34D;
  /* low-alpha signal tints so chips sit correctly on --ink */
  --emerald-tint:rgba(16,185,129,.14); --emerald-bri:#34D399;
  --coral-tint:rgba(224,87,69,.13);  --coral-bri:#EA7A66;
  --topaz-tint:rgba(224,179,77,.14);
  --teal-tint:rgba(45,212,191,.12);     --teal-soft:rgba(45,212,191,.07);
  --row-hi:rgba(45,212,191,.055);
  /* support hues for categorical/info needs (not signals): info & comparison-B → sky, chart series → violet */
  --sky:#6BB6E0;    --sky-tint:rgba(107,182,224,.14);  --sky-dp:#134e7a;
  --violet:#9B8AF0; --violet-tint:rgba(155,138,240,.14);
  --sans:'Nunito Sans','Avenir Next',system-ui,'Segoe UI',sans-serif;
  --mono:'SFMono-Regular',ui-monospace,'JetBrains Mono','Roboto Mono',Menlo,Consolas,monospace;
  --geo:'Century Gothic','Futura','Questrial','Josefin Sans','Nunito Sans',sans-serif;
}
body{font-family:var(--sans)}
a{color:var(--teal-br)}
.nav{border-bottom:1px solid var(--line)}
.nav-back{color:var(--fog)}
.nav-back:hover{color:var(--paper)}
.hero-name{font-family:var(--sans)}
.hero-meta,.hero-bg,.hero-vals{font-family:var(--sans)}
.verdict-badge{font-family:var(--sans)}
/* badges → brand semantics: buy=emerald, hold=slate, sell=coral */
.badge{font-family:var(--sans)}
.bs{background:var(--emerald-tint);color:var(--emerald-bri)}
.bi{background:rgba(16,185,129,.09);color:var(--emerald)}
.bn{background:var(--line);color:var(--fog)}
.bw{background:var(--coral-tint);color:var(--coral)}
.bd{background:rgba(224,87,69,.20);color:var(--coral-bri)}
.card{background:var(--panel);border:1px solid var(--line)}
.card-label,.dd-section-label{font-family:var(--sans);color:var(--fog-2)}
.card-sub,.freshness{color:var(--fog-2)}
.stat-box{background:var(--ink-2)}
.stat-val{font-family:var(--mono)}
.stat-lbl{font-family:var(--sans);color:var(--fog-2)}
.dd-prog-bar{background:var(--line)}
.dd-prog-label{font-family:var(--sans)}
.dd-prog-val{font-family:var(--mono)}
.bdr-row{border-bottom:1px solid var(--line);font-family:var(--sans)}
.ripple-card{background:var(--ink-2)}
.scout-text{font-family:var(--sans)}
.state-msg{color:var(--fog-2)}
</style>
<script>
/* Apply the saved accent theme BEFORE first paint (no flash of the default). Self-contained
   on purpose: this runs before delta-engine.js exists. */
(function(){try{
  /* MUST match DL_THEMES in index.html. SIX copies of this table exist and all must move
     together: DL_THEMES itself, and this pre-paint block in index.html, player.html,
     cfb-player.html, privacy.html and terms.html. Each one runs before any app code exists,
     so none of them can read the real table. A theme missing from a copy silently renders
     that whole page in teal — cobalt and orchid were absent from privacy.html and terms.html
     for months for exactly this reason. The six Settings swatch dots in index.html hardcode
     the same values a seventh time. */
  var T={teal:['#2DD4BF','#14B8A6'],violet:['#9B8AF0','#7C6FD6'],sky:['#6BB6E0','#4E96BE'],
         cobalt:['#5B8DEF','#3F6FD1'],orchid:['#D96BC4','#BE55AA'],slate:['#94A3B8','#64748B']};
  var t=T[localStorage.getItem('delta_theme')]||T.teal, s=document.documentElement.style;
  function rgba(h,a){var b=parseInt(h.slice(1),16);return 'rgba('+((b>>16)&255)+','+((b>>8)&255)+','+(b&255)+','+a+')';}
  s.setProperty('--teal-br',t[0]); s.setProperty('--teal',t[1]);
  s.setProperty('--teal-tint',rgba(t[0],.12)); s.setProperty('--teal-soft',rgba(t[0],.07));
  s.setProperty('--row-hi',rgba(t[0],.055));
}catch(e){}})();
</script>

        <defs>
          <!-- The mark's gradient is FIXED. BRAND.md: never recolor it. These were tokens,
               which meant --teal-br followed the accent theme while --emerald did not, so on

               facet — a two-tone logo on one page only. index.html and cfb-player.html both
               hardcode these; player.html was the odd one out. Do not re-tokenise. -->
          <linearGradient id="nL" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#14B8A6"/></linearGradient>
          <linearGradient id="nR" x1=".55" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#047857"/></linearGradient>
        </defs>
        <path d="M64 22 L24 106 L64 106 Z" fill="url(#nL)"/>
        <path d="M64 22 L64 106 L104 106 Z" fill="url(#nR)"/>
        <line x1="64" y1="25" x2="64" y2="106" stroke="#CCFBF1" stroke-width="1.4" stroke-opacity=".42"/>

          <line x1="58" y1="52" x2="70" y2="52"/><line x1="55" y1="70" x2="73" y2="70"/><line x1="52" y1="88" x2="76" y2="88"/>

/* Two build markers, reported not policed — identical to index.html's dlBuildStamp().

function ppgClr(v) {
  return v >= 18 ? 'var(--emerald)' : v >= 14 ? 'var(--sky)' : v >= 10 ? 'var(--topaz)' : v > 0 ? 'var(--coral)' : 'var(--line)';

// ── Hero ──────────────────────────────────────────────────────────────────────
function buildHeroHTML(p) {
  const ct = CONTRACTS.find(c => c.n === p.n);
  const dp = DRAFT_PICKS[p.n];
  const team = (typeof AL !== 'undefined' && AL[p.t]) ? AL[p.t] : p.t;

  const vc = vt.includes('strong buy') ? 'var(--emerald)' : vt === 'buy' ? 'var(--emerald)'
    : vt === 'hold' ? 'var(--paper)' : vt.includes('strong sell') ? 'var(--coral-bri)' : 'var(--coral)';
  const mv = mvAsset(p);
  const adjP = getAdjProj(p);
  const hs = (typeof HEADSHOTS !== 'undefined') && HEADSHOTS[p.n];
  const hsHtml = hs
    ? `<img class="hero-hs" src="${hs}" alt="${p.n}" onerror="heroPhFallback(this)">`
    : `<div class="hero-ph">${HERO_PH_SVG}</div>`;

  // College + draft on same muted line, no accent color for draft pick
  const bgParts = [];

  if (dp) bgParts.push(`${dp.y} Rd${dp.r} Pick ${dp.p}`);
  const bgLine = bgParts.length ? `<div class="hero-bg">${bgParts.join(' · ')}</div>` : '';

  // Season stat line is rendered separately (after the DELTA Score) — see buildStatLineHTML.

  return `<div class="hero">

    <div class="hero-info">
      <div class="hero-name">${typeof injBadge==='function'?injBadge(p.n):''}${p.n} <span data-name="${p.n}" onclick="heroStar(this)" style="cursor:pointer;font-size:17px;vertical-align:2px;color:${dwHas(p.n)?'var(--topaz)':'var(--fog-2)'}">${dwHas(p.n)?'\u2605':'\u2606'}</span></div>
      <div class="hero-meta">
        <span class="badge bn">${p.pos}</span>
        <span>${team}</span>
        <span>Age ${p.a.toFixed(1)}</span>
        ${ct ? `<span style="color:var(--fog)">Thru ${ct.end}${ct.end<=SEASON_YEAR?' ⚠':''}${fifthYearNote(p,ct)?' +opt':''}</span>` : ''}
      </div>
      ${bgLine}
      ${(function(){ const r=(typeof dlLeagueReach==='function')?dlLeagueReach(p.n,p.pos||p.p):null, t=dlLeagueReachText(r);
         return t?'<div class="hero-bg" title="'+dlLeagueReachTitle(r).replace(/"/g,'&quot;')+'">'+t+'</div>':''; })()}
      <div class="hero-verdict">
        <span class="verdict-badge" style="color:${vc}">${vt}</span>
        <span class="hero-vals">Mkt ${(p.ktcEff!=null?p.ktcEff:(p.ktc!=null?p.ktc:0)).toLocaleString()} · Model ${mv>=19999?'19,999+':(mv!=null?mv:0).toLocaleString()} · Proj ${(adjP!=null?adjP:0).toFixed(1)} PPG</span>
      </div>
      <div id="hero-pctx" style="margin-top:6px"></div>

  </div>`;
}

// Season stat line — raw counting stats. DELTA is rate-driven, so these were never shown;
// they ground every derived metric. Rendered AFTER the DELTA Score so the signature metric
// leads and the stats read as its evidence — matching the college page's order.
/* PLAYCALLER TENDENCIES DATA (7 Oct 2026) — DISPLAY ONLY.
   data/pc-fingerprint.json is rebuilt nightly by scripts/generate-style-fingerprint.py
   (completed seasons + the season in progress, weighted by plays). It replaces the
   copy of PC_FINGERPRINT baked into delta-engine.js, which stays as the fallback if
   the file is missing or malformed. Only buildSchemeHTML reads it — only this page
   draws that chart — so index.html and the freeze deliberately do not load it. */
function loadPCFingerprint() {
  return fetch('data/pc-fingerprint.json', { cache: 'no-cache' })
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      const t = j && j.teams;
      if (!t || typeof PC_FINGERPRINT === 'undefined') return;
      const vals = Object.values(t);
      if (vals.length < 28 || !vals.every(x => x && x.pc && x.d)) return;
      Object.keys(PC_FINGERPRINT).forEach(k => delete PC_FINGERPRINT[k]);
      Object.assign(PC_FINGERPRINT, t);
    })
    .catch(() => {});
}

/* SEASON IN PROGRESS (owner, 7 Oct 2026) — DISPLAY ONLY.
   Completed seasons come from PLAYER_STATS, whose seasons are pinned to finished
   ones so the DELTA Score never sees a partial year. The season being played is
   summed here from the game logs, which refresh nightly, and is NEVER written into
   PLAYER_STATS. Field map checked 7 Oct 2026: summing 2025's logs reproduces the
   official 2025 totals for 316 players. Games follow the locked DNP rule (at least
   one offensive snap), so a game count can differ by one from other sites. */
function slLiveSeason() { return (typeof SEASON_YEAR !== 'undefined') ? String(SEASON_YEAR) : null; }
function slLiveStats(name) {
  const y = slLiveSeason();
  if (!y) return null;
  const rows = ((typeof GAMELOGS !== 'undefined' && GAMELOGS && GAMELOGS[name]) || [])
    .filter(g => String(g.s) === y && !g.up && !g.dnp);
  if (!rows.length) return null;
  const sum = f => rows.reduce((a, g) => a + (+g[f] || 0), 0);
  return { games: rows.length, pass_yds: sum('py'), pass_td: sum('pt'), pass_int: sum('pi'),
           rush_att: sum('car'), rush_yds: sum('ry'), rush_td: sum('rt'),
           targets: sum('tgt'), rec: sum('rec'), rec_yds: sum('rey'), rec_td: sum('ret'),
           fum_lost: sum('fl') };
}
function slYears(name) {
  const all = (typeof PLAYER_STATS !== 'undefined' && PLAYER_STATS[name]) || {};
  const yrs = Object.keys(all).filter(y => /^\d{4}$/.test(y) && all[y] && (all[y].games || 0) > 0);
  const live = slLiveSeason();
  if (live && yrs.indexOf(live) < 0 && slLiveStats(name)) yrs.push(live);
  return yrs.sort();
}
function slIsLive(name, season) {
  const all = (typeof PLAYER_STATS !== 'undefined' && PLAYER_STATS[name]) || {};
  return season === slLiveSeason() && !(all[season] && (all[season].games || 0) > 0);
}

function buildStatLineHTML(p) {
  // Only seasons the player actually played. The pipeline emits a null placeholder for
  // seasons before a player entered the league — those must not get a pill. The season
  // in progress joins from the game logs (slYears).
  const yrs = slYears(p.n);
  if (!yrs.length) return '';
  _slPlayer = p; _slSeason = yrs[yrs.length - 1];
  return `<div id="statline-host" style="margin-bottom:12px">${statLineInner(p, _slSeason, yrs)}</div>`;
}
let _slPlayer = null, _slSeason = null;
function statLineSeason(y) {
  if (!_slPlayer) return;
  _slSeason = String(y);
  const yrs = slYears(_slPlayer.n);
  const host = document.getElementById('statline-host');
  if (host) host.innerHTML = statLineInner(_slPlayer, _slSeason, yrs);
}
function statLineInner(p, season, yrs) {
  const live = slIsLive(p.n, season);
  const s = live ? slLiveStats(p.n) : ((typeof PLAYER_STATS !== 'undefined' && PLAYER_STATS[p.n]) || {})[season];
  const nz = v => (v == null || v === 0) ? '—' : v.toLocaleString();
  const pills = yrs.length > 1
    ? `<div style="display:flex;flex-wrap:wrap;gap:6px">` + yrs.map(y =>
        `<button onclick="statLineSeason('${y}')" style="font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:14px;cursor:pointer;`
        + `border:1px solid ${y === season ? 'var(--teal-br)' : 'var(--line)'};background:${y === season ? 'var(--ink)' : 'transparent'};`
        + `color:${y === season ? 'var(--teal-br)' : 'var(--fog)'}">${y}</button>`).join('') + `</div>`
    : '';
  // Same label for every year, the season in progress included (owner, 7 Oct).
  const label = `${season} SEASON`;
  // Wraps on a phone: five season pills do not fit beside the title at 390px.
  const head = `<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;margin:0 0 8px">`
    + `<div style="font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--fog-2)">${label}</div>${pills}</div>`;
  if (!s) return head + `<div style="font-size:11.5px;color:var(--fog-2);padding:10px 0">No stats on record for ${season}.</div>`;
  // Position-appropriate stat rows. Rows of three; a rushing row appears for a
  // receiver only when he actually has carries, so the grid never shows dead cells.
  let cells;
  if (p.pos === 'QB') {
    cells = [['Pass yds', nz(s.pass_yds)], ['Pass TD', nz(s.pass_td)], ['INT', nz(s.pass_int)],
             ['Rush yds', nz(s.rush_yds)], ['Rush TD', nz(s.rush_td)], ['Fumbles lost', s.fum_lost == null ? '—' : s.fum_lost]];
  } else if (p.pos === 'RB') {
    cells = [['Carries', nz(s.rush_att)], ['Rush yds', nz(s.rush_yds)], ['Rush TD', nz(s.rush_td)],
             ['Rec', nz(s.rec)], ['Rec yds', nz(s.rec_yds)], ['Rec TD', nz(s.rec_td)]];
  } else {
    cells = [['Targets', nz(s.targets)], ['Rec', nz(s.rec)], ['Rec yds', nz(s.rec_yds)],
             ['Rec TD', nz(s.rec_td)], ['Yds/rec', s.rec ? (s.rec_yds / s.rec).toFixed(1) : '—'],
             ['Games', nz(s.games)]];
    if ((s.rush_att || 0) > 0) {
      cells = cells.concat([['Carries', nz(s.rush_att)], ['Rush yds', nz(s.rush_yds)], ['Rush TD', nz(s.rush_td)]]);
    }
  }
  return head
    + `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden">`
    + cells.map(c => `<div style="background:var(--panel);padding:10px 11px"><div style="font-size:9.5px;color:var(--fog-2);text-transform:uppercase;letter-spacing:.04em">${c[0]}</div>`
        + `<div style="font-size:16px;font-weight:700;font-family:var(--mono,monospace);margin-top:2px">${c[1]}</div></div>`).join('')
    + `</div>`;
}

// ── DELTA Score Arc ──────────────────────────────────────────────────────────
function buildDSTrajectoryHTML(p) {
  if (isNFLRookie(p)) {
    // A rookie's score is a draft-capital prior — there is no prior season to
    // estimate and no basis to roll one forward. Fabricating a year-2 score
    // from a conservative seed reads as a bust call; the honest display is
    // the current prior and a note that the trajectory unlocks with real games.
    return `<div class="card">
      <div class="card-label" style="margin-bottom:8px">DELTA Score Trajectory</div>
      <div style="display:flex;align-items:baseline;gap:10px">
        <span style="font-size:26px;font-weight:800;color:${dsColor(p.dsScore)}">${p.dsScore}</span>
        <span style="font-size:10px;color:var(--fog)">2025 — draft-capital prior</span>
      </div>
      <div style="font-size:9.5px;color:var(--fog-2);margin-top:8px;line-height:1.5">
        Rookie — no NFL seasons to chart. The score is a capital-based prior; the trajectory unlocks once real games replace it.
      </div>
    </div>`;
  }
  const ds = p.dsScore;
  if (ds == null) return '';

  /* CALL THE REAL SCORER. These two estimates used to be computed here as
     pA + pP + pO + pC — the RAW axis maxima, 25/32/33/10 — while the 2025 score
     sitting between them comes from calcDynastyScore's WEIGHTED 15/45/30/10, with
     the youth multiplier, the RB opportunity downweight and post-clip scarcity.
     Two different scales on one chart: the arrows were reading partly as movement
     in the player and partly as the difference between two formulas. Feeding shifted
     inputs through the real function is the only version that cannot drift again —
     if the weights change, all three numbers change together.

     What is shifted, and nothing else: age, and which seasons count as recent
     production. Opportunity and contract stay at today's values (the footnote says
     so) because there is no honest way to age them. p.ppg22 is not a field any RAW
     row carries, so 2024's third season is genuinely absent and passes as 0 — the
     same as it did before. */
  const at = (age, r1, r2, r3, games) =>
    calcDynastyScore({ ...p, a: age, ppg25: r1 || 0, ppg24: r2 || 0, ppg23: r3 || 0, g25: games });

  const ds2024 = at((p.a || 22) - 1, p.ppg24, p.ppg23, 0,        p.g24 || 16);
  const ds2026 = at((p.a || 22) + 1, p.proj || p.ppg25, p.ppg25, p.ppg24, p.g25 || 0);

  const dsC = dsColor(ds);
  const d4C = dsColor(ds2024);
  const d6C = dsColor(ds2026);

  const bar = (score, color) => `
    <div style="height:4px;background:var(--panel);border-radius:3px;overflow:hidden;margin-bottom:4px">
      <div style="width:${Math.round((score/100)*100)}%;height:100%;background:${color};border-radius:3px"></div>
    </div>`;

  const pt = (yr, score, color, note) => `
    <div style="flex:1;text-align:center">
      <div style="font-size:9px;color:var(--fog-2);margin-bottom:5px">${yr}</div>
      ${bar(score, color)}
      <div style="font-size:24px;font-weight:800;line-height:1;color:${color}">${score}</div>
      <div style="font-size:9px;color:var(--fog-2);margin-top:3px">${note}</div>
    </div>`;

  const arr = (from, to) => {
    const c = to > from ? 'var(--emerald)' : to < from ? 'var(--coral-bri)' : 'var(--fog)';
    const sym = to > from ? '↑' : to < from ? '↓' : '→';
    return `<div style="font-size:18px;color:${c};padding-top:18px;flex-shrink:0">${sym}</div>`;
  };

  return `<div class="card">
    <div class="card-label" style="margin-bottom:2px">DELTA Score Arc</div>
    <div class="card-sub" style="margin-bottom:14px">Estimated 2024 · Current 2025 · Projected 2026</div>
    <div style="display:flex;align-items:flex-start;gap:8px">
      ${pt('2024 est', ds2024, d4C, 'approx')}
      ${arr(ds2024, ds)}
      ${pt('2025', ds, dsC, 'current')}
      ${arr(ds, ds2026)}
      ${pt('2026 proj', ds2026, d6C, 'if proj holds')}
    </div>
    <div style="font-size:9px;color:var(--fog-2);margin-top:10px;text-align:center">
      2024 uses age−1 and prior production · opportunity &amp; contract approximated from current values
    </div>
  </div>`;
}

// ── PPG Trend ─────────────────────────────────────────────────────────────────
function buildProductionHTML(p) {
  const years = [
    { yr: '2022', ppg: p.ppg22 || 0, g: p.g22 || null },
    { yr: '2023', ppg: p.ppg23 || 0, g: p.g23 || null },
    { yr: '2024', ppg: p.ppg24 || 0, g: p.g24 || null },
    { yr: '2025', ppg: p.ppg25 || 0, g: p.g25 || null },
  ].filter(y => y.ppg > 0);
  if (!years.length) return '';

  const posAvg = DS_AVG[p.pos] || 12;
  const maxPpg = Math.max(...years.map(y => y.ppg), 1);
  const barH = 56;

  // Three separate rows: values, bars, labels
  const vals = years.map(y =>
    `<div style="flex:1;text-align:center;font-size:10px;font-weight:600;color:${ppgClr(y.ppg)}">${y.ppg.toFixed(1)}</div>`
  ).join('');

  const bars = years.map(y => {
    const h = Math.max(8, Math.round((y.ppg / maxPpg) * barH));
    return `<div style="flex:1;display:flex;align-items:flex-end">
      <div style="width:100%;height:${h}px;background:${ppgClr(y.ppg)};border-radius:2px 2px 0 0"></div>
    </div>`;
  }).join('');

  const lbls = years.map(y =>
    `<div style="flex:1;text-align:center;font-size:9px;color:var(--fog-2)">${y.yr.slice(2)}</div>`
  ).join('');

  const tableRows = years.map(y => {
    const diff = (y.ppg - posAvg).toFixed(1);
    const dc = diff > 0 ? 'var(--emerald)' : diff < 0 ? 'var(--coral-bri)' : 'var(--fog)';
    return `<tr>
      <td>${y.yr}</td>
      <td style="color:${ppgClr(y.ppg)};font-weight:600">${y.ppg.toFixed(1)}</td>
      <td style="color:var(--fog)">${y.g != null && y.g > 0 ? y.g : '—'}</td>
      <td style="color:${dc}">${diff > 0 ? '+' : ''}${diff}</td>
    </tr>`;
  }).join('');

  return `<div class="card">
    <div class="card-label" style="margin-bottom:2px">PPG Trend</div>
    <div class="card-sub" style="margin-bottom:10px">Adjusted for current scoring format</div>
    <div style="display:flex;gap:4px;margin-bottom:2px">${vals}</div>
    <div style="display:flex;gap:4px;height:${barH}px">${bars}</div>
    <div style="display:flex;gap:4px;margin-top:3px;margin-bottom:10px">${lbls}</div>
    <table class="dl-board dl-pp-tbl">
      <thead><tr>
        <th>Season</th><th>PPG</th><th>Games</th>
        <th title="PPG vs current-season positional average — same value used across all years">vs pos avg *</th>
      </tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
    <div style="font-size:9px;color:var(--fog-2);margin-top:6px">* Pos avg = ${posAvg} PPG (current-season average, applied flat across all years) · Games load from nightly pipeline</div>
  </div>`;
}

// ── EPA / Efficiency ──────────────────────────────────────────────────────────
// QB TD% trend — DISPLAY ONLY. Context for the manager; never feeds the DELTA Score.
// Research (2017-25, 203 QB pairs): ~69% of the gap between a season's TD% and the QB's
// own baseline is given back the next year. It did NOT add lift to fantasy projection
// beyond production DELTA already models — so we show it, we don't score it.
function buildTDPctHTML(p) {
  if (p.pos !== 'QB' || typeof PLAYER_STATS === 'undefined' || !PLAYER_STATS[p.n]) return '';
  const LG = 4.6, GIVEBACK = 0.69;
  const st = PLAYER_STATS[p.n];
  const yrs = ['2022', '2023', '2024', '2025'];
  const rows = yrs.map(y => {
    const s = st[y];
    const att = (s && +s.pass_att) || 0, td = (s && +s.pass_td) || 0;
    return { yr: y, v: att >= 100 ? (100 * td / att) : 0, att };   // 100-att floor: a cameo has no meaningful rate
  }).filter(x => x.v > 0);
  if (!rows.length) return '';

  let cTd = 0, cAtt = 0;
  yrs.forEach(y => {
    const s = st[y];
    if (s && +s.pass_att >= 100) { cTd += (+s.pass_td || 0); cAtt += (+s.pass_att || 0); }
  });
  const baseline = cAtt > 0 ? (100 * cTd / cAtt) : LG;   // attempt-weighted, not a mean of rates
  const latest = rows[rows.length - 1];
  const r1 = v => Math.round(v * 10) / 10;   // moved up: was declared after first use (TDZ crash on QB pages)
  const gap = r1(latest.v) - r1(baseline);
  const proj = latest.v - gap * GIVEBACK;
  const maxV = Math.max(...rows.map(x => x.v), baseline, 6);
  const barH = 46;
  // colored vs HIS OWN baseline — a high TD% is not "good", it's "hot"
  // Grade on DISPLAYED (1-dp) numbers so two seasons that both read e.g. "7.0%" can never
  // get different colors from a float straddling the threshold.
  const HOT = 1.0;
  const clr = v => (r1(v) - r1(baseline)) >= HOT ? 'var(--topaz)' : (r1(v) - r1(baseline)) <= -HOT ? 'var(--sky)' : 'var(--fog-2)';

  const vals = rows.map(x => `<div style="flex:1;text-align:center;font-size:10px;color:var(--fog)">${x.v.toFixed(1)}%</div>`).join('');
  const bars = rows.map(x => `<div style="flex:1;display:flex;align-items:flex-end;justify-content:center">
      <div style="width:100%;border-radius:3px 3px 0 0;background:${clr(x.v)};height:${Math.max(8, Math.round(x.v / maxV * barH))}px"></div>
    </div>`).join('');
  const lbls = rows.map(x => `<div style="flex:1;text-align:center;font-size:9px;color:var(--fog-2)">'${x.yr.slice(2)}</div>`).join('');

  let note = '';
  if (Math.abs(gap) >= HOT && rows.length >= 2) {
    const hot = gap > 0;
    note = `<div style="font-size:11px;line-height:1.6;color:var(--fog);margin-top:10px;padding:8px 10px;background:var(--ink-2);border-left:2px solid ${hot ? 'var(--topaz)' : 'var(--sky)'};border-radius:0 6px 6px 0">
      TD rate <b style="color:${hot ? 'var(--topaz)' : 'var(--sky)'}">${latest.v.toFixed(1)}%</b> is
      <b style="color:${hot ? 'var(--topaz)' : 'var(--sky)'}">${Math.abs(gap).toFixed(1)} pts ${hot ? 'above' : 'below'}</b>
      his own baseline of ${baseline.toFixed(1)}%.
      ${hot ? 'Historically ~69% of that gap is given back' : 'Rates this far below a QB\'s norm tend to bounce back'} —
      a repeat would look closer to <b style="color:var(--paper)">${proj.toFixed(1)}%</b>.
    </div>`;
  }

  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
      <div>
        <div class="card-label" style="margin-bottom:2px">TD% Trend</div>
        <div class="card-sub">Passing TDs per attempt · context only, not scored</div>
      </div>
      <div style="text-align:right;line-height:1.4;flex-shrink:0">
        <div style="font-size:11px;color:var(--fog)">Baseline <b style="color:var(--paper);font-family:var(--mono)">${baseline.toFixed(1)}%</b></div>
        <div style="font-size:11px;color:var(--fog-2)">Lg Avg. <b style="font-family:var(--mono)">${LG}%</b></div>
      </div>
    </div>
    <div style="display:flex;gap:4px;margin-bottom:2px">${vals}</div>
    <div style="display:flex;gap:4px;height:${barH}px">${bars}</div>
    <div style="display:flex;gap:4px;margin-top:3px">${lbls}</div>
    <div style="display:flex;gap:12px;margin-top:7px;font-size:10px;color:var(--fog-2)">
      <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--topaz);margin-right:4px"></span>above his norm — due to regress</span>
      <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--sky);margin-right:4px"></span>below — due to bounce back</span>
    </div>
    ${note}
  </div>`;
}

function buildEPAHTML(p) {
  // Receivers' numbers here are yards per route run (DELTA's hand-entered receiver measure),
  // not EPA — the card called them "Receiving EPA per play" and scaled them as EPA, so every
  // receiver's bar ran full. Labelled and scaled for what they are since 4 Oct 2026.
  const isRec = p.pos === 'WR' || p.pos === 'TE';
  const title = p.pos === 'QB' ? 'EPA Per Dropback' : p.pos === 'RB' ? 'EPA Per Carry' : 'Yards Per Route Run';
  const sublabel = isRec
    ? 'Receiving yards per route run by season — DELTA\u2019s receiver efficiency measure'
    : `${p.pos === 'QB' ? 'Passing' : 'Rushing'} EPA by season — how much each play changed the points the drive was expected to score`;

  const epas = [
    { yr: '2022', v: p.e22 || 0 },
    { yr: '2023', v: p.e23 || 0 },
    { yr: '2024', v: p.e24 || 0 },
    { yr: '2025', v: p.e25 || 0 },
  ].filter(x => x.v !== 0);

  if (!epas.length) return '';

  // Absolute scale: 0.25 EPA/play fills the bar fully (elite level for any position)
  const SCALE = isRec ? 3.0 : 0.25;

  const getClr = v => {
    if (isRec) return v >= 1.8 ? 'var(--emerald)' : v >= 1.4 ? 'var(--sky)' : v >= 1.0 ? 'var(--topaz)' : 'var(--coral)';
    const a = Math.abs(v);
    if (v >= 0) return a >= 0.12 ? 'var(--emerald)' : a >= 0.04 ? 'var(--emerald-bri)' : 'var(--topaz)';
    else        return a >= 0.12 ? 'var(--coral)' : a >= 0.04 ? 'var(--coral-bri)' : 'var(--topaz)';
  };

  const rows = epas.map(x => {
    const pct = Math.min(100, Math.round((Math.abs(x.v) / SCALE) * 100));
    const clr = getClr(x.v);
    const isPos = x.v >= 0;
    const sign = (!isRec && x.v > 0) ? '+' : '';   // yards per route run is never negative: no sign
    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--panel)">
      <div style="font-size:10px;color:var(--fog);width:26px;flex-shrink:0">${x.yr.slice(2)}</div>
      <div style="flex:1;display:flex;justify-content:flex-end;align-items:center;height:8px">
        ${!isPos ? `<div style="width:${pct}%;height:100%;background:${clr};border-radius:3px 0 0 3px"></div>` : ''}
      </div>
      <div style="width:2px;height:14px;background:var(--fog-2);flex-shrink:0;border-radius:1px"></div>
      <div style="flex:1;display:flex;justify-content:flex-start;align-items:center;height:8px">
        ${isPos ? `<div style="width:${pct}%;height:100%;background:${clr};border-radius:0 3px 3px 0"></div>` : ''}
      </div>
      <div style="font-size:11px;font-weight:600;color:${clr};width:42px;text-align:right">${sign}${x.v.toFixed(2)}</div>
    </div>`;
  }).join('');

  const trendClr = p.epaTr === 'up' ? 'var(--emerald)' : p.epaTr === 'down' ? 'var(--coral)' : 'var(--fog)';
  const trendTxt = p.epaTr === 'up' ? '↑ Improving' : p.epaTr === 'down' ? '↓ Declining' : '→ Flat';

  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
      <div>
        <div class="card-label" style="margin-bottom:2px">${title}</div>
        <div class="card-sub">${sublabel}</div>
      </div>
      ${p.epaTr ? `<span style="font-size:10px;font-weight:600;color:${trendClr};flex-shrink:0;margin-left:10px">${trendTxt}</span>` : ''}
    </div>
    ${effSoFarSlot(p)}
    ${rows}
    ${isRec ? '' : `<div style="display:flex;justify-content:space-between;font-size:9px;color:var(--fog-2);margin-top:6px;padding:0 34px 0 0">
      <span>← below break-even</span>
      <span>above break-even →</span>
    </div>`}
  </div>`;
}

// ── Opportunity ───────────────────────────────────────────────────────────────
function buildOpportunityHTML(p) {
  const oppSc = getOppScore(p.n, p.pos);
  if (!oppSc) {
    // QBs (and anyone ungraded for opportunity) still get the scheme context —
    // popup ⊆ full card: nothing shown in the popup may be missing here.
    if (p.sys == null) return '';
    return `<div class="card">
      <div class="card-label" style="margin-bottom:8px">Offense / Scheme</div>
      ${buildSchemeHTML(p)}
    </div>`;
  }
  const st25 = (typeof PLAYER_STATS !== 'undefined') && PLAYER_STATS[p.n] && PLAYER_STATS[p.n]['2025'];
  const isWR = p.pos === 'WR' || p.pos === 'TE';
  // No fallback. oppScoreColor always exists — delta-engine.js loads before this runs —
  // and the fallback that used to sit here carried its own thresholds (88/70/55) which
  // had drifted from the real ones (88/75/60). A second copy of a live rule that nobody
  // can reach is worse than no copy: it cannot be caught by testing and it will be read
  // as the truth by whoever finds it first.
  const scC = oppScoreColor(oppSc);
  const tier = oppSc>=88?(isWR?'Elite alpha':'Elite workhorse'):oppSc>=75?'Clear starter':oppSc>=60?'Role player':'Committee/specialist';
  const sysClr = p.sys>=70?'var(--emerald)':p.sys>=55?'var(--sky)':p.sys>=40?'var(--topaz)':'var(--coral)';

  let usageRows = '';
  if (st25) {
    const tgtS = st25.target_share || 0;
    const airS = st25.air_yds_share || 0;
    const rzT = st25.rz_targets;
    const rzC = st25.rz_carries;
    if (isWR) {
      usageRows = [
        ['Target share', (tgtS*100).toFixed(1)+'%', tgtS>=.28?'var(--emerald)':tgtS>=.20?'var(--sky)':tgtS>=.14?'var(--topaz)':'var(--coral)'],
        ['Air yards share', (airS*100).toFixed(1)+'%', airS>=.38?'var(--emerald)':airS>=.28?'var(--sky)':airS>=.18?'var(--topaz)':'var(--coral)'],
        ['RZ targets', rzT!=null?rzT:'—', rzT>=18?'var(--emerald)':rzT>=12?'var(--sky)':rzT>=7?'var(--topaz)':'var(--coral)'],
      ].map(([l,v,c])=>`<div class="bdr-row"><span style="color:var(--fog)">${l}</span><span style="font-weight:600;color:${c}">${v}</span></div>`).join('');
    } else {
      const g = st25.games || 17;
      const rsRaw = st25.rush_share || 0;
      // Apply same 17/g adjustment used in workhorse score — rush_share in the pipeline
      // is a season total ratio (player carries / team carries), so it's diluted by missed
      // games. Adjusted value reflects true per-game role intensity when active.
      const rsAdj = Math.min(1, rsRaw * (17 / g));
      const rsLabel = g < 17 ? `Rush share/game · ${g}g` : 'Rush share';
      usageRows = [
        [rsLabel, (rsAdj*100).toFixed(1)+'%', rsAdj>=.55?'var(--emerald)':rsAdj>=.40?'var(--sky)':rsAdj>=.25?'var(--topaz)':'var(--coral)'],
        ['Target share', (tgtS*100).toFixed(1)+'%', tgtS>=.18?'var(--emerald)':tgtS>=.12?'var(--sky)':tgtS>=.08?'var(--topaz)':'var(--coral)'],
        ['RZ carries', rzC!=null?rzC:'—', rzC>=55?'var(--emerald)':rzC>=35?'var(--sky)':rzC>=20?'var(--topaz)':'var(--coral)'],
        ['RZ targets', rzT!=null?rzT:'—', rzT>=12?'var(--emerald)':rzT>=7?'var(--sky)':rzT>=3?'var(--topaz)':'var(--coral)'],
      ].map(([l,v,c])=>`<div class="bdr-row"><span style="color:var(--fog)">${l}</span><span style="font-weight:600;color:${c}">${v}</span></div>`).join('');
    }
  }

  return `<div class="card">
    <div class="card-label" style="margin-bottom:10px">Opportunity Score</div>
    ${oppTiles(p, oppSc, scC, tier)}
    ${usageRows ? '<div style="font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--fog);margin:4px 0 2px">2025 Usage</div>' : ''}
    ${usageRows}
    <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--panel)">
      ${buildSchemeHTML(p)}
    </div>
  </div>`;
}

// ── Contract ──────────────────────────────────────────────────────────────────
function buildContractHTML(p) {

    <div class="card-label">Contract</div>
    <div class="stat-grid" style="margin-bottom:12px">
      <div class="stat-box"><div class="stat-val">${fmt(ct.aav)}</div><div class="stat-lbl">Per Year</div></div>
      <div class="stat-box"><div class="stat-val">${fmt(ct.total)}</div><div class="stat-lbl">Total</div></div>
      <div class="stat-box"><div class="stat-val" style="color:${yrsClr}">${yrsLeft}</div><div class="stat-lbl">Yrs Left</div></div>
    </div>
    <div class="bdr-row"><span style="color:var(--fog)">Status</span><span class="badge ${st.cls}">${st.label}</span></div>
    <div class="bdr-row"><span style="color:var(--fog)">Expires</span><span>${ct.end}${ct.end<=SEASON_YEAR?' ⚠':''}</span></div>
    ${fifthYearNote(p,ct) ? `<div class="bdr-row"><span style="color:var(--fog)">Option</span><span style="color:var(--sky);font-size:11px">${fifthYearNote(p,ct)}</span></div>` : ''}
    <div style="margin-top:8px">${dynastySignal(ct)}</div>

function buildRippleHTML(p) {

// ── Age Curve ─────────────────────────────────────────────────────────────────
function buildAgeCurveHTML(p) {
  const pos = p.pos || p.p || 'WR';
  const ages = Array.from({length: 19}, (_, i) => i + 20); // 20–38
  const scores = ages.map(a => dsAge(a, pos));
  const W = 320, H = 72, padL = 28, padR = 8, padT = 10, padB = 18;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const toX = a => padL + ((a - 20) / 18) * plotW;
  const toY = s => padT + plotH - (s / 25) * plotH;

  const points = ages.map((a, i) => toX(a).toFixed(1) + ',' + toY(scores[i]).toFixed(1)).join(' ');

  // Peak zone — ages where score >= 23
  const peakAges = ages.filter(a => dsAge(a, pos) >= 23);
  const peakStart = peakAges[0] || 20;
  const peakEnd = peakAges[peakAges.length - 1] || 27;
  const pkX1 = toX(peakStart), pkX2 = toX(peakEnd);

  // Fill path under curve (area chart feel)
  const fillPts = ages.map((a, i) => toX(a).toFixed(1) + ',' + toY(scores[i]).toFixed(1)).join(' ');
  const fillPath = 'M ' + toX(20).toFixed(1) + ',' + toY(0).toFixed(1)
    + ' L ' + fillPts.split(' ').join(' L ')
    + ' L ' + toX(38).toFixed(1) + ',' + toY(0).toFixed(1) + ' Z';

  // Player marker
  const clampedAge = Math.min(38, Math.max(20, p.a || 25));
  const playerScore = dsAge(clampedAge, pos);
  const mx = toX(clampedAge), my = toY(playerScore);
  const col = dsColor(p.dsScore || 50);

  // Y-axis ticks at 0, 12, 25
  const yTicks = [0, 12, 25].map(s =>
    '<line x1="' + (padL-3) + '" y1="' + toY(s).toFixed(1) + '" x2="' + padL + '" y2="' + toY(s).toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>'
    + '<text x="' + (padL-5) + '" y="' + (toY(s)+3).toFixed(1) + '" fill="var(--fog-2)" font-size="6" text-anchor="end">' + s + '</text>'
  ).join('');

  const ageLabels = [20, 24, 28, 32, 36, 38].map(a =>
    '<text x="' + toX(a).toFixed(1) + '" y="' + (padT+plotH+13) + '" fill="var(--fog-2)" font-size="6" text-anchor="middle">' + a + '</text>'
  ).join('');

  return '<div class="card">'
    + '<div class="card-label" style="margin-bottom:2px">Age Curve · ' + pos + '</div>'
    + '<div class="card-sub" style="margin-bottom:8px">Dynasty value score vs age — green shading marks the prime window</div>'
    + '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;display:block;overflow:visible">'

    // Peak zone shading
    + '<rect x="' + pkX1.toFixed(1) + '" y="' + padT + '" width="' + (pkX2-pkX1).toFixed(1) + '" height="' + plotH + '" fill="var(--emerald)" opacity="0.07" rx="2"/>'

    // Fill under curve
    + '<path d="' + fillPath + '" fill="var(--fog-2)" opacity="0.2"/>'

    // Curve line
    + '<polyline points="' + points + '" fill="none" stroke="var(--fog-2)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>'

    // Axes
    + '<line x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (padT+plotH) + '" stroke="var(--line)" stroke-width="1"/>'
    + '<line x1="' + padL + '" y1="' + (padT+plotH) + '" x2="' + (W-padR) + '" y2="' + (padT+plotH) + '" stroke="var(--line)" stroke-width="1"/>'

    // Y ticks + labels
    + yTicks

    // Age labels
    + ageLabels

    // No floating "prime" label in SVG — the green shading shows the window; footer note carries the text

    // Player dot + vertical guide
    + '<line x1="' + mx.toFixed(1) + '" y1="' + (padT+plotH) + '" x2="' + mx.toFixed(1) + '" y2="' + my.toFixed(1) + '" stroke="' + col + '" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>'
    + '<circle cx="' + mx.toFixed(1) + '" cy="' + my.toFixed(1) + '" r="4.5" fill="' + col + '" stroke="var(--ink)" stroke-width="1.5"/>'

    // Player age label — above dot normally, below when near top to avoid colliding with "prime" label
    + (playerScore >= 22
      ? '<text x="' + mx.toFixed(1) + '" y="' + (my+16).toFixed(1) + '" fill="' + col + '" font-size="6" text-anchor="middle" font-weight="bold">' + clampedAge.toFixed(1) + '</text>'
      : '<text x="' + mx.toFixed(1) + '" y="' + (my-8).toFixed(1)  + '" fill="' + col + '" font-size="6" text-anchor="middle" font-weight="bold">' + clampedAge.toFixed(1) + '</text>'
    )

    + '</svg>'
    + '<div style="font-size:9px;color:var(--fog-2);text-align:center;margin-top:2px">'
    + pos + ' prime: ages ' + peakStart + '–' + peakEnd + ' · Age score ' + playerScore + '/25'
    + '</div>'
    + '</div>';
}

// ── Comparable Players ────────────────────────────────────────────────────────
function buildComparableHTML(p) {
  const pos = p.pos || p.p || 'WR';
  const ds = p.dsScore;
  if (ds == null) return '';

  const myOpp = getOppScore(p.n, pos) || 50;

  const peers = COMP.filter(x =>
    (x.pos||x.p) === pos &&
    x.n !== p.n &&
    x.dsScore != null &&
    Math.abs((x.dsScore||0) - ds) <= 22
  );

  const scored = peers.map(peer => {
    const dsDiff = Math.abs((peer.dsScore||0) - ds);
    const ageDiff = Math.abs((peer.a||0) - (p.a||0));
    const peerOpp = getOppScore(peer.n, peer.pos) || 50;
    const oppDiff = Math.abs(peerOpp - myOpp);
    const sim = dsDiff * 2.5 + ageDiff * 4.0 + oppDiff * 0.4;
    return { peer, sim, dsDiff, ageDiff };
  });

  const comps = scored.sort((a, b) => a.sim - b.sim).slice(0, 3);
  if (!comps.length) return '';

  const cards = comps.map(({peer, dsDiff, ageDiff}) => {
    const vt = (vTag(peer).match(/>([a-z ]+)</) || [,''])[1];
    const vc = vt.includes('strong buy') ? 'var(--emerald)' : vt === 'buy' ? 'var(--emerald)'
      : vt === 'hold' ? 'var(--paper)' : vt.includes('strong sell') ? 'var(--coral-bri)' : 'var(--coral)';
    const dsc = dsColor(peer.dsScore);
    const team = (typeof AL !== 'undefined' && AL[peer.t]) ? AL[peer.t] : peer.t;
    const note = dsDiff <= 2 ? 'near-identical score'
      : ageDiff <= 0.8 ? 'same age tier'
      : ageDiff <= 1.5 ? (peer.a > p.a ? 'slightly older' : 'slightly younger')
      : 'similar profile';

    return '<div style="display:flex;align-items:center;gap:10px;padding:8px;background:var(--ink-2);border-radius:6px">'
      + '<div style="flex:1;min-width:0">'
      + '<div style="font-size:12px;font-weight:600;margin-bottom:2px">'
      + '<a href="player.html?name=' + encodeURIComponent(peer.n) + '" style="color:var(--paper);text-decoration:none" '
      + 'onmouseover="this.style.color=\'var(--emerald)\'" onmouseout="this.style.color=\'var(--paper)\'">' + peer.n + '</a>'
      + '</div>'

        + Math.round(r._ppaPct * r._ppaPeers / 100) + ' of the ' + r._ppaPeers + ' qualifying ' + pos
        + 's that season on predicted points added per play \u2014 NOT that he ranked ' + r._ppaPct + _ord(r._ppaPct) + '. ' : '')
    + 'A percentile rather than the raw score because the raw scale is not comparable across seasons: CFBD changed how it computes receiver efficiency in 2025 and halved every receiver\u2019s number with nothing changing on the field. The raw value is in the table above.'
    + (pos === 'QB' ? '<br><b style="color:var(--fog)">ANY/A</b> \u2014 adjusted net yards per attempt: (pass yards + 20 \u00d7 TD \u2212 45 \u00d7 INT) \u00f7 attempts. One number for passing efficiency that rewards touchdowns and punishes picks, so a checkdown QB does not grade elite. College box scores carry no sack data, so this is the passing-only variant.' : '')
    + (pos === 'RB' ? '<br><b style="color:var(--fog)">dDOM for backs is all-purpose</b> \u2014 an equal blend of his share of team rushing and his share of team receiving. Rushing-only undersold pass-catching backs; both halves are listed above.' : '')
    + ((pos === 'WR' || pos === 'TE') ? '<br><b style="color:var(--fog)">Dominator</b> \u2014 average of his share of team receiving yards and receiving TDs. <b style="color:var(--fog)">Reception share</b> \u2014 his receptions over team receptions, the honest stand-in for target share.' : '')
    + '</div></div>';

  const cls = { 1:'Freshman', 2:'Sophomore', 3:'Junior', 4:'Senior', 5:'Senior (5th)' }[r.cls] || 'class n/a';
  const pedCard = '<div class="card"><div class="card-label">Recruiting pedigree</div>'
    + '<div class="bdr-row"><span style="color:var(--fog)">Recruit rating' + (carried ? '<span style="color:var(--fog-2)"> \u00b7 from ' + carried + ' file</span>' : '') + '</span><b style="font-family:var(--mono)">' + (r.stars != null ? r.stars + '\u2605 \u00b7 ' + r.rating : '-') + '</b></div>'
    + '<div class="bdr-row"><span style="color:var(--fog)">Recruiting class</span><b style="font-family:var(--mono)">' + _cN(r.rcls) + '</b></div>'
    + '<div class="bdr-row"><span style="color:var(--fog)">Class<span style="color:var(--fog-2)"> \u00b7 latest on file</span></span><b style="font-family:var(--mono)">' + cls + '</b></div>'
    + '<div class="bdr-row"><span style="color:var(--fog)">Conference</span><b style="font-family:var(--mono)">' + r.conf + '</b></div>'
    + '<div class="bdr-row"><span style="color:var(--fog)">Age that season</span><b style="font-family:var(--mono)">' + _cN(r.ageEst) + '</b></div></div>';

  // Team construction — who else was catching passes on his college team that year.
  // Ported from cfb-player.html so the 63 players who now route to their NFL page keep it.
  // The room comes from a shared table in the index keyed "Team|Season", because it is the
  // same for every player on that team and mostly consists of players DELTA does not track.
  let matesCard = '';
  const mk = r._mates;
  const room = (mk && CFB_INDEX && CFB_INDEX._mates) ? CFB_INDEX._mates[mk] : null;
  if (room && room.length >= 2) {
    matesCard = '<div class="card"><div class="card-label">Team construction \u00b7 ' + yr
      + '<div class="card-sub">who else was catching the ball at ' + r.tm + ' that season</div></div>'
      + '<div class="dl-b-scroll">'
      + '<table class="dl-board dl-pp-tbl cgl"><thead><tr>'
      + '<th>Player</th><th>Pos</th><th>Rec</th><th>Yds</th><th>Share</th>'
      + '</tr></thead><tbody>'
      + room.map(m => {
          const me = m.n === (r._cfbName || p.n);
          return '<tr' + (me ? ' class="dl-pp-me"' : '') + '>'
            + '<td class="opp" style="text-align:left;color:' + (me ? 'var(--paper)' : 'var(--fog)')
            + ';font-weight:' + (me ? '700' : '400') + '" title="' + String(m.n).replace(/"/g,'&quot;') + '">'
            + m.n + (me ? ' \u2190' : '') + '</td>'
            + '<td>' + _cN(m.pos) + '</td><td>' + _cN(m.rec) + '</td><td>' + _cN(m.rey) + '</td>'
            + '<td>' + (m.rsh != null ? Math.round(m.rsh * 100) + '%' : '\u2013') + '</td></tr>';
        }).join('')
      + '</tbody></table></div>'
      + '<div style="font-size:10px;color:var(--fog-2);line-height:1.6;margin-top:9px">'
      + 'Top six pass-catchers only, so shares will not add to 100%. Quarterbacks are excluded.'
      + '</div></div>';
  }

  let glCard = ''; const g = r.g || [];
  if (g.length) {
    // Column sets match cfbGameLogTable() in index.html and gameLogTable() in
    // cfb-player.html so the same game reads the same everywhere. The earlier set here
    // dropped rushing TDs for QBs and receiving TDs for backs — a QB's rushing scores and
    // a receiving back's touchdowns are exactly the production this tab exists to show.
    const cols = pos === 'QB'
      ? [['C/ATT','ca'],['Yds','py'],['TD','pt'],['INT','pi'],['Car','car'],['RuYd','ry'],['RuTD','rt']]
      : pos === 'RB'
      ? [['Car','car'],['RuYd','ry'],['RuTD','rt'],['Rec','rec'],['ReYd','rey'],['ReTD','ret']]
      : [['Rec','rec'],['ReYd','rey'],['ReTD','ret'],['Car','car'],['RuYd','ry'],['RuTD','rt']];
    const rows2 = g.slice().sort((a, b) => (a.w || 0) - (b.w || 0));
    glCard = '<div class="card"><div class="card-label">' + yr + ' game log</div>'
      + '<div class="dl-b-scroll">'
      + '<table class="dl-board dl-pp-tbl cgl"><thead><tr>'
      + '<th>Wk</th><th class="dl-b-l">Opp</th>'
      + cols.map(c => '<th>' + c[0] + '</th>').join('')
      + '</tr></thead><tbody>'
      + rows2.map(x => '<tr><td>' + (x.w || '-') + '</td>'
          + '<td class="opp dl-b-l" style="color:var(--fog)" title="'
          + String(x.opp || '').replace(/"/g, '&quot;') + '">' + _opp(x.opp) + '</td>'
          + cols.map(c => '<td>' + _cN(x[c[1]]) + '</td>').join('') + '</tr>').join('')
      + '</tbody></table></div></div>';
  }
  // Postseason: its own section, never merged into anything above. Hidden entirely when
  // the player has no line — with opt-outs and only ~two thirds of teams reaching a bowl,
  // an empty box would be the common case and would read as a fault rather than a fact.
  let postCard = '';
  const post = r._post || [];
  if (post.length) {
    const pcols = pos === 'QB'
      ? [['C/ATT','ca'],['Yds','py'],['TD','pt'],['INT','pi'],['Car','car'],['RuYd','ry'],['RuTD','rt']]
      : pos === 'RB'
      ? [['Car','car'],['RuYd','ry'],['RuTD','rt'],['Rec','rec'],['ReYd','rey'],['ReTD','ret']]
      : [['Rec','rec'],['ReYd','rey'],['ReTD','ret'],['Car','car'],['RuYd','ry'],['RuTD','rt']];
    postCard = '<div class="card" style="border-color:var(--line)">'
      + '<div class="card-label" style="color:var(--topaz)">Postseason \u00b7 ' + yr
      + '<div class="card-sub" style="color:var(--fog-2)">Bowl and playoff games. Shown separately and '
      + 'NOT counted in any number above \u2014 participation is not uniform, so folding these in '
      + 'would rank players on different amounts of football.</div></div>'
      + '<div class="dl-b-scroll">'
      + '<table class="dl-board dl-pp-tbl cgl"><thead><tr><th>Opponent</th>'
      + pcols.map(c => '<th>' + c[0] + '</th>').join('') + '</tr></thead><tbody>'
      + post.map(x => '<tr><td class="opp dl-b-l" style="color:var(--paper);font-weight:600" title="'
          + String(x.opp || '').replace(/"/g, '&quot;') + '">' + _opp(x.opp) + '</td>'
          + pcols.map(c => '<td>' + _cN(x[c[1]]) + '</td>').join('') + '</tr>').join('')
      + '</tbody></table></div>'
      + (post.length > 1
          ? '<div style="font-size:10px;color:var(--fog-2);margin-top:9px">'
            + post.length + ' games \u2014 a College Football Playoff run.</div>'
          : '')

  }

  // Combine lives in the College tab when there is a college story to sit beside; for a
  // player with no college data it is rendered on the NFL tab instead (see the call site
  // there), because trapping it behind a tab that never appears made it unreachable for
  // nine rookies — including Bryce Lance, whose 4.34 is the only thing we know about him.
  const combCard = isRookie(p) ? buildCombineHTML(p) : '';

  const foot = '<div class="card" style="background:var(--ink-2)"><div style="font-size:10.5px;color:var(--fog-2);line-height:1.65">'
    + 'College numbers are tracking data only. They do not feed the DELTA Score, the projection, or the buy/sell call \u2014 those stay NFL production only. '
    + 'Season totals and every percentile are <b style="color:var(--fog)">regular season</b>; bowl and playoff games appear only in the Postseason section.</div></div>';
  return pills + ddCard + prodCard + pedCard + combCard + matesCard + glCard + postCard + foot;

// ── Market Value history (9 Oct 2026) ────────────────────────────────────────
/* DISPLAY ONLY. The market's price for this player over time, in the reader's own
   league format. Nothing scored reads it; it sits after Contract because both
   answer "what does he cost" (owner, 9 Oct). Data: data/market-history/<T>-<Q>.json,
   written nightly by scripts/build-market-history.js (backfilled from 9 Jun 2026).
   That file is ~100 KB compressed, so it is fetched only when this card scrolls
   into view, once per format per visit. Overall rank for any day is recomputed from
   the file's whole board, so it matches the value shown for that day.
   Press or hover on the chart: the headline becomes that day's value (a floating
   tooltip covered the line whenever the line ran high, in the mock). */
const MK = { files:{}, range:'all', hover:null, rows:null, name:null };
function mkSetting(){ return (typeof leagueTeams!=='undefined'?leagueTeams:12)+'|'+(typeof qbFmt!=='undefined'?qbFmt:'sf'); }
function mkLoad(setting){
  if(!MK.files[setting])
    MK.files[setting]=fetch('./data/market-history/'+setting.replace('|','-')+'.json',{cache:'no-cache'})
      .then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; });
  return MK.files[setting];
}
function mkSeries(hist,name){
  if(!hist||!hist.players||!Array.isArray(hist.dates)) return null;
  let key=null;
  if(hist.players[name]) key=name;
  else if(typeof FC_ALIASES!=='undefined'&&FC_ALIASES[name]&&hist.players[FC_ALIASES[name]]) key=FC_ALIASES[name];
  else if(typeof fcNormIndex==='function'){ key=fcNormIndex(hist.players)[fcNorm(name)]||null; }
  if(!key) return null;
  const vals=hist.players[key];
  return hist.dates.map(function(d,i){
    const v=vals[i]; if(v==null) return {d:d,v:null,r:null};
    let r=1; for(const n in hist.players){ const x=hist.players[n][i]; if(x!=null&&x>v) r++; }
    return {d:d,v:v,r:r};
  }).filter(function(x){ return x.v!=null; });
}
function mkMon(d){ const m=+d.slice(5,7), dd=+d.slice(8,10);
  return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]+' '+dd; }
function mkFmt(n){ return Math.round(n).toLocaleString('en-US'); }
function mkGeom(rows){
  const W=340, H=150, padL=36, padR=12, padT=14, padB=22;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const vs=rows.map(function(x){ return x.v; });
  let lo=Math.min.apply(null,vs), hi=Math.max.apply(null,vs);
  const span=Math.max(hi-lo,hi*0.06);              // a flat line still gets some room
  lo=Math.max(0,lo-span*0.12); hi=hi+span*0.12;
  return {W:W,H:H,padL:padL,padR:padR,padT:padT,padB:padB,plotW:plotW,plotH:plotH,lo:lo,hi:hi,
    x:function(i){ return padL+(rows.length===1?0:(i/(rows.length-1))*plotW); },
    y:function(v){ return padT+plotH-((v-lo)/(hi-lo))*plotH; }};
}
function buildMarketCardInner(){
  const all=MK.rows;
  if(!all||all.length<2) return null;
  const rows=MK.range==='30'?all.slice(-30):all;
  const first=rows[0], last=rows[rows.length-1];
  const g=mkGeom(rows);
  const raw=(g.hi-g.lo)/3, m=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(function(k){ return k*m; }).find(function(s){ return s>=raw; });
  const ticks=[]; for(let t=Math.ceil(g.lo/step)*step; t<=g.hi; t+=step) ticks.push(t);
  const pts=rows.map(function(x,i){ return g.x(i).toFixed(1)+','+g.y(x.v).toFixed(1); });
  const area='M '+g.x(0).toFixed(1)+','+(g.padT+g.plotH)+' L '+pts.join(' L ')+' L '+g.x(rows.length-1).toFixed(1)+','+(g.padT+g.plotH)+' Z';
  const xl=[0];
  rows.forEach(function(x,i){ if(i>0&&x.d.slice(8)==='01'&&i>rows.length*0.12&&i<rows.length*0.88) xl.push(i); });
  xl.push(rows.length-1);
  const hi_=MK.hover!=null?Math.max(0,Math.min(rows.length-1,MK.hover)):null;
  const at=hi_!=null?rows[hi_]:last;
  const d2=at.v-first.v, p2=first.v?(d2/first.v)*100:0;
  const ar=d2>0?'\u25B2':d2<0?'\u25BC':'';
  const kfmt=function(t){ return t>=1000?(t/1000).toFixed(t%1000?1:0)+'k':String(t); };
  const pill=function(k,lbl){ return '<button type="button" class="mk-pill'+(MK.range===k?' on':'')+'" onclick="mkSetRange(\''+k+'\')">'+lbl+'</button>'; };
  const dot=function(i){ return '<circle cx="'+g.x(i).toFixed(1)+'" cy="'+g.y(rows[i].v).toFixed(1)+'" r="4" fill="var(--teal-br)" stroke="var(--ink)" stroke-width="2"/>'; };
  return '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">'
    +'<div><div class="card-label" style="margin-bottom:2px">Market Value</div>'
    +'<div class="card-sub">'+(typeof leagueTeams!=='undefined'?leagueTeams:12)+'-team '+(typeof qbFmt!=='undefined'&&qbFmt==='1qb'?'1QB':'superflex')
    +' \u00B7 context only, never part of the DELTA Score</div></div>'
    +'<div class="mk-pills">'+pill('30','30 Days')+pill('all','Since '+mkMon(all[0].d))+'</div></div>'
    +'<div class="mk-head"><span class="mk-now">'+mkFmt(at.v)+'</span>'
    +'<span class="mk-chg">'+ar+' '+mkFmt(Math.abs(d2))+' ('+(d2>=0?'+':'\u2212')+Math.abs(p2).toFixed(0)+'%) since '+mkMon(first.d)+'</span>'
    +'<span class="mk-rank">'+(hi_!=null?'<b style="color:var(--paper)">'+mkMon(at.d)+'</b> \u00B7 ':'')+'#'+at.r+' overall</span></div>'
    +'<div class="mk-plot" onpointermove="mkPoint(event)" onpointerdown="mkPoint(event)" onpointerleave="mkPoint(null)">'
    +'<svg viewBox="0 0 '+g.W+' '+g.H+'" style="width:100%;display:block;overflow:visible" role="img" aria-label="Market value from '
      +mkFmt(first.v)+' on '+mkMon(first.d)+' to '+mkFmt(last.v)+' on '+mkMon(last.d)+'">'
    +ticks.map(function(t){ return '<line x1="'+g.padL+'" x2="'+(g.W-g.padR)+'" y1="'+g.y(t).toFixed(1)+'" y2="'+g.y(t).toFixed(1)+'" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>'
      +'<text x="'+(g.padL-6)+'" y="'+(g.y(t)+3).toFixed(1)+'" fill="var(--fog-2)" font-size="8" text-anchor="end">'+kfmt(t)+'</text>'; }).join('')
    +xl.map(function(i){ return '<text x="'+g.x(i).toFixed(1)+'" y="'+(g.H-6)+'" fill="var(--fog-2)" font-size="8" text-anchor="'
      +(i===0?'start':i===rows.length-1?'end':'middle')+'">'+mkMon(rows[i].d)+'</text>'; }).join('')
    +'<path d="'+area+'" fill="var(--teal-br)" opacity="0.08"/>'
    +'<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--teal-br)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
    +(hi_!=null
      ? '<line x1="'+g.x(hi_).toFixed(1)+'" x2="'+g.x(hi_).toFixed(1)+'" y1="'+g.padT+'" y2="'+(g.padT+g.plotH)+'" stroke="var(--fog-2)" stroke-width="1" stroke-dasharray="2,2" vector-effect="non-scaling-stroke"/>'+dot(hi_)
      : dot(rows.length-1))
    +'</svg></div>'
    +'<div class="mk-foot">FantasyCalc trade-based value, saved nightly. Press or hover on the chart to see any day.</div>';
}
function mkPaint(){
  const el=document.getElementById('mk-card'); if(!el) return;
  const inner=buildMarketCardInner();
  if(inner==null){ el.style.display='none'; return; }   // no history for this player: no card
  el.innerHTML=inner;
}
function mkSetRange(k){ MK.range=k; MK.hover=null; mkPaint(); }
function mkPoint(ev){
  if(!ev){ if(MK.hover!=null){ MK.hover=null; mkPaint(); } return; }
  const svg=ev.currentTarget.querySelector('svg'); if(!svg||!MK.rows) return;
  const rows=MK.range==='30'?MK.rows.slice(-30):MK.rows;
  const g=mkGeom(rows), b=svg.getBoundingClientRect();
  const xv=(ev.clientX-b.left)/b.width*g.W;
  const i=Math.max(0,Math.min(rows.length-1,Math.round((xv-g.padL)/g.plotW*(rows.length-1))));
  if(i!==MK.hover){ MK.hover=i; mkPaint(); }
}
/* The card's shell goes into the page at once; its data arrives when it is scrolled to. */
function buildMarketShellHTML(p){
  MK.name=p.n; MK.rows=null; MK.hover=null;
  return '<div class="card" id="mk-card"><div class="card-label">Market Value</div><div class="mk-wait">Loading price history\u2026</div></div>';
}
function mkWire(p){
  const el=document.getElementById('mk-card'); if(!el) return;
  const go=function(){
    const setting=mkSetting();
    mkLoad(setting).then(function(hist){
      if(CUR_P!==p) return;
      MK.rows=mkSeries(hist,p.n); mkPaint();
    });
  };
  if(typeof IntersectionObserver==='function'){
    const io=new IntersectionObserver(function(es){ if(es.some(function(e){ return e.isIntersecting; })){ io.disconnect(); go(); } },{rootMargin:'300px'});
    io.observe(el);
  } else go();
}

// ── Init ──────────────────────────────────────────────────────────────────────
// Sync league preferences from main app so scores & verdicts match
try {
  const prefs = JSON.parse(localStorage.getItem('delta_settings') || '{}');
  if (prefs.teams) leagueTeams = parseInt(prefs.teams);
  if (prefs.qb)    qbFmt       = prefs.qb;
  if (prefs.fmt)   scoringFmt  = prefs.fmt;
} catch(e) {}

if (!PLAYER_NAME) {
  showError('No player specified. Use <code>player.html?name=Josh+Allen</code>');
} else {
  /* THIS CHAIN MUST MIRROR index.html's bootDelta(), IN ORDER. It did not, and the
     two pages disagreed on 186 buy/sell verdicts, 218 projections and 46 DELTA Scores
     measured against live data. Two separate causes, both fixed here:

       1. loadInjuryOverrides() was missing entirely, so INJ_OUT stayed {} and a player
          confirmed out for the season kept a full projection on his own page while the
          rankings row showed 0 and an OUT badge.

       2. Nothing rebuilt COMP after ensureStartData(). That loader syncs g25 from the
          game logs (136 players on current data) — it mutates RAW, not COMP, so the
          objects built by the earlier loaders kept a stale g25. index.html gets away
          with the same ordering only because renderAll() rebuilds COMP afterwards.
          A stale g25 of 0 on a veteran is not a rounding error: calcProj has an
          early-return rookie path gated on g25===0, so real veterans were being scored
          through the rookie branch. Darnell Washington read "52 · sell" in the rankings
          and "47 · buy" here.

     applyMarketForSetting() is the rebuild (it repoints kMkt and re-runs calcProj over
     RAW). It must run BEFORE the COMP.find below, or p points at a discarded object,
     and while MV_CENTER is still 1, because computeMvCenter() must measure on the raw
     basis — the same compute -> set -> read sequence renderAll() and the freeze use.
     If a loader is ever added to bootDelta, add it here too. */
  loadLiveMarketValues()
    .then(() => loadPlayerStats())
    .then(() => loadPlayerContracts())
    .then(() => loadRipples())
    .then(() => loadInjuryOverrides())
    .then(() => loadQBStarters())
    .then(() => loadCollegeNames())
    .then(() => loadDepthCharts())
    .then(() => ensureStartData())
    .then(() => loadPCFingerprint())   // display only; this page alone draws the tendency chart
    .then(() => {
      applyMarketForSetting();       // rebuild COMP so the g25 sync above is reflected
          dlBuildStamp();
  const p = COMP.find(x => x.n === PLAYER_NAME);
      if (!p) { showError(`Player not found: <strong>${PLAYER_NAME}</strong>`); return; }
      MV_CENTER = computeMvCenter(); // population median + price-taper fit — same as renderAll() in index.html
      renderPlayerPage(p);
      if (typeof dlShowLoadNotice === 'function') dlShowLoadNotice();   // any file that did not load (9 Oct 2026)
    })
    .catch(e => showError('Failed to load player data. ' + e.message));
}
</script>
</body>
</html>
