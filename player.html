<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0F1A;color:#EAF0F4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:#10B981;text-decoration:none}
a:hover{text-decoration:underline}
.page{max-width:680px;margin:0 auto;padding:16px 14px 48px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid #1E2A3A}
.nav-back{font-size:12px;color:#8CA0B3;display:flex;align-items:center;gap:5px;transition:color .15s}
.nav-back:hover{color:#EAF0F4;text-decoration:none}
.nav-brand{font-size:11px;font-weight:700;color:#10B981;letter-spacing:.05em}
.hero{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.hero-hs{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid #1E2A3A;background:#111A28;flex-shrink:0}
.hero-ph{width:72px;height:72px;border-radius:50%;background:#111A28;border:1px solid #1E2A3A;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;color:#5C7080}
.hero-info{flex:1;min-width:0}
.hero-name{font-size:24px;font-weight:800;letter-spacing:-.5px;color:#EAF0F4;line-height:1.1;margin-bottom:5px}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px;color:#8CA0B3;margin-bottom:3px}
.hero-bg{font-size:11px;color:#8CA0B3;margin-bottom:7px}
.hero-verdict{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.verdict-badge{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.hero-vals{font-size:11px;color:#8CA0B3}
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.03em}
.bs{background:#0D1420;color:#10B981}
.bi{background:#0D1420;color:#6BB6E0}
.bn{background:#1E2A3A;color:#8CA0B3}
.bw{background:#0D1420;color:#E0B34D}
.bd{background:#0D1420;color:#EA7A66}
.card{background:#111A28;border:1px solid #1E2A3A;border-radius:10px;padding:14px 16px;margin-bottom:12px}
.card-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5C7080;margin-bottom:10px}
.card-sub{font-size:9px;color:#5C7080;font-weight:400;margin-top:2px}
.dd-section-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5C7080;margin-bottom:8px}
@media(max-width:600px){.gl-tbl{font-size:9px!important}.gl-tbl th,.gl-tbl td{padding:2px 3px!important}
/* game-log view tabs: 6 pills must hold ONE line. At default sizing the strip needs
   ~346px but a 402pt phone only gives 340px of card content, so "Trend" wrapped.
   Tightening type + padding + gap frees ~70px, which keeps all six inline down to
   ~350pt. Container keeps flex-wrap as a safety net below that. */
.gl-tab{font-size:9.5px!important;padding:3px 5px!important;margin-right:3px!important}}
.dd-prog-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.dd-prog-label{font-size:10px;color:#8CA0B3;width:36px;flex-shrink:0}
.dd-prog-bar{flex:1;height:5px;background:#111A28;border-radius:3px;overflow:hidden}
.dd-prog-fill{height:100%;border-radius:3px}
.dd-prog-val{font-size:10px;font-weight:600;width:32px;text-align:right;flex-shrink:0}
.prod-table{width:100%;border-collapse:collapse;font-size:11px}
.prod-table th{font-size:9px;font-weight:600;color:#5C7080;letter-spacing:.04em;text-align:right;padding:0 8px 6px}
.prod-table th:first-child{text-align:left}
.prod-table td{text-align:right;padding:5px 8px;border-top:1px solid #111A28}
.prod-table td:first-child{text-align:left;color:#8CA0B3;font-weight:600}
/* College game log: up to nine columns, so it gets tighter padding than the season
   tables and the opponent column — the least valuable field — gives up space first. */
.cgl th,.cgl td{padding:4px 5px}
.cgl .opp{max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:600px){
  .cgl{font-size:9.5px!important}
  .cgl th,.cgl td{padding:3px 3px!important}
  .cgl .opp{max-width:56px;font-size:9px}
}
@media(max-width:400px){
  .cgl{font-size:9px!important}
  .cgl .opp{max-width:46px;font-size:8.5px}
}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-box{background:#0D1420;border-radius:6px;padding:8px 10px;text-align:center}
.stat-val{font-size:18px;font-weight:700;line-height:1.1;margin-bottom:2px}
.stat-lbl{font-size:9px;color:#5C7080;letter-spacing:.03em}

.state-msg{text-align:center;padding:60px 20px;color:#5C7080;font-size:13px}
.freshness{font-size:10px;color:#5C7080;margin-top:6px;text-align:right}

.dd-prog-bar{background:#1E2A3A}
.dd-prog-label{font-family:var(--sans)}

<script>
/* Apply the saved accent theme BEFORE first paint (no flash of the default). Self-contained
   on purpose: this runs before delta-engine.js exists. */
(function(){try{
  /* MUST match DL_THEMES in index.html. This table is duplicated in three places on purpose —
     it runs before delta-engine.js exists, so it cannot read the real one — and player.html
     has NO other copy, so a theme missing here renders that whole page in teal. */
  var T={teal:['#2DD4BF','#14B8A6'],violet:['#9B8AF0','#7C6FD6'],sky:['#6BB6E0','#4E96BE'],
         cobalt:['#5B8DEF','#3F6FD1'],orchid:['#D96BC4','#BE55AA'],slate:['#94A3B8','#64748B']};
  var t=T[localStorage.getItem('delta_theme')]||T.teal, s=document.documentElement.style;
  function rgba(h,a){var b=parseInt(h.slice(1),16);return 'rgba('+((b>>16)&255)+','+((b>>8)&255)+','+(b&255)+','+a+')';}
  s.setProperty('--teal-br',t[0]); s.setProperty('--teal',t[1]);
  s.setProperty('--teal-tint',rgba(t[0],.12)); s.setProperty('--teal-soft',rgba(t[0],.07));
  s.setProperty('--row-hi',rgba(t[0],.055));
}catch(e){}})();
</script>

<script>
// Monochrome headshot placeholder (replaces the emoji placeholder — site is emoji-free)
const HERO_PH_SVG='<svg viewBox="0 0 24 24" width="58%" height="58%" aria-hidden="true">'
  +'<circle cx="12" cy="8.2" r="4.1" fill="currentColor" opacity="0.55"/>'
  +'<path d="M3.6 21c.5-4.2 4.1-6.4 8.4-6.4s7.9 2.2 8.4 6.4z" fill="currentColor" opacity="0.55"/></svg>';

function heroStar(el){
  const on=dwToggle(el.dataset.name);
  el.textContent=on?'\u2605':'\u2606';
  el.style.color=on?'var(--topaz)':'var(--fog-2)';
}
function heroPhFallback(el){ el.outerHTML='<div class="hero-ph">'+HERO_PH_SVG+'</div>'; }

const params = new URLSearchParams(location.search);
const PLAYER_NAME = decodeURIComponent(params.get('name') || params.get('player') || '');

function showError(msg) {
  document.getElementById('state-loading').style.display = 'none';
  const el = document.getElementById('state-error');
  el.style.display = '';
  el.innerHTML = msg + '<br><br><a href="index.html">← Back to Rankings</a>';
}

function showContent(html) {
  document.getElementById('state-loading').style.display = 'none';
  const el = document.getElementById('player-content');
  el.style.display = '';
  el.innerHTML = html;
}

function ppgClr(v) {
  return v >= 18 ? '#10B981' : v >= 14 ? '#6BB6E0' : v >= 10 ? '#E0B34D' : v > 0 ? '#E05745' : '#1E2A3A';
}

// ── Hero ──────────────────────────────────────────────────────────────────────
function buildHeroHTML(p) {
  const ct = CONTRACTS.find(c => c.n === p.n);
  const dp = DRAFT_PICKS[p.n];
  const team = (typeof AL !== 'undefined' && AL[p.t]) ? AL[p.t] : p.t;
  const vt = (vTag(p).match(/>([a-z ]+)</) || [,''])[1];
  const vc = vt.includes('strong buy') ? '#10B981' : vt === 'buy' ? '#10B981'
    : vt === 'hold' ? '#EAF0F4' : vt.includes('strong sell') ? '#EA7A66' : '#E05745';
  const mv = mvAsset(p);
  const adjP = getAdjProj(p);
  const hs = (typeof HEADSHOTS !== 'undefined') && HEADSHOTS[p.n];
  const hsHtml = hs
    ? `<img class="hero-hs" src="${hs}" alt="${p.n}" onerror="heroPhFallback(this)">`
    : `<div class="hero-ph">${HERO_PH_SVG}</div>`;

  // College + draft on same muted line, no accent color for draft pick
  const bgParts = [];
  if (COLLEGES && COLLEGES[p.n]) bgParts.push(COLLEGES[p.n]);
  if (dp) bgParts.push(`${dp.y} Rd${dp.r} Pick ${dp.p}`);
  const bgLine = bgParts.length ? `<div class="hero-bg">${bgParts.join(' · ')}</div>` : '';

  // Season stat line is rendered separately (after the DELTA Score) — see buildStatLineHTML.

  return `<div class="hero">
    ${hsHtml}
    <div class="hero-info">
      <div class="hero-name">${typeof injBadge==='function'?injBadge(p.n):''}${p.n} <span data-name="${p.n}" onclick="heroStar(this)" style="cursor:pointer;font-size:17px;vertical-align:2px;color:${dwHas(p.n)?'var(--topaz)':'var(--fog-2)'}">${dwHas(p.n)?'\u2605':'\u2606'}</span></div>
      <div class="hero-meta">
        <span class="badge bn">${p.pos}</span>
        <span>${team}</span>
        <span>Age ${p.a.toFixed(1)}</span>
        ${ct ? `<span style="color:#8CA0B3">Thru ${ct.end}${ct.end<=2026?' ⚠':''}${fifthYearNote(p,ct)?' +opt':''}</span>` : ''}
      </div>
      ${bgLine}
      <div class="hero-verdict">
        <span class="verdict-badge" style="color:${vc}">${vt}</span>
        <span class="hero-vals">Mkt ${(p.ktcEff!=null?p.ktcEff:(p.ktc!=null?p.ktc:0)).toLocaleString()} · Model ${mv>=19999?'19,999+':(mv!=null?mv:0).toLocaleString()} · Proj ${(adjP!=null?adjP:0).toFixed(1)} PPG</span>
      </div>
    </div>
  </div>`;
}

// Season stat line — raw counting stats. DELTA is rate-driven, so these were never shown;
// they ground every derived metric. Rendered AFTER the DELTA Score so the signature metric
// leads and the stats read as its evidence — matching the college page's order.
function buildStatLineHTML(p) {
  const all = (typeof PLAYER_STATS !== 'undefined') && PLAYER_STATS[p.n];
  if (!all) return '';
  // Only seasons the player actually played. The pipeline emits a null placeholder for
  // seasons before a player entered the league — those must not get a pill.
  const yrs = Object.keys(all).filter(y => /^\d{4}$/.test(y) && all[y] && (all[y].games || 0) > 0).sort();
  if (!yrs.length) return '';
  _slPlayer = p; _slSeason = yrs[yrs.length - 1];
  return `<div id="statline-host" style="margin-bottom:12px">${statLineInner(p, _slSeason, yrs)}</div>`;
}
let _slPlayer = null, _slSeason = null;
function statLineSeason(y) {
  if (!_slPlayer) return;
  _slSeason = String(y);
  const all = PLAYER_STATS[_slPlayer.n] || {};
  const yrs = Object.keys(all).filter(k => /^\d{4}$/.test(k) && all[k] && (all[k].games || 0) > 0).sort();
  const host = document.getElementById('statline-host');
  if (host) host.innerHTML = statLineInner(_slPlayer, _slSeason, yrs);
}
function statLineInner(p, season, yrs) {
  const s = (PLAYER_STATS[p.n] || {})[season];
  const nz = v => (v == null || v === 0) ? '—' : v.toLocaleString();
  const pills = yrs.length > 1
    ? `<div style="display:flex;gap:6px">` + yrs.map(y =>
        `<button onclick="statLineSeason('${y}')" style="font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:14px;cursor:pointer;`
        + `border:1px solid ${y === season ? '#2DD4BF' : '#1E2A3A'};background:${y === season ? '#0A0F1A' : 'transparent'};`
        + `color:${y === season ? '#2DD4BF' : '#8CA0B3'}">${y}</button>`).join('') + `</div>`
    : '';
  const head = `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px">`
    + `<div style="font-size:10px;font-weight:700;letter-spacing:.07em;color:#5C7080">${season} SEASON</div>${pills}</div>`;
  if (!s) return head + `<div style="font-size:11.5px;color:#5C7080;padding:10px 0">No stats on record for ${season}.</div>`;
  // Position-appropriate stat rows. Rows of three; a rushing row appears for a
  // receiver only when he actually has carries, so the grid never shows dead cells.
  let cells;
  if (p.pos === 'QB') {
    cells = [['Pass yds', nz(s.pass_yds)], ['Pass TD', nz(s.pass_td)], ['INT', nz(s.pass_int)],
             ['Rush yds', nz(s.rush_yds)], ['Rush TD', nz(s.rush_td)], ['Fumbles lost', s.fum_lost == null ? '—' : s.fum_lost]];
  } else if (p.pos === 'RB') {
    cells = [['Carries', nz(s.rush_att)], ['Rush yds', nz(s.rush_yds)], ['Rush TD', nz(s.rush_td)],
             ['Rec', nz(s.rec)], ['Rec yds', nz(s.rec_yds)], ['Rec TD', nz(s.rec_td)]];
  } else {
    cells = [['Targets', nz(s.targets)], ['Rec', nz(s.rec)], ['Rec yds', nz(s.rec_yds)],
             ['Rec TD', nz(s.rec_td)], ['Yds/rec', s.rec ? (s.rec_yds / s.rec).toFixed(1) : '—'],
             ['Games', nz(s.games)]];
    if ((s.rush_att || 0) > 0) {
      cells = cells.concat([['Carries', nz(s.rush_att)], ['Rush yds', nz(s.rush_yds)], ['Rush TD', nz(s.rush_td)]]);
    }
  }
  return head
    + `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:#1E2A3A;border:1px solid #1E2A3A;border-radius:10px;overflow:hidden">`
    + cells.map(c => `<div style="background:#111A28;padding:10px 11px"><div style="font-size:9.5px;color:#5C7080;text-transform:uppercase;letter-spacing:.04em">${c[0]}</div>`
        + `<div style="font-size:16px;font-weight:700;font-family:var(--mono,monospace);margin-top:2px">${c[1]}</div></div>`).join('')
    + `</div>`;
}

// ── DELTA Score Arc ──────────────────────────────────────────────────────────
function buildDSTrajectoryHTML(p) {
  if (isNFLRookie(p)) {
    // A rookie's score is a draft-capital prior — there is no prior season to
    // estimate and no basis to roll one forward. Fabricating a year-2 score
    // from a conservative seed reads as a bust call; the honest display is
    // the current prior and a note that the trajectory unlocks with real games.
    return `<div class="card">
      <div class="card-label" style="margin-bottom:8px">DELTA Score Trajectory</div>
      <div style="display:flex;align-items:baseline;gap:10px">
        <span style="font-size:26px;font-weight:800;color:${dsColor(p.dsScore)}">${p.dsScore}</span>
        <span style="font-size:10px;color:#8CA0B3">2025 — draft-capital prior</span>
      </div>
      <div style="font-size:9.5px;color:#5C7080;margin-top:8px;line-height:1.5">
        Rookie — no NFL seasons to chart. The score is a capital-based prior; the trajectory unlocks once real games replace it.
      </div>
    </div>`;
  }
  const ds = p.dsScore;
  if (ds == null) return '';

  /* CALL THE REAL SCORER. These two estimates used to be computed here as
     pA + pP + pO + pC — the RAW axis maxima, 25/32/33/10 — while the 2025 score
     sitting between them comes from calcDynastyScore's WEIGHTED 15/45/30/10, with
     the youth multiplier, the RB opportunity downweight and post-clip scarcity.
     Two different scales on one chart: the arrows were reading partly as movement
     in the player and partly as the difference between two formulas. Feeding shifted
     inputs through the real function is the only version that cannot drift again —
     if the weights change, all three numbers change together.

     What is shifted, and nothing else: age, and which seasons count as recent
     production. Opportunity and contract stay at today's values (the footnote says
     so) because there is no honest way to age them. p.ppg22 is not a field any RAW
     row carries, so 2024's third season is genuinely absent and passes as 0 — the
     same as it did before. */
  const at = (age, r1, r2, r3, games) =>
    calcDynastyScore({ ...p, a: age, ppg25: r1 || 0, ppg24: r2 || 0, ppg23: r3 || 0, g25: games });

  const ds2024 = at((p.a || 22) - 1, p.ppg24, p.ppg23, 0,        p.g24 || 16);
  const ds2026 = at((p.a || 22) + 1, p.proj || p.ppg25, p.ppg25, p.ppg24, p.g25 || 0);

  const dsC = dsColor(ds);
  const d4C = dsColor(ds2024);
  const d6C = dsColor(ds2026);

  const bar = (score, color) => `
    <div style="height:4px;background:#111A28;border-radius:3px;overflow:hidden;margin-bottom:4px">
      <div style="width:${Math.round((score/100)*100)}%;height:100%;background:${color};border-radius:3px"></div>
    </div>`;

  const pt = (yr, score, color, note) => `
    <div style="flex:1;text-align:center">
      <div style="font-size:9px;color:#5C7080;margin-bottom:5px">${yr}</div>
      ${bar(score, color)}
      <div style="font-size:24px;font-weight:800;line-height:1;color:${color}">${score}</div>
      <div style="font-size:9px;color:#5C7080;margin-top:3px">${note}</div>
    </div>`;

  const arr = (from, to) => {
    const c = to > from ? '#10B981' : to < from ? '#EA7A66' : '#8CA0B3';
    const sym = to > from ? '↑' : to < from ? '↓' : '→';
    return `<div style="font-size:18px;color:${c};padding-top:18px;flex-shrink:0">${sym}</div>`;
  };

  return `<div class="card">
    <div class="card-label" style="margin-bottom:2px">DELTA Score Arc</div>
    <div class="card-sub" style="margin-bottom:14px">Estimated 2024 · Current 2025 · Projected 2026</div>
    <div style="display:flex;align-items:flex-start;gap:8px">
      ${pt('2024 est', ds2024, d4C, 'approx')}
      ${arr(ds2024, ds)}
      ${pt('2025', ds, dsC, 'current')}
      ${arr(ds, ds2026)}
      ${pt('2026 proj', ds2026, d6C, 'if proj holds')}
    </div>
    <div style="font-size:9px;color:#5C7080;margin-top:10px;text-align:center">
      2024 uses age−1 and prior production · opportunity &amp; contract approximated from current values
    </div>
  </div>`;
}

// ── PPG Trend ─────────────────────────────────────────────────────────────────
function buildProductionHTML(p) {
  const years = [
    { yr: '2022', ppg: p.ppg22 || 0, g: p.g22 || null },
    { yr: '2023', ppg: p.ppg23 || 0, g: p.g23 || null },
    { yr: '2024', ppg: p.ppg24 || 0, g: p.g24 || null },
    { yr: '2025', ppg: p.ppg25 || 0, g: p.g25 || null },
  ].filter(y => y.ppg > 0);
  if (!years.length) return '';

  const posAvg = DS_AVG[p.pos] || 12;
  const maxPpg = Math.max(...years.map(y => y.ppg), 1);
  const barH = 56;

  // Three separate rows: values, bars, labels
  const vals = years.map(y =>
    `<div style="flex:1;text-align:center;font-size:10px;font-weight:600;color:${ppgClr(y.ppg)}">${y.ppg.toFixed(1)}</div>`
  ).join('');

  const bars = years.map(y => {
    const h = Math.max(8, Math.round((y.ppg / maxPpg) * barH));
    return `<div style="flex:1;display:flex;align-items:flex-end">
      <div style="width:100%;height:${h}px;background:${ppgClr(y.ppg)};border-radius:2px 2px 0 0"></div>
    </div>`;
  }).join('');

  const lbls = years.map(y =>
    `<div style="flex:1;text-align:center;font-size:9px;color:#5C7080">${y.yr.slice(2)}</div>`
  ).join('');

  const tableRows = years.map(y => {
    const diff = (y.ppg - posAvg).toFixed(1);
    const dc = diff > 0 ? '#10B981' : diff < 0 ? '#EA7A66' : '#8CA0B3';
    return `<tr>
      <td>${y.yr}</td>
      <td style="color:${ppgClr(y.ppg)};font-weight:600">${y.ppg.toFixed(1)}</td>
      <td style="color:#8CA0B3">${y.g != null && y.g > 0 ? y.g : '—'}</td>
      <td style="color:${dc}">${diff > 0 ? '+' : ''}${diff}</td>
    </tr>`;
  }).join('');

  return `<div class="card">
    <div class="card-label" style="margin-bottom:2px">PPG Trend</div>
    <div class="card-sub" style="margin-bottom:10px">Adjusted for current scoring format</div>
    <div style="display:flex;gap:4px;margin-bottom:2px">${vals}</div>
    <div style="display:flex;gap:4px;height:${barH}px">${bars}</div>
    <div style="display:flex;gap:4px;margin-top:3px;margin-bottom:10px">${lbls}</div>
    <table class="prod-table">
      <thead><tr>
        <th>Season</th><th>PPG</th><th>Games</th>
        <th title="PPG vs current-season positional average — same value used across all years">vs pos avg *</th>
      </tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
    <div style="font-size:9px;color:#5C7080;margin-top:6px">* Pos avg = ${posAvg} PPG (current-season average, applied flat across all years) · Games load from nightly pipeline</div>
  </div>`;
}

// ── EPA / Efficiency ──────────────────────────────────────────────────────────
// QB TD% trend — DISPLAY ONLY. Context for the manager; never feeds the DELTA Score.
// Research (2017-25, 203 QB pairs): ~69% of the gap between a season's TD% and the QB's
// own baseline is given back the next year. It did NOT add lift to fantasy projection
// beyond production DELTA already models — so we show it, we don't score it.
function buildTDPctHTML(p) {
  if (p.pos !== 'QB' || typeof PLAYER_STATS === 'undefined' || !PLAYER_STATS[p.n]) return '';
  const LG = 4.6, GIVEBACK = 0.69;
  const st = PLAYER_STATS[p.n];
  const yrs = ['2022', '2023', '2024', '2025'];
  const rows = yrs.map(y => {
    const s = st[y];
    const att = (s && +s.pass_att) || 0, td = (s && +s.pass_td) || 0;
    return { yr: y, v: att >= 100 ? (100 * td / att) : 0, att };   // 100-att floor: a cameo has no meaningful rate
  }).filter(x => x.v > 0);
  if (!rows.length) return '';

  let cTd = 0, cAtt = 0;
  yrs.forEach(y => {
    const s = st[y];
    if (s && +s.pass_att >= 100) { cTd += (+s.pass_td || 0); cAtt += (+s.pass_att || 0); }
  });
  const baseline = cAtt > 0 ? (100 * cTd / cAtt) : LG;   // attempt-weighted, not a mean of rates
  const latest = rows[rows.length - 1];
  const r1 = v => Math.round(v * 10) / 10;   // moved up: was declared after first use (TDZ crash on QB pages)
  const gap = r1(latest.v) - r1(baseline);
  const proj = latest.v - gap * GIVEBACK;
  const maxV = Math.max(...rows.map(x => x.v), baseline, 6);
  const barH = 46;
  // colored vs HIS OWN baseline — a high TD% is not "good", it's "hot"
  // Grade on DISPLAYED (1-dp) numbers so two seasons that both read e.g. "7.0%" can never
  // get different colors from a float straddling the threshold.
  const HOT = 1.0;
  const clr = v => (r1(v) - r1(baseline)) >= HOT ? '#E0B34D' : (r1(v) - r1(baseline)) <= -HOT ? '#6BB6E0' : '#5C7080';

  const vals = rows.map(x => `<div style="flex:1;text-align:center;font-size:10px;color:#8CA0B3">${x.v.toFixed(1)}%</div>`).join('');
  const bars = rows.map(x => `<div style="flex:1;display:flex;align-items:flex-end;justify-content:center">
      <div style="width:100%;border-radius:3px 3px 0 0;background:${clr(x.v)};height:${Math.max(8, Math.round(x.v / maxV * barH))}px"></div>
    </div>`).join('');
  const lbls = rows.map(x => `<div style="flex:1;text-align:center;font-size:9px;color:#5C7080">'${x.yr.slice(2)}</div>`).join('');

  let note = '';
  if (Math.abs(gap) >= HOT && rows.length >= 2) {
    const hot = gap > 0;
    note = `<div style="font-size:11px;line-height:1.6;color:#8CA0B3;margin-top:10px;padding:8px 10px;background:#0D1420;border-left:2px solid ${hot ? '#E0B34D' : '#6BB6E0'};border-radius:0 6px 6px 0">
      TD rate <b style="color:${hot ? '#E0B34D' : '#6BB6E0'}">${latest.v.toFixed(1)}%</b> is
      <b style="color:${hot ? '#E0B34D' : '#6BB6E0'}">${Math.abs(gap).toFixed(1)} pts ${hot ? 'above' : 'below'}</b>
      his own baseline of ${baseline.toFixed(1)}%.
      ${hot ? 'Historically ~69% of that gap is given back' : 'Rates this far below a QB\'s norm tend to bounce back'} —
      a repeat would look closer to <b style="color:#EAF0F4">${proj.toFixed(1)}%</b>.
    </div>`;
  }

  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
      <div>
        <div class="card-label" style="margin-bottom:2px">TD% Trend</div>
        <div class="card-sub">Passing TDs per attempt · context only, not scored</div>
      </div>
      <div style="text-align:right;line-height:1.4;flex-shrink:0">
        <div style="font-size:11px;color:#8CA0B3">Baseline <b style="color:#EAF0F4;font-family:var(--mono)">${baseline.toFixed(1)}%</b></div>
        <div style="font-size:11px;color:#5C7080">Lg Avg. <b style="font-family:var(--mono)">${LG}%</b></div>
      </div>
    </div>
    <div style="display:flex;gap:4px;margin-bottom:2px">${vals}</div>
    <div style="display:flex;gap:4px;height:${barH}px">${bars}</div>
    <div style="display:flex;gap:4px;margin-top:3px">${lbls}</div>
    <div style="display:flex;gap:12px;margin-top:7px;font-size:10px;color:#5C7080">
      <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#E0B34D;margin-right:4px"></span>above his norm — due to regress</span>
      <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#6BB6E0;margin-right:4px"></span>below — due to bounce back</span>
    </div>
    ${note}
  </div>`;
}

function buildEPAHTML(p) {
  const posLabel = p.pos === 'QB' ? 'Passing' : p.pos === 'RB' ? 'Rushing' : 'Receiving';
  const sublabel = `${posLabel} EPA per play by season — how much scoring value this player added above average on each touch or route`;

  const epas = [
    { yr: '2022', v: p.e22 || 0 },
    { yr: '2023', v: p.e23 || 0 },
    { yr: '2024', v: p.e24 || 0 },
    { yr: '2025', v: p.e25 || 0 },
  ].filter(x => x.v !== 0);

  if (!epas.length) return '';

  // Absolute scale: 0.25 EPA/play fills the bar fully (elite level for any position)
  const SCALE = 0.25;

  const getClr = v => {
    const a = Math.abs(v);
    if (v >= 0) return a >= 0.12 ? '#10B981' : a >= 0.04 ? '#34D399' : '#E0B34D';
    else        return a >= 0.12 ? '#E05745' : a >= 0.04 ? '#EA7A66' : '#E0B34D';
  };

  const rows = epas.map(x => {
    const pct = Math.min(100, Math.round((Math.abs(x.v) / SCALE) * 100));
    const clr = getClr(x.v);
    const isPos = x.v >= 0;
    const sign = x.v > 0 ? '+' : '';
    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #111A28">
      <div style="font-size:10px;color:#8CA0B3;width:26px;flex-shrink:0">${x.yr.slice(2)}</div>
      <div style="flex:1;display:flex;justify-content:flex-end;align-items:center;height:8px">
        ${!isPos ? `<div style="width:${pct}%;height:100%;background:${clr};border-radius:3px 0 0 3px"></div>` : ''}
      </div>
      <div style="width:2px;height:14px;background:#5C7080;flex-shrink:0;border-radius:1px"></div>
      <div style="flex:1;display:flex;justify-content:flex-start;align-items:center;height:8px">
        ${isPos ? `<div style="width:${pct}%;height:100%;background:${clr};border-radius:0 3px 3px 0"></div>` : ''}
      </div>
      <div style="font-size:11px;font-weight:600;color:${clr};width:42px;text-align:right">${sign}${x.v.toFixed(2)}</div>
    </div>`;
  }).join('');

  const trendClr = p.epaTr === 'up' ? '#10B981' : p.epaTr === 'down' ? '#E05745' : '#8CA0B3';
  const trendTxt = p.epaTr === 'up' ? '↑ Improving' : p.epaTr === 'down' ? '↓ Declining' : '→ Flat';

  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
      <div>
        <div class="card-label" style="margin-bottom:2px">EPA per Play</div>
        <div class="card-sub">${sublabel}</div>
      </div>
      ${p.epaTr ? `<span style="font-size:10px;font-weight:600;color:${trendClr};flex-shrink:0;margin-left:10px">${trendTxt}</span>` : ''}
    </div>
    ${rows}
    <div style="display:flex;justify-content:space-between;font-size:9px;color:#5C7080;margin-top:6px;padding:0 34px 0 0">
      <span>← below avg</span>
      <span>above avg →</span>
    </div>
  </div>`;
}

// ── Opportunity ───────────────────────────────────────────────────────────────
function buildOpportunityHTML(p) {
  const oppSc = getOppScore(p.n, p.pos);
  if (!oppSc) {
    // QBs (and anyone ungraded for opportunity) still get the scheme context —
    // popup ⊆ full card: nothing shown in the popup may be missing here.
    if (p.sys == null) return '';
    return `<div class="card">
      <div class="card-label" style="margin-bottom:8px">Offense / Scheme</div>
      ${buildSchemeHTML(p)}
    </div>`;
  }
  const st25 = (typeof PLAYER_STATS !== 'undefined') && PLAYER_STATS[p.n] && PLAYER_STATS[p.n]['2025'];
  const isWR = p.pos === 'WR' || p.pos === 'TE';
  const scC = oppScoreColor ? oppScoreColor(oppSc) : (oppSc>=88?'#10B981':oppSc>=70?'#6BB6E0':oppSc>=55?'#E0B34D':'#E05745');
  const tier = oppSc>=88?(isWR?'Elite alpha':'Elite workhorse'):oppSc>=75?'Clear starter':oppSc>=60?'Role player':'Committee/specialist';
  const sysClr = p.sys>=70?'#10B981':p.sys>=55?'#6BB6E0':p.sys>=40?'#E0B34D':'#E05745';

  let usageRows = '';
  if (st25) {
    const tgtS = st25.target_share || 0;
    const airS = st25.air_yds_share || 0;
    const rzT = st25.rz_targets;
    const rzC = st25.rz_carries;
    if (isWR) {
      usageRows = [
        ['Target share', (tgtS*100).toFixed(1)+'%', tgtS>=.28?'#10B981':tgtS>=.20?'#6BB6E0':tgtS>=.14?'#E0B34D':'#E05745'],
        ['Air yards share', (airS*100).toFixed(1)+'%', airS>=.38?'#10B981':airS>=.28?'#6BB6E0':airS>=.18?'#E0B34D':'#E05745'],
        ['RZ targets', rzT!=null?rzT:'—', rzT>=18?'#10B981':rzT>=12?'#6BB6E0':rzT>=7?'#E0B34D':'#E05745'],
      ].map(([l,v,c])=>`<div class="bdr-row"><span style="color:#8CA0B3">${l}</span><span style="font-weight:600;color:${c}">${v}</span></div>`).join('');
    } else {
      const g = st25.games || 17;
      const rsRaw = st25.rush_share || 0;
      // Apply same 17/g adjustment used in workhorse score — rush_share in the pipeline
      // is a season total ratio (player carries / team carries), so it's diluted by missed
      // games. Adjusted value reflects true per-game role intensity when active.
      const rsAdj = Math.min(1, rsRaw * (17 / g));
      const rsLabel = g < 17 ? `Rush share/game · ${g}g` : 'Rush share';
      usageRows = [
        [rsLabel, (rsAdj*100).toFixed(1)+'%', rsAdj>=.55?'#10B981':rsAdj>=.40?'#6BB6E0':rsAdj>=.25?'#E0B34D':'#E05745'],
        ['Target share', (tgtS*100).toFixed(1)+'%', tgtS>=.18?'#10B981':tgtS>=.12?'#6BB6E0':tgtS>=.08?'#E0B34D':'#E05745'],
        ['RZ carries', rzC!=null?rzC:'—', rzC>=55?'#10B981':rzC>=35?'#6BB6E0':rzC>=20?'#E0B34D':'#E05745'],
        ['RZ targets', rzT!=null?rzT:'—', rzT>=12?'#10B981':rzT>=7?'#6BB6E0':rzT>=3?'#E0B34D':'#E05745'],
      ].map(([l,v,c])=>`<div class="bdr-row"><span style="color:#8CA0B3">${l}</span><span style="font-weight:600;color:${c}">${v}</span></div>`).join('');
    }
  }

  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${usageRows?'10px':'0'}">
      <div>
        <div class="card-label" style="margin-bottom:2px">Opportunity · 2025</div>
        <div class="card-sub" style="color:${scC};font-weight:600">${tier}</div>
      </div>
      <div style="font-size:32px;font-weight:800;line-height:1;color:${scC}">${oppSc}</div>
    </div>
    ${usageRows}
    <div style="margin-top:10px;padding-top:10px;border-top:1px solid #111A28">
      ${buildSchemeHTML(p)}
    </div>
  </div>`;
}

// ── Contract ──────────────────────────────────────────────────────────────────
function buildContractHTML(p) {
  const ct = CONTRACTS.find(c => c.n === p.n);
  if (!ct) return '';
  const fmt = n => n >= 1000000 ? '$' + (n/1000000).toFixed(1) + 'M' : '$' + n.toLocaleString();
  const st = contractStatus(ct);
  const yrsLeft = ct.end - 2025; // inclusive of current 2026 season
  const yrsClr = yrsLeft<=2?'#EA7A66':yrsLeft<=3?'#E0B34D':yrsLeft>=5?'#10B981':'#6BB6E0';
  return `<div class="card">
    <div class="card-label">Contract</div>
    <div class="stat-grid" style="margin-bottom:12px">

// ── Age Curve ─────────────────────────────────────────────────────────────────
function buildAgeCurveHTML(p) {
  const pos = p.pos || p.p || 'WR';
  const ages = Array.from({length: 19}, (_, i) => i + 20); // 20–38
  const scores = ages.map(a => dsAge(a, pos));
  const W = 320, H = 72, padL = 28, padR = 8, padT = 10, padB = 18;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const toX = a => padL + ((a - 20) / 18) * plotW;
  const toY = s => padT + plotH - (s / 25) * plotH;

  const points = ages.map((a, i) => toX(a).toFixed(1) + ',' + toY(scores[i]).toFixed(1)).join(' ');

  // Peak zone — ages where score >= 23
  const peakAges = ages.filter(a => dsAge(a, pos) >= 23);
  const peakStart = peakAges[0] || 20;
  const peakEnd = peakAges[peakAges.length - 1] || 27;
  const pkX1 = toX(peakStart), pkX2 = toX(peakEnd);

  // Fill path under curve (area chart feel)
  const fillPts = ages.map((a, i) => toX(a).toFixed(1) + ',' + toY(scores[i]).toFixed(1)).join(' ');
  const fillPath = 'M ' + toX(20).toFixed(1) + ',' + toY(0).toFixed(1)
    + ' L ' + fillPts.split(' ').join(' L ')
    + ' L ' + toX(38).toFixed(1) + ',' + toY(0).toFixed(1) + ' Z';

  // Player marker
  const clampedAge = Math.min(38, Math.max(20, p.a || 25));
  const playerScore = dsAge(clampedAge, pos);
  const mx = toX(clampedAge), my = toY(playerScore);
  const col = dsColor(p.dsScore || 50);

  // Y-axis ticks at 0, 12, 25
  const yTicks = [0, 12, 25].map(s =>
    '<line x1="' + (padL-3) + '" y1="' + toY(s).toFixed(1) + '" x2="' + padL + '" y2="' + toY(s).toFixed(1) + '" stroke="#1E2A3A" stroke-width="1"/>'
    + '<text x="' + (padL-5) + '" y="' + (toY(s)+3).toFixed(1) + '" fill="#5C7080" font-size="6" text-anchor="end">' + s + '</text>'
  ).join('');

  const ageLabels = [20, 24, 28, 32, 36, 38].map(a =>
    '<text x="' + toX(a).toFixed(1) + '" y="' + (padT+plotH+13) + '" fill="#5C7080" font-size="6" text-anchor="middle">' + a + '</text>'
  ).join('');

  return '<div class="card">'
    + '<div class="card-label" style="margin-bottom:2px">Age Curve · ' + pos + '</div>'
    + '<div class="card-sub" style="margin-bottom:8px">Dynasty value score vs age — green shading marks the prime window</div>'
    + '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;display:block;overflow:visible">'

    // Peak zone shading
    + '<rect x="' + pkX1.toFixed(1) + '" y="' + padT + '" width="' + (pkX2-pkX1).toFixed(1) + '" height="' + plotH + '" fill="#10B981" opacity="0.07" rx="2"/>'

    // Fill under curve
    + '<path d="' + fillPath + '" fill="#5C7080" opacity="0.2"/>'

    // Curve line
    + '<polyline points="' + points + '" fill="none" stroke="#5C7080" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>'

    // Axes
    + '<line x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (padT+plotH) + '" stroke="#1E2A3A" stroke-width="1"/>'
    + '<line x1="' + padL + '" y1="' + (padT+plotH) + '" x2="' + (W-padR) + '" y2="' + (padT+plotH) + '" stroke="#1E2A3A" stroke-width="1"/>'

    // Y ticks + labels
    + yTicks

    // Age labels
    + ageLabels

    // No floating "prime" label in SVG — the green shading shows the window; footer note carries the text

    // Player dot + vertical guide
    + '<line x1="' + mx.toFixed(1) + '" y1="' + (padT+plotH) + '" x2="' + mx.toFixed(1) + '" y2="' + my.toFixed(1) + '" stroke="' + col + '" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>'
    + '<circle cx="' + mx.toFixed(1) + '" cy="' + my.toFixed(1) + '" r="4.5" fill="' + col + '" stroke="#0A0F1A" stroke-width="1.5"/>'

    // Player age label — above dot normally, below when near top to avoid colliding with "prime" label
    + (playerScore >= 22
      ? '<text x="' + mx.toFixed(1) + '" y="' + (my+16).toFixed(1) + '" fill="' + col + '" font-size="6" text-anchor="middle" font-weight="bold">' + clampedAge.toFixed(1) + '</text>'
      : '<text x="' + mx.toFixed(1) + '" y="' + (my-8).toFixed(1)  + '" fill="' + col + '" font-size="6" text-anchor="middle" font-weight="bold">' + clampedAge.toFixed(1) + '</text>'
    )

    + '</svg>'
    + '<div style="font-size:9px;color:#5C7080;text-align:center;margin-top:2px">'
    + pos + ' prime: ages ' + peakStart + '–' + peakEnd + ' · Age score ' + playerScore + '/25'
    + '</div>'
    + '</div>';
}

// ── Comparable Players ────────────────────────────────────────────────────────
function buildComparableHTML(p) {
  const pos = p.pos || p.p || 'WR';
  const ds = p.dsScore;
  if (ds == null) return '';

  const myOpp = getOppScore(p.n, pos) || 50;

  const peers = COMP.filter(x =>
    (x.pos||x.p) === pos &&
    x.n !== p.n &&
    x.dsScore != null &&
    Math.abs((x.dsScore||0) - ds) <= 22
  );

  const scored = peers.map(peer => {
    const dsDiff = Math.abs((peer.dsScore||0) - ds);
    const ageDiff = Math.abs((peer.a||0) - (p.a||0));
    const peerOpp = getOppScore(peer.n, peer.pos) || 50;
    const oppDiff = Math.abs(peerOpp - myOpp);
    const sim = dsDiff * 2.5 + ageDiff * 4.0 + oppDiff * 0.4;
    return { peer, sim, dsDiff, ageDiff };
  });

  const comps = scored.sort((a, b) => a.sim - b.sim).slice(0, 3);
  if (!comps.length) return '';

  const cards = comps.map(({peer, dsDiff, ageDiff}) => {
    const vt = (vTag(peer).match(/>([a-z ]+)</) || [,''])[1];
    const vc = vt.includes('strong buy') ? '#10B981' : vt === 'buy' ? '#10B981'
      : vt === 'hold' ? '#EAF0F4' : vt.includes('strong sell') ? '#EA7A66' : '#E05745';
    const dsc = dsColor(peer.dsScore);
    const team = (typeof AL !== 'undefined' && AL[peer.t]) ? AL[peer.t] : peer.t;
    const note = dsDiff <= 2 ? 'near-identical score'
      : ageDiff <= 0.8 ? 'same age tier'
      : ageDiff <= 1.5 ? (peer.a > p.a ? 'slightly older' : 'slightly younger')
      : 'similar profile';

    return '<div style="display:flex;align-items:center;gap:10px;padding:8px;background:#0D1420;border-radius:6px">'
      + '<div style="flex:1;min-width:0">'
      + '<div style="font-size:12px;font-weight:600;margin-bottom:2px">'
      + '<a href="player.html?name=' + encodeURIComponent(peer.n) + '" style="color:#EAF0F4;text-decoration:none" '
      + 'onmouseover="this.style.color=\'#10B981\'" onmouseout="this.style.color=\'#EAF0F4\'">' + peer.n + '</a>'
      + '</div>'
      + '<div style="font-size:10px;color:#8CA0B3">' + team + ' · Age ' + peer.a.toFixed(1) + ' · ' + note + '</div>'
      + '</div>'
      + '<div style="text-align:right;flex-shrink:0">'
      + '<div style="font-size:20px;font-weight:800;color:' + dsc + ';line-height:1">' + peer.dsScore + '</div>'
      + '<div style="font-size:10px;font-weight:700;color:' + vc + ';text-transform:uppercase;letter-spacing:.04em">' + vt + '</div>'
      + '</div>'
      + '</div>';
  }).join('');

  return '<div class="card">'
    + '<div class="card-label" style="margin-bottom:2px">Comparable Players</div>'
    + '<div class="card-sub" style="margin-bottom:10px">Closest DELTA matches at ' + pos + ' — ranked by score, age, and opportunity similarity</div>'
    + '<div style="display:flex;flex-direction:column;gap:6px">' + cards + '</div>'
    + '</div>';
}

// ── College tab ───────────────────────────────────────────────────────────────
// Reads data/college-index.json: one slim file holding every college season for

// PRE-COMPUTED by scripts/build-college-index.js. Two reasons it is not the raw

//
// LOADED LAZILY — only when the College tab is first opened, never on page load.
// Nothing here feeds the DELTA Score, the projection or the buy/sell call.
let CUR_P = null, _TAB = 'nfl', _CYR = null;
let CFB_INDEX = null, _cfbState = 'idle';   // idle | loading | ready | missing

// The 4 KB companion manifest, loaded during boot. It exists so the College tab can be

// Athletic testing and current depth-chart position. Both are DISPLAY CONTEXT — neither
// feeds the DELTA Score, the projection, the buy/sell call or the ledger. They answer the
// two questions a rookie card could not: how did he test, and who is ahead of him. Depth
// loads at boot (34 KB) because it renders on the NFL tab, the default view; combine loads

let DEPTH = null, COMBINE = null, _combineTried = false;

    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(j => { DEPTH = j || null;
                 console.log('[DELTA] depth charts: ' + Object.keys((j && j.players) || {}).length + ' players'); })
    .catch(e => { console.warn('[DELTA] depth-charts.json not loaded:', e.message); DEPTH = null; });
}
function loadCombine() {

}
function loadCollegeNames() {
  return fetch('./data/college-index-names.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })

                 console.log('[DELTA] college index manifest: ' + CFB_NAMES.size + ' players'); })

                  CFB_NAMES = new Set(); });
}

function ensureCollegeData(p) {

// The position room a rookie is walking into. Deliberately NOT a ranking: an August depth

// So this renders ONLY for players with no NFL game to their name, and it shows WHO ELSE IS
// THERE — with age and DELTA Score where we track them — so the read is yours rather than

function isRookie(p) {

}
function buildDepthHTML(p) {

  const meName = d.name || p.n;
  const rows = room.map(nm => {

      + (age != null ? age + ' yrs' : '\u2013')

  }).join('');
  return '<div class="card"><div class="card-label">The ' + d.slot + ' room \u00b7 ' + d.team
    + '<div class="card-sub">who else is on the roster at his position'
    + (when ? ', as of ' + when : '') + ' \u2014 a camp snapshot, and the order moves</div></div>'

}

function setCYr(y) { _CYR = String(y); repaintCollege(); }
const _cpc = v => v == null ? '-' : (v * 100).toFixed(1) + '%';

// Opponent names run to 24 characters ("Southeast Missouri State") and the game log now

  return s.length > 11 ? s.slice(0, 10) + '\u2026' : s;

function buildCollegeHTML(p) {

  // dDOM and PPA arcs, only when more than one season carries a percentile

    ? '<div style="margin-top:12px;padding-top:11px;border-top:1px solid var(--line)">'
      + '<div style="font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5C7080;margin-bottom:8px">By season · percentile among peers</div>'
      + asc.map(y => {
          const a = all[y]; if (a._ddomPct == null) return '';
          return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">'
            + '<span style="font-size:10px;color:var(--fog);width:30px;flex-shrink:0;font-family:var(--mono)">' + y + '</span>'
            + '<span style="flex:1;height:5px;background:#0D1420;border-radius:3px;overflow:hidden">'
            + '<span style="display:block;height:100%;border-radius:3px;width:' + a._ddomPct + '%;background:' + _cfbColor(a._ddomPct) + '"></span></span>'
            + '<span style="font-size:10px;font-weight:600;width:24px;text-align:right;flex-shrink:0;font-family:var(--mono);color:' + _cfbColor(a._ddomPct) + '">' + a._ddomPct + '</span>'
            + '<span style="font-size:10px;font-weight:600;width:30px;text-align:right;flex-shrink:0;font-family:var(--mono);color:' + (a._ppaPct != null ? _cfbColor(a._ppaPct) : '#5C7080') + '">' + (a._ppaPct != null ? a._ppaPct : '\u2013') + '</span>'
            + '<span style="font-size:9.5px;color:#5C7080;width:52px;text-align:right;flex-shrink:0">' + (a.tm.length > 9 ? a.tm.slice(0, 9) : a.tm) + '</span></div>';
        }).join('')
      + '<div style="display:flex;align-items:center;gap:8px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)">'
      + '<span style="width:30px;flex-shrink:0"></span><span style="flex:1"></span>'
      + '<span style="font-size:8.5px;color:#5C7080;width:24px;text-align:right;flex-shrink:0">dDOM</span>'
      + '<span style="font-size:8.5px;color:#5C7080;width:30px;text-align:right;flex-shrink:0">PPA</span>'
      + '<span style="width:52px;flex-shrink:0"></span></div></div>'
    : '';

  const ddCard = r._ddomPct != null
    ? '<div class="card"><div class="card-label">dDOM \u00b7 ' + yr + ' \u00b7 ' + dLabel
      + '<div class="card-sub">where he ranked among qualifying ' + pos + 's that season, adjusted for who he played</div></div>'
      + '<div style="display:flex;align-items:baseline;gap:10px">'
      + '<span style="font-size:30px;font-weight:800;font-family:var(--mono);line-height:1;color:' + _cfbColor(r._ddomPct) + '">' + r._ddomPct + '</span>'
      + '<span style="font-size:11px;color:var(--fog)">' + _ord(r._ddomPct) + ' percentile \u00b7 ' + r._ddomRaw + dUnit + ' ' + dName + '</span></div>'
      + '<div style="height:6px;background:#0D1420;border-radius:3px;overflow:hidden;margin:10px 0 6px"><div style="height:100%;border-radius:3px;width:' + r._ddomPct + '%;background:' + _cfbColor(r._ddomPct) + '"></div></div>'
      + '<div style="display:flex;justify-content:space-between;font-size:9px;color:#5C7080;font-family:var(--mono)"><span>0</span><span>vs ' + r._ddomPeers + ' qualifying ' + pos + 's</span><span>100</span></div>'
      + '<div style="font-size:10px;color:#5C7080;line-height:1.6;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">Opponent quality ' + _cpc(r.tpct) + '. '
      + (r.p4 ? 'Power 4 conference.' : 'Non-Power-4 conference \u2014 the schedule adjustment pulls this number down, not up.') + '</div>'
      + arc + '</div>'
    : '<div class="card"><div class="card-label">dDOM \u00b7 ' + yr + '</div>'
      + '<div style="font-size:11.5px;color:#5C7080;padding:6px 0;line-height:1.6">Below the qualifying volume floor that season, so no competition-adjusted percentile is computed.</div>' + arc + '</div>';

  // Third box is the one number that describes his ROLE that season. It is NOT CFBD's
  // usage share: that is the share of team plays he was the ball-handler on, which for a
  // QB is just how pass-heavy the offence was (median .54 in 2024), not a fact about him.
  const b3 = pos === 'QB' ? { v: _cpc(r.cmppct), l: 'completion %' }
           : pos === 'RB' ? { v: _cpc(r.rdom),   l: 'rush dominator' }   // the RUSHING half, shown alongside the blended dDOM
                          : { v: _cpc(r.rsh),    l: 'reception share' };
  const ppaL = pos === 'QB' ? 'passing PPA/play' : 'PPA/play';   // RB = all plays, matching all-purpose dDOM
  const hasPpa = r._ppaPct != null;

  let rows;
  if (pos === 'QB') rows = [['Completions', r.cmp + '/' + r.att], ['Pass yards', r.py],
      ['Pass TD / INT', r.pt + ' / ' + r.pi], ['Yards per attempt', r.ypa], ['ANY/A', r.anya],
      ['Rush yards / TD', r.ry + ' / ' + r.rt]];
  else if (pos === 'RB') rows = [['Carries', r.car], ['Rush yards', r.ry],
      ['Yards per carry', r.car ? (r.ry / r.car).toFixed(1) : '-'], ['Rush TD', r.rt],
      ['Receptions', r.rec], ['Receiving yards', r.rey],
      ['Receiving dominator', _cpc(r.dom)]];
  else rows = [['Receptions', r.rec], ['Receiving yards', r.rey],
      ['Yards per catch', r.rec ? (r.rey / r.rec).toFixed(1) : '-'], ['Receiving TD', r.ret],
      ['Dominator', _cpc(r.dom)]];
  if (hasPpa) rows.push([ppaL, r._ppaRaw.toFixed(2)]);

  const prodCard = '<div class="card"><div class="card-label">' + yr + ' production \u00b7 ' + r.tm + '</div>'
    + '<div class="stat-grid" style="margin-bottom:' + (hasPpa ? '12px' : '6px') + ';grid-template-columns:repeat(' + (hasPpa ? 3 : 2) + ',1fr)">'
    + '<div class="stat-box"><div class="stat-val">' + r.gms + '</div><div class="stat-lbl">games</div></div>'
    + (hasPpa ? '<div class="stat-box"><div class="stat-val" style="color:' + _cfbColor(r._ppaPct) + '">' + r._ppaPct + _ord(r._ppaPct) + '</div><div class="stat-lbl">percentile<br><span style="color:#5C7080">per-play efficiency</span></div></div>' : '')
    + '<div class="stat-box"><div class="stat-val">' + _cN(b3.v) + '</div><div class="stat-lbl">' + b3.l + '</div></div></div>'
    + (!hasPpa ? '<div style="font-size:10px;color:#5C7080;line-height:1.6;margin-bottom:10px">No per-play efficiency percentile for ' + yr + ' \u2014 he was below the qualifying volume floor, or the season has no PPA on record.</div>' : '')
    + rows.map(x => '<div class="bdr-row"><span style="color:var(--fog)">' + x[0] + '</span><b style="font-family:var(--mono);font-weight:600">' + _cN(x[1]) + '</b></div>').join('')
    + '<div style="font-size:10px;color:#5C7080;line-height:1.7;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)">'
    + '<b style="color:var(--fog)">Per-play efficiency</b> \u2014 a percentile, not a placing. '
    + (hasPpa ? r._ppaPct + _ord(r._ppaPct) + ' percentile means he was ahead of about '
        + Math.round(r._ppaPct * r._ppaPeers / 100) + ' of the ' + r._ppaPeers + ' qualifying ' + pos
        + 's that season on predicted points added per play \u2014 NOT that he ranked ' + r._ppaPct + _ord(r._ppaPct) + '. ' : '')
    + 'A percentile rather than the raw score because the raw scale is not comparable across seasons: CFBD changed how it computes receiver efficiency in 2025 and halved every receiver\u2019s number with nothing changing on the field. The raw value is in the table above.'
    + (pos === 'QB' ? '<br><b style="color:var(--fog)">ANY/A</b> \u2014 adjusted net yards per attempt: (pass yards + 20 \u00d7 TD \u2212 45 \u00d7 INT) \u00f7 attempts. One number for passing efficiency that rewards touchdowns and punishes picks, so a checkdown QB does not grade elite. College box scores carry no sack data, so this is the passing-only variant.' : '')
    + (pos === 'RB' ? '<br><b style="color:var(--fog)">dDOM for backs is all-purpose</b> \u2014 an equal blend of his share of team rushing and his share of team receiving. Rushing-only undersold pass-catching backs; both halves are listed above.' : '')
    + ((pos === 'WR' || pos === 'TE') ? '<br><b style="color:var(--fog)">Dominator</b> \u2014 average of his share of team receiving yards and receiving TDs. <b style="color:var(--fog)">Reception share</b> \u2014 his receptions over team receptions, the honest stand-in for target share.' : '')
    + '</div></div>';

  const cls = { 1:'Freshman', 2:'Sophomore', 3:'Junior', 4:'Senior', 5:'Senior (5th)' }[r.cls] || 'class n/a';
  const pedCard = '<div class="card"><div class="card-label">Recruiting pedigree</div>'
    + '<div class="bdr-row"><span style="color:var(--fog)">Recruit rating' + (carried ? '<span style="color:#5C7080"> \u00b7 from ' + carried + ' file</span>' : '') + '</span><b style="font-family:var(--mono)">' + (r.stars != null ? r.stars + '\u2605 \u00b7 ' + r.rating : '-') + '</b></div>'
    + '<div class="bdr-row"><span style="color:var(--fog)">Recruiting class</span><b style="font-family:var(--mono)">' + _cN(r.rcls) + '</b></div>'
    + '<div class="bdr-row"><span style="color:var(--fog)">Class<span style="color:#5C7080"> \u00b7 latest on file</span></span><b style="font-family:var(--mono)">' + cls + '</b></div>'
    + '<div class="bdr-row"><span style="color:var(--fog)">Conference</span><b style="font-family:var(--mono)">' + r.conf + '</b></div>'
    + '<div class="bdr-row"><span style="color:var(--fog)">Age that season</span><b style="font-family:var(--mono)">' + _cN(r.ageEst) + '</b></div></div>';

  let glCard = ''; const g = r.g || [];
  if (g.length) {
    // Column sets match cfbGameLogTable() in index.html and gameLogTable() in
    // cfb-player.html so the same game reads the same everywhere. The earlier set here
    // dropped rushing TDs for QBs and receiving TDs for backs — a QB's rushing scores and
    // a receiving back's touchdowns are exactly the production this tab exists to show.
    const cols = pos === 'QB'
      ? [['C/ATT','ca'],['Yds','py'],['TD','pt'],['INT','pi'],['Car','car'],['RuYd','ry'],['RuTD','rt']]
      : pos === 'RB'
      ? [['Car','car'],['RuYd','ry'],['RuTD','rt'],['Rec','rec'],['ReYd','rey'],['ReTD','ret']]
      : [['Rec','rec'],['ReYd','rey'],['ReTD','ret'],['Car','car'],['RuYd','ry'],['RuTD','rt']];
    const rows2 = g.slice().sort((a, b) => (a.w || 0) - (b.w || 0));
    glCard = '<div class="card"><div class="card-label">' + yr + ' game log</div>'
      + '<div style="overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch">'
      + '<table class="prod-table cgl" style="font-size:10.5px"><thead><tr>'
      + '<th>Wk</th><th style="text-align:left">Opp</th>'
      + cols.map(c => '<th>' + c[0] + '</th>').join('')
      + '</tr></thead><tbody>'
      + rows2.map(x => '<tr><td>' + (x.w || '-') + '</td>'
          + '<td class="opp" style="text-align:left;color:var(--fog)" title="'
          + String(x.opp || '').replace(/"/g, '&quot;') + '">' + _opp(x.opp) + '</td>'
          + cols.map(c => '<td>' + _cN(x[c[1]]) + '</td>').join('') + '</tr>').join('')
      + '</tbody></table></div></div>';
  }
  // Postseason: its own section, never merged into anything above. Hidden entirely when
  // the player has no line — with opt-outs and only ~two thirds of teams reaching a bowl,
  // an empty box would be the common case and would read as a fault rather than a fact.
  let postCard = '';
  const post = r._post || [];
  if (post.length) {
    const pcols = pos === 'QB'
      ? [['C/ATT','ca'],['Yds','py'],['TD','pt'],['INT','pi'],['Car','car'],['RuYd','ry'],['RuTD','rt']]
      : pos === 'RB'
      ? [['Car','car'],['RuYd','ry'],['RuTD','rt'],['Rec','rec'],['ReYd','rey'],['ReTD','ret']]
      : [['Rec','rec'],['ReYd','rey'],['ReTD','ret'],['Car','car'],['RuYd','ry'],['RuTD','rt']];
    postCard = '<div class="card" style="border-color:#2A3547">'
      + '<div class="card-label" style="color:var(--topaz)">Postseason \u00b7 ' + yr
      + '<div class="card-sub" style="color:#5C7080">Bowl and playoff games. Shown separately and '
      + 'NOT counted in any number above \u2014 participation is not uniform, so folding these in '
      + 'would rank players on different amounts of football.</div></div>'
      + '<div style="overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch">'
      + '<table class="prod-table cgl"><thead><tr><th style="text-align:left">Opponent</th>'
      + pcols.map(c => '<th>' + c[0] + '</th>').join('') + '</tr></thead><tbody>'
      + post.map(x => '<tr><td class="opp" style="text-align:left;color:var(--paper);font-weight:600" title="'
          + String(x.opp || '').replace(/"/g, '&quot;') + '">' + _opp(x.opp) + '</td>'
          + pcols.map(c => '<td>' + _cN(x[c[1]]) + '</td>').join('') + '</tr>').join('')
      + '</tbody></table></div>'
      + (post.length > 1
          ? '<div style="font-size:10px;color:#5C7080;margin-top:9px">'
            + post.length + ' games \u2014 a College Football Playoff run.</div>'
          : '')
      + '</div>';
  }

  // Combine: the pre-NFL athletic profile. Shown ONLY for players with no NFL game yet,
  // for the same reason the position room is — once a player has actually produced in the
  // NFL, how fast he ran at 22 is superseded by what he has since done on the field. It is
  // pre-draft context for a card that has no NFL production to show, not a permanent stat.
  let combCard = '';
  const cmb = (isRookie(p) && COMBINE && COMBINE.players) ? COMBINE.players[p.n] : null;
  if (cmb) {
    const drills = [['forty','40 yd','s'],['vertical','Vertical','"'],['broad_jump','Broad','"'],
                    ['cone','3-cone','s'],['shuttle','Shuttle','s'],['bench','Bench','reps']];
    const have = drills.filter(d => cmb[d[0]] != null);
    const size = [cmb.ht ? cmb.ht : null, cmb.wt ? Math.round(cmb.wt) + ' lb' : null]
                   .filter(Boolean).join(' \u00b7 ');
    combCard = '<div class="card"><div class="card-label">Combine'
      + (cmb.season ? ' \u00b7 ' + cmb.season : '')
      + '<div class="card-sub">measured, not rated \u2014 a blank drill means he did not run it</div></div>'
      + (size ? '<div style="font-size:15px;font-weight:700;font-family:var(--mono);margin-bottom:'
                + (have.length ? '11px' : '2px') + '">' + size + '</div>' : '')
      + (have.length
          ? '<div class="stat-grid" style="grid-template-columns:repeat(' + Math.min(3, have.length) + ',1fr)">'
            + have.map(d => '<div class="stat-box"><div class="stat-val" style="color:var(--sky)">'
                + cmb[d[0]] + '</div><div class="stat-lbl">' + d[1] + '</div></div>').join('')
            + '</div>'
          : '<div style="font-size:11px;color:#5C7080;line-height:1.6">Measured at the combine but ran no drills.</div>')
      + '</div>';
  }

  const foot = '<div class="card" style="background:#0D1420"><div style="font-size:10.5px;color:#5C7080;line-height:1.65">'
    + 'College numbers are tracking data only. They do not feed the DELTA Score, the projection, or the buy/sell call \u2014 those stay NFL production only. '
    + 'Season totals and every percentile are <b style="color:var(--fog)">regular season</b>; bowl and playoff games appear only in the Postseason section.</div></div>';
  return pills + ddCard + prodCard + pedCard + combCard + glCard + postCard + foot;
}

function _renderPlayerPage(p) {
  CUR_P = p;
  ensureScoutData().then(() => {
    const el = document.getElementById('scout-text');
    if (!el) return;
    // Same suppression rule as the authored Read core, from the same shared test in the
    // engine, so the two can never disagree about whether a player's copy still stands.
    const reason = (typeof copyStaleReason === 'function') ? copyStaleReason(p) : null;
    const txt = SCOUT[p.n];
    if (txt && reason) {
      el.style.color = '#5C7080';
      el.textContent = 'Scouting report hidden — ' + p.n + ' is currently ' + reason
        + '. It was written before that and describes a role he is not in right now.';
    } else {
      el.style.color = '#8CA0B3';
      el.textContent = txt || 'No scouting report available yet.';
    }
    // Date stamp: an undated take invites "this is wrong"; a dated one reads as
    // "this was the view then", which is what it actually is.
    const stamp = document.getElementById('scout-stamp');
    if (stamp) {
      const g = (typeof SCOUT_GENERATED !== 'undefined') ? SCOUT_GENERATED : null;
      if (g && txt && !reason) {
        const d = new Date(g);
        stamp.textContent = isNaN(d) ? '' : 'Written ' +
          d.toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
      } else { stamp.textContent = ''; }
    }
  });

  if (!hasCollege(p)) _TAB = 'nfl';
  showContent(`
    ${buildHeroHTML(p)}
    <div id="tabstrip">${buildTabsHTML()}</div>
    <div id="tab-nfl"${_TAB==='nfl'?'':' style="display:none"'}>
    ${buildDSBreakdownHTML(p)}
    ${buildStatLineHTML(p)}
    ${buildReadHTML(p)}
    ${buildStartProfileCard(p)}
    ${buildGameLogCard(p)}
    ${buildDSTrajectoryHTML(p)}
    ${buildAgeCurveHTML(p)}
    ${buildProductionHTML(p)}
    ${buildTDPctHTML(p)}
    ${buildEPAHTML(p)}
    ${buildOpportunityHTML(p)}
    ${buildContractHTML(p)}
    ${buildRippleHTML(p)}
    ${buildComparableHTML(p)}
    ${buildScoutHTML()}
    ${buildDepthHTML(p)}
    </div>
    ${hasCollege(p) ? `<div id="tab-cfb"${_TAB==='cfb'?'':' style="display:none"'}>${buildCollegeHTML(p)}</div>` : ''}
    <div class="freshness">Data refreshes nightly · DELTA v1.0</div>
  `);
  if(_TAB==='cfb'){ ensureCollegeData(p); loadCombine(); }
  document.title = p.n + ' — DELTA';
}

// ── Init ──────────────────────────────────────────────────────────────────────
// Sync league preferences from main app so scores & verdicts match
try {
  const prefs = JSON.parse(localStorage.getItem('delta_settings') || '{}');
  if (prefs.teams) leagueTeams = parseInt(prefs.teams);
  if (prefs.qb)    qbFmt       = prefs.qb;
  if (prefs.fmt)   scoringFmt  = prefs.fmt;
} catch(e) {}

if (!PLAYER_NAME) {
  showError('No player specified. Use <code>player.html?name=Josh+Allen</code>');
} else {
  /* THIS CHAIN MUST MIRROR index.html's bootDelta(), IN ORDER. It did not, and the
     two pages disagreed on 186 buy/sell verdicts, 218 projections and 46 DELTA Scores
     measured against live data. Two separate causes, both fixed here:

       1. loadInjuryOverrides() was missing entirely, so INJ_OUT stayed {} and a player
          confirmed out for the season kept a full projection on his own page while the
          rankings row showed 0 and an OUT badge.

       2. Nothing rebuilt COMP after ensureStartData(). That loader syncs g25 from the
          game logs (136 players on current data) — it mutates RAW, not COMP, so the
          objects built by the earlier loaders kept a stale g25. index.html gets away
          with the same ordering only because renderAll() rebuilds COMP afterwards.
          A stale g25 of 0 on a veteran is not a rounding error: calcProj has an
          early-return rookie path gated on g25===0, so real veterans were being scored
          through the rookie branch. Darnell Washington read "52 · sell" in the rankings
          and "47 · buy" here.

     applyMarketForSetting() is the rebuild (it repoints kMkt and re-runs calcProj over
     RAW). It must run BEFORE the COMP.find below, or p points at a discarded object,
     and while MV_CENTER is still 1, because computeMvCenter() must measure on the raw
     basis — the same compute -> set -> read sequence renderAll() and the freeze use.
     If a loader is ever added to bootDelta, add it here too. */
  loadLiveMarketValues()
    .then(() => loadPlayerStats())
    .then(() => loadPlayerContracts())
    .then(() => loadRipples()).then(() => loadReads())
    .then(() => loadInjuryOverrides())
    .then(() => loadQBStarters())
    .then(() => loadCollegeNames())
    .then(() => loadDepthCharts())
    .then(() => ensureStartData())
    .then(() => {
      applyMarketForSetting();       // rebuild COMP so the g25 sync above is reflected
      const p = COMP.find(x => x.n === PLAYER_NAME);
      if (!p) { showError(`Player not found: <strong>${PLAYER_NAME}</strong>`); return; }
      MV_CENTER = computeMvCenter(); // calibrate to population median — same as renderAll() in index.html
      renderPlayerPage(p);
    })
    .catch(e => showError('Failed to load player data. ' + e.message));
}
</script>
</body>
</html>
